<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../brand/tokens.css">
<style>
 body{width:960px;height:540px;overflow:hidden;background:var(--m-deep);color:var(--m-on-deep)}
 .wrap{position:absolute;inset:0;display:grid;place-items:center}
 h1{font-family:var(--m-font-display);font-size:88px;margin:0;letter-spacing:-.02em}
 .mark{position:absolute;left:60px;top:60px;width:72px;color:var(--m-brand-lift)}
 .sig{font-family:var(--m-font-script);font-size:44px;color:var(--m-signal)}
</style>
<div class="wrap"><div style="text-align:center">
  <h1 id="h">MOMENTUM</h1><div class="sig" id="s">smoke test</div>
</div></div>
<div class="mark" id="m"></div>
<script>
fetch('../../brand/momentum-mark.svg').then(r=>r.text()).then(t=>{document.getElementById('m').innerHTML=t;window.__mark=1});
window.FILM={width:960,height:540,fps:30,duration:2};
const ease=(x)=>1-Math.pow(1-x,3);
window.seek=(t)=>{
  const p=Math.min(1,t/1.2), e=ease(p);
  document.getElementById('h').style.transform=`translateY(${(1-e)*40}px)`;
  document.getElementById('h').style.opacity=e;
  const p2=Math.min(1,Math.max(0,(t-.4)/1.2)), e2=ease(p2);
  document.getElementById('s').style.opacity=e2;
  document.getElementById('m').style.transform=`scale(${.6+.4*ease(Math.min(1,t/.8))})`;
};
window.seek(0);
</script>
