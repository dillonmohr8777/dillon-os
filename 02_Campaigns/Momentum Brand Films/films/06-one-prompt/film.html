<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Momentum — One Prompt</title>
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  html,body { background:var(--m-panel); }
  .stage {
    position:relative; width:1920px; height:1080px; overflow:hidden;
    background:var(--m-panel); color:var(--m-ink);
    font-family:var(--m-font-text); -webkit-font-smoothing:antialiased;
  }
  .lay { position:absolute; inset:0; }
  img { display:block; }

  /* type cuts ─────────────────────────────────────────────────────────── */
  .ax  { font-family:var(--m-font-display); font-weight:400; line-height:1; }
  .exp { font-variation-settings:var(--m-vf-expanded);  letter-spacing:-.028em; }
  .dis { font-variation-settings:var(--m-vf-display);   letter-spacing:-.018em; }
  .con { font-variation-settings:var(--m-vf-condensed); letter-spacing:.13em; }
  .lit { font-variation-settings:var(--m-vf-light);     letter-spacing:-.012em; }
  .ed  { font-family:var(--m-font-editorial); font-weight:400; line-height:1.06;
         letter-spacing:-.006em; }

  /* the desk — the workspace sheet everything is pinned to ─────────────── */
  #deskShadow { position:absolute; left:110px; top:112px; width:1728px; height:888px;
                background:rgba(20,24,27,.11); }
  #desk { position:absolute; left:96px; top:96px; width:1728px; height:888px;
          background:var(--m-warm-canvas); }
  #deskTex { position:absolute; inset:0; background-size:cover; opacity:.30;
             mix-blend-mode:multiply; }
  #deskGrid { position:absolute; inset:0; background-size:cover; opacity:.10;
              mix-blend-mode:multiply; }
  .tape { position:absolute; background-repeat:no-repeat; background-size:100% 100%; }

  /* ── BEAT 1 · the run ────────────────────────────────────────────────── */
  #sc1 { position:absolute; inset:0; background:var(--m-panel); }
  .band { position:absolute; background-repeat:no-repeat; background-size:100% 100%; }
  #run { position:absolute; left:0; top:0; white-space:nowrap; transform-origin:0 0;
         font-family:var(--m-font-display); font-weight:400; line-height:1; }
  #run span { display:inline-block; }
  #runBrad { position:absolute; background-repeat:no-repeat; background-size:100% 100%;
             opacity:0; }
  .bird { position:absolute; }

  /* ── BEAT 2 · the prompt ─────────────────────────────────────────────── */
  .wrap { position:absolute; will-change:transform,opacity; }
  .sh   { position:absolute; background:rgba(226,113,19,.26); }
  .cd   { position:absolute; background:var(--m-warm-surface); overflow:hidden; }

  #pw { left:426px; top:428px; width:1064px; height:232px; opacity:0; }
  #pw .sh { left:13px; top:15px; width:1064px; height:232px; }
  #pw .cd { left:0; top:0; width:1064px; height:232px; }
  #qline { position:absolute; left:46px; top:44px; right:132px; height:62px;
           font-size:45px; font-weight:700; color:var(--m-ink); letter-spacing:-.008em;
           white-space:nowrap; }
  #caret { display:inline-block; width:4px; height:45px; background:var(--m-ink);
           vertical-align:-8px; margin-left:5px; }
  #ghostq { position:absolute; left:46px; top:58px; width:512px; height:20px;
            border-radius:10px; background:var(--m-warm-line); }
  #ptools { position:absolute; left:46px; bottom:34px; display:flex; gap:14px; }
  #ptools i { display:block; width:32px; height:32px; border-radius:8px;
              border:1.5px solid var(--m-warm-line); position:relative; }
  #ptools i::before { content:""; position:absolute; left:50%; top:50%; width:13px; height:2px;
              background:var(--m-warm-muted); transform:translate(-50%,-50%); }
  #ptools i:first-child::after { content:""; position:absolute; left:50%; top:50%;
              width:2px; height:13px; background:var(--m-warm-muted); transform:translate(-50%,-50%); }
  #send { position:absolute; right:26px; bottom:28px; width:66px; height:66px;
          border-radius:50%; background:var(--m-signal);
          display:flex; align-items:center; justify-content:center; }
  #send svg { width:31px; height:31px; display:block; }
  .prule { position:absolute; left:46px; right:46px; top:126px; height:1.5px;
           background:var(--m-warm-line); }

  .fragw { position:absolute; left:426px; top:428px; width:1064px; height:232px;
           opacity:0; will-change:transform,opacity; }
  .fragc { position:absolute; inset:0; }
  .fragb { position:absolute; }

  /* ── BEAT 3 · three surfaces ─────────────────────────────────────────── */
  .gb  { display:block; height:12px; border-radius:6px; background:var(--m-warm-line); }
  .gb.t{ height:15px; background:var(--m-brand); opacity:.74; }
  .gb.u{ height:10px; background:var(--m-warm-muted); opacity:.40; }
  .chip { display:inline-block; background:var(--m-signal); color:var(--m-on-signal);
          font-size:18px; font-weight:800; line-height:1;
          padding:8px 13px 9px; border-radius:5px; white-space:nowrap; }
  .winbox { position:absolute; left:-14px; right:-14px; top:-12px; bottom:-12px;
            border:2.5px solid var(--m-signal-ink); border-radius:8px; }
  .clab { position:absolute; font-family:var(--m-font-display); font-weight:400;
          font-variation-settings:var(--m-vf-condensed); font-size:21px;
          letter-spacing:.26em; color:var(--m-warm-muted); opacity:0; }
  .clab s { display:inline-block; text-decoration:none; }

  #wA { left:96px;  top:372px; width:540px; height:430px; opacity:0; }
  #wB { left:556px; top:236px; width:720px; height:408px; opacity:0; }
  #wC { left:1330px;top:176px; width:452px; height:400px; opacity:0; }
  #wA .sh{ left:11px; top:13px; width:540px; height:430px; }
  #wB .sh{ left:14px; top:16px; width:720px; height:408px; }
  #wC .sh{ left:10px; top:12px; width:452px; height:400px; }
  #wA .cd{ width:540px; height:430px; } #wB .cd{ width:720px; height:408px; }
  #wC .cd{ width:452px; height:400px; }

  #cA .pad { padding:30px 28px 0; }
  #cA .sbar { display:flex; align-items:center; gap:14px; height:44px; padding:0 18px;
              border:1.5px solid var(--m-warm-line); border-radius:999px; }
  .mag { width:15px; height:15px; border-radius:50%; border:2.5px solid var(--m-warm-muted);
         position:relative; flex:0 0 auto; }
  .mag::after { content:""; position:absolute; right:-6px; bottom:-5px; width:9px; height:2.5px;
                background:var(--m-warm-muted); transform:rotate(45deg); }
  #cA .res { position:relative; margin-top:28px; }
  #cA .res .gb + .gb { margin-top:11px; }
  #cA .res.win { margin-top:36px; width:392px; }

  #cB .pad { padding:34px 32px 0; }
  #cB .qrow { display:flex; align-items:center; gap:16px; }
  #cB .av { width:32px; height:32px; border-radius:50%; background:var(--m-mark); flex:0 0 auto; }
  #cB .ans { margin-top:32px; }
  #cB .ans > * { margin-top:16px; }
  #cB .ans > *:first-child { margin-top:0; }
  #cB .inl { display:flex; align-items:center; gap:13px; }
  #cB .cites { display:flex; gap:10px; margin-top:24px; }
  #cB .cites b { width:30px; height:30px; border-radius:7px; background:var(--m-warm-panel);
                 display:flex; align-items:center; justify-content:center;
                 font-size:14px; font-weight:800; color:var(--m-warm-muted); }

  #cC .plate { position:relative; height:180px; background:var(--m-warm-panel); overflow:hidden; }
  #cC .plate u { position:absolute; display:block; background:var(--m-line-strong); opacity:.34; }
  #cC .plate .pin { position:absolute; }
  #cC .pad2 { padding:22px 24px 0; }
  #cC .lrow { position:relative; margin-top:24px; }
  #cC .lrow .gb { margin-top:10px; }
  #cC .lrow:first-child { margin-top:0; }

  /* ── BEAT 4 · the checklist ──────────────────────────────────────────── */
  #check { position:absolute; left:200px; top:300px; width:1060px; }
  .ci { position:absolute; left:0; width:1060px; opacity:0; }
  .ci .dot { position:absolute; left:-4px; top:14px; width:30px; height:22px;
             background-repeat:no-repeat; background-size:100% 100%; }
  .ci h3 { margin:0; font-family:var(--m-font-display); font-weight:400;
           font-variation-settings:var(--m-vf-display); font-size:47px;
           letter-spacing:-.018em; color:var(--m-warm-ink); line-height:1.02; }
  .ci p  { margin:11px 0 0; font-family:var(--m-font-display); font-weight:400;
           font-variation-settings:var(--m-vf-condensed); font-size:23px;
           letter-spacing:.055em; color:var(--m-warm-muted); }
  .ci .body { margin-left:52px; }
  .ci .rule { margin-left:52px; margin-top:16px; width:0; height:9px; overflow:hidden; }
  .ci .rule svg { display:block; }

  /* ── BEAT 5 · the three words ────────────────────────────────────────── */
  #deep { position:absolute; inset:0; opacity:0; }
  #deepbg { position:absolute; inset:0; background:var(--m-deep); }
  #deepcel { position:absolute; right:-160px; top:-190px; width:900px; opacity:.13;
             filter:invert(1) saturate(.15); }
  #deepstrip { position:absolute; left:-40px; top:912px; background-repeat:no-repeat;
               background-size:100% 100%; }
  .term { position:absolute; left:0; width:1920px; top:342px; text-align:center; }
  .term .w { display:block; padding:26px 0; margin:-26px 0; }
  .term b { display:block; font-family:var(--m-font-display); font-weight:400;
            font-variation-settings:var(--m-vf-expanded); font-size:216px;
            letter-spacing:-.012em; line-height:1; color:var(--m-brand-lift); }
  .term i { display:block; font-style:normal; margin-top:26px;
            font-family:var(--m-font-editorial); font-size:46px; letter-spacing:.004em;
            color:var(--m-on-deep-muted); }
  #deeprule { position:absolute; left:812px; top:986px; width:296px; height:4px;
              background:rgba(99,100,101,.34); }
  #deepfill { position:absolute; left:0; top:0; height:4px; background:var(--m-signal-ink); width:0; }
  #deepbird { position:absolute; left:238px; top:214px; width:190px;
              filter:invert(1) saturate(.15); opacity:.5; }

  /* ── BEAT 6 · the deliverable ────────────────────────────────────────── */
  #bw { left:432px; top:200px; width:1056px; height:646px; opacity:0; }
  #bw .sh { left:16px; top:18px; width:1056px; height:646px; }
  #bw .cd { width:1056px; height:646px; }
  #browser .chrome { height:52px; background:var(--m-warm-panel);
                     display:flex; align-items:center; gap:9px; padding:0 22px; }
  #browser .chrome s { width:11px; height:11px; border-radius:50%;
                       background:var(--m-warm-muted); opacity:.45; }
  #browser .chrome .url { margin-left:18px; height:26px; width:340px; border-radius:999px;
                          background:var(--m-warm-surface); display:flex; align-items:center;
                          padding:0 14px; gap:10px; }
  #browser .chrome .url em { display:block; width:10px; height:12px; border-radius:2px;
                             border:2px solid var(--m-warm-muted); opacity:.6; }
  #browser .chrome .url i { display:block; height:8px; width:190px; border-radius:4px;
                            background:var(--m-warm-line); }
  .sec { overflow:hidden; height:0; }
  #s1 { background:var(--m-brand); }
  #s1 .in { padding:40px 46px 42px; }
  #s1 .h { height:23px; border-radius:6px; background:var(--m-on-brand); opacity:.92; width:420px; }
  #s1 .h2{ height:13px; border-radius:7px; background:var(--m-on-brand); opacity:.5; width:300px; margin-top:18px; }
  #s1 .cta { margin-top:26px; height:46px; width:212px; border-radius:999px;
             background:var(--m-signal); display:flex; align-items:center; padding:0 22px; }
  #s1 .cta i { display:block; height:11px; width:132px; border-radius:6px;
               background:var(--m-on-signal); opacity:.85; }
  #s2 .in { display:flex; gap:34px; padding:34px 46px; }
  #s2 .col { flex:1; }
  #s2 .col i { display:block; height:12px; border-radius:6px; background:var(--m-warm-line); margin-top:14px; }
  #s2 .col i:first-child { margin-top:0; height:17px; width:270px; background:var(--m-warm-muted); opacity:.5; }
  #s2 .plate { width:290px; height:148px; background:var(--m-warm-panel);
               position:relative; flex:0 0 auto; }
  #s2 .plate .pin { position:absolute; left:124px; top:42px; }
  #s3 .in { display:flex; align-items:center; gap:26px; padding:0 46px 34px; }
  #s3 .btn { height:50px; width:250px; border-radius:8px; background:var(--m-signal);
             display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  #s3 .btn i { display:block; height:11px; width:150px; border-radius:6px;
               background:var(--m-on-signal); opacity:.85; }
  #s3 .m { flex:1; }
  #s3 .m i { display:block; height:11px; border-radius:6px; background:var(--m-warm-line); }
  #s3 .m i + i { margin-top:12px; width:60%; }
  #s4 .in { border-top:1px solid var(--m-warm-line); margin:0 46px; padding:24px 0 0;
            display:flex; gap:22px; }
  #s4 i { display:block; height:9px; width:110px; border-radius:5px; background:var(--m-warm-line); }
  #live { position:absolute; left:1318px; top:162px; opacity:0;
          display:flex; align-items:center; justify-content:center; gap:11px;
          background-repeat:no-repeat; background-size:100% 100%;
          font-family:var(--m-font-display); font-weight:400;
          font-variation-settings:var(--m-vf-condensed); font-size:22px;
          letter-spacing:.20em; color:var(--m-on-signal); }
  #live s { width:9px; height:9px; border-radius:50%; background:var(--m-on-signal); display:block; }

  /* ── BEAT 7 · the line ───────────────────────────────────────────────── */
  #hl { position:absolute; background-repeat:no-repeat; background-size:100% 100%; }
  #ln1 { position:absolute; left:0; top:406px; width:1920px; text-align:center;
         font-size:126px; color:var(--m-warm-ink); }
  #ln2 { position:absolute; left:0; top:552px; width:1920px; text-align:center;
         font-size:126px; color:var(--m-signal-ink); }

  /* ── BEAT 8 · lockup ─────────────────────────────────────────────────── */
  #lock { position:absolute; left:0; top:352px; width:1920px; opacity:0; }
  #endbird { position:absolute; left:1500px; top:770px; width:190px; opacity:0; }

  /* ── the pill tabs ───────────────────────────────────────────────────── */
  .pill { position:absolute; left:0; top:0; display:flex; align-items:center;
          justify-content:center; height:52px; padding:0 24px; white-space:nowrap;
          background-repeat:no-repeat; background-size:100% 100%;
          font-family:var(--m-font-display); font-weight:400;
          font-variation-settings:var(--m-vf-condensed); font-size:22px;
          letter-spacing:.15em; color:var(--m-ink); opacity:0;
          will-change:transform,opacity; }

  /* ── the travelling tear ─────────────────────────────────────────────── */
  #tear { position:absolute; left:0; top:540px; background-repeat:no-repeat;
          background-size:100% 100%; opacity:0; }
  #grain { position:absolute; inset:0; opacity:.5; }
</style></head>
<body>
<div class="stage" id="stage">

  <!-- the desk ------------------------------------------------------------ -->
  <div class="lay" id="deskLay">
    <div id="deskShadow"></div>
    <div id="desk">
      <div id="deskTex"></div><div id="deskGrid"></div>
    </div>
    <div class="tape" id="dTape1"></div>
    <div class="tape" id="dTape2"></div>
  </div>

  <!-- BEAT 1 --------------------------------------------------------------- -->
  <div id="sc1">
    <div class="band" id="bandT"></div>
    <div class="band" id="bandB"></div>
    <div id="run"><span class="exp" id="rA">MOMENTUM</span><span class="lit" id="rB">&nbsp;for&nbsp;</span><span class="con" id="rC">local search.</span></div>
    <div id="runBrad"></div>
    <img class="bird" id="k1" src="../../brand/material/cut-bird-a.png" alt="">
    <img class="bird" id="k2" src="../../brand/material/cut-bird-a.png" alt="">
  </div>

  <!-- BEAT 3 · surfaces (B last = on top) ----------------------------------- -->
  <div class="lay" id="sc3">
    <div class="wrap" id="wA"><div class="sh"></div><div class="cd" id="cA">
      <div class="pad">
        <div class="sbar"><span class="mag"></span><i class="gb" style="width:206px"></i></div>
        <div class="res">
          <i class="gb t" style="width:300px"></i>
          <i class="gb u" style="width:152px"></i>
          <i class="gb" style="width:420px"></i>
        </div>
        <div class="res win">
          <div class="winbox" id="boxA" style="opacity:0"></div>
          <span class="chip" id="chipA">Your business</span>
          <i class="gb u" style="width:152px;margin-top:13px"></i>
          <i class="gb" style="width:398px"></i>
        </div>
        <div class="res">
          <i class="gb t" style="width:268px"></i>
          <i class="gb u" style="width:132px"></i>
          <i class="gb" style="width:376px"></i>
        </div>
      </div></div>
      <div class="tape" id="tA"></div>
    </div>

    <div class="wrap" id="wC"><div class="sh"></div><div class="cd" id="cC">
      <div class="plate" id="plateC"></div>
      <div class="pad2">
        <i class="gb" style="width:290px"></i>
        <div class="lrow win">
          <div class="winbox" id="boxC" style="opacity:0"></div>
          <span class="chip" id="chipC">Your business</span>
          <i class="gb u" style="width:124px"></i>
        </div>
        <div class="lrow">
          <i class="gb t" style="width:188px"></i>
          <i class="gb u" style="width:108px"></i>
        </div>
      </div></div>
      <div class="tape" id="tC"></div>
    </div>

    <div class="wrap" id="wB"><div class="sh"></div><div class="cd" id="cB">
      <div class="pad">
        <div class="qrow"><span class="av"></span><i class="gb" style="width:334px"></i></div>
        <div class="ans">
          <i class="gb" style="width:560px"></i>
          <div class="inl">
            <i class="gb" style="width:196px"></i>
            <span class="chip" id="chipB">Your business</span>
            <i class="gb" style="width:88px"></i>
          </div>
          <i class="gb" style="width:640px"></i>
          <i class="gb" style="width:580px"></i>
          <i class="gb" style="width:430px"></i>
        </div>
        <div class="cites"><b>1</b><b>2</b><b>3</b></div>
      </div></div>
      <div class="tape" id="tB"></div>
    </div>

    <div class="clab" id="labA">SEARCH ENGINE</div>
    <div class="clab" id="labB">ANSWER ENGINE</div>
    <div class="clab" id="labC">GENERATIVE SEARCH</div>
  </div>

  <!-- BEAT 4 --------------------------------------------------------------- -->
  <div class="lay" id="sc4">
    <div id="check"></div>
    <img class="bird" id="k3" src="../../brand/material/cut-bird-b.png" alt=""
         style="left:1430px;top:686px;width:214px;opacity:0">
  </div>

  <!-- BEAT 2 · the prompt, above the surfaces so the fragments fly over ------ -->
  <div class="lay" id="sc2">
    <div class="wrap" id="pw">
      <div class="sh"></div>
      <div class="cd" id="prompt">
        <div id="ghostq"></div>
        <div id="qline"><span id="q"></span><span id="caret"></span></div>
        <div class="prule"></div>
        <div id="ptools"><i></i><i></i></div>
        <div id="send">
          <svg viewBox="0 0 24 24"><path d="M12 20V5.4M12 5.4l-6.5 6.5M12 5.4l6.5 6.5"
            fill="none" style="stroke:var(--m-on-signal)" stroke-width="2.7"
            stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="tape" id="tP1"></div>
      <div class="tape" id="tP2"></div>
    </div>
    <div class="fragw" id="f0"><div class="fragc"></div>
      <img class="fragb" src="../../brand/material/cut-bird-a.png" alt=""
           style="left:-150px;top:-118px;width:250px"></div>
    <div class="fragw" id="f1"><div class="fragc"></div>
      <img class="fragb" src="../../brand/material/cut-bird-c.png" alt=""
           style="left:850px;top:-96px;width:150px"></div>
    <div class="fragw" id="f2"><div class="fragc"></div>
      <img class="fragb" src="../../brand/material/cut-bird-b.png" alt=""
           style="left:380px;top:158px;width:132px"></div>
  </div>

  <!-- the pill tabs -------------------------------------------------------- -->
  <div class="lay" id="pills"></div>

  <!-- BEAT 6 --------------------------------------------------------------- -->
  <div class="lay" id="sc6">
    <div class="wrap" id="bw">
      <div class="sh"></div>
      <div class="cd" id="browser">
        <div class="chrome"><s></s><s></s><s></s>
          <div class="url"><em></em><i></i></div>
        </div>
        <div class="sec" id="s1"><div class="in">
          <div class="h"></div><div class="h2"></div><div class="cta"><i></i></div>
        </div></div>
        <div class="sec" id="s2"><div class="in">
          <div class="col"><i></i><i></i><i></i><i style="width:78%"></i></div>
          <div class="plate"><span class="pin"></span></div>
        </div></div>
        <div class="sec" id="s3"><div class="in">
          <div class="btn"><i></i></div>
          <div class="m"><i></i><i></i></div>
        </div></div>
        <div class="sec" id="s4"><div class="in"><i></i><i></i><i></i></div></div>
      </div>
      <div class="tape" id="tW1"></div>
      <div class="tape" id="tW2"></div>
    </div>
    <div id="live"><s></s>LIVE</div>
  </div>

  <!-- BEAT 7 --------------------------------------------------------------- -->
  <div class="lay" id="sc7">
    <div id="hl"></div>
    <div id="ln1" class="ed">One agency.</div>
    <div id="ln2" class="ed">Every place they look.</div>
  </div>

  <!-- BEAT 8 --------------------------------------------------------------- -->
  <div class="lay" id="sc8">
    <div id="lock"></div>
    <img class="bird" id="k4" src="../../brand/material/cut-bird-c.png" alt="">
  </div>

  <!-- BEAT 5 · full-bleed deep, above every light layer ---------------------- -->
  <div id="deep">
    <div id="deepbg"></div>

/** Cut an opaque shape out of translucent scanned material. Run once, at load:
 *  the source PNGs carry 25–55% alpha, so drawing them n times over themselves
 *  saturates the body while leaving the torn silhouette intact. */
function cutPaper(img, box, { w, h, boost = 6, tint = null, tintA = 1 }) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  const x = c.getContext('2d');
  for (let i = 0; i < boost; i++)
    x.drawImage(img, box.x, box.y, box.w, box.h, 0, 0, c.width, c.height);
  if (tint) {
    x.globalCompositeOperation = 'source-atop';
    x.globalAlpha = tintA;
    x.fillStyle = tint;
    x.fillRect(0, 0, c.width, c.height);
  }
  return c.toDataURL();
}
function paint(el, url, w, h) {

}

/** A hand-cut edge on all four sides of a box. Seeded once; never at paint time. */
function deckle(seed, n = 24, ax = 1.0, ay = 1.4) {
  const r = rng(seed), p = [];
  const put = (x, y) => p.push(`${x.toFixed(2)}% ${y.toFixed(2)}%`);
  for (let i = 0; i <= n; i++) put(i / n * 100, r() * ay);
  for (let i = 1; i <= n; i++) put(100 - r() * ax, i / n * 100);
  for (let i = n - 1; i >= 0; i--) put(i / n * 100, 100 - r() * ay);
  for (let i = n - 1; i >= 1; i--) put(r() * ax, i / n * 100);
  return `polygon(${p.join(',')})`;
}

/** A ragged horizontal line across a box, in percent. */
function ragLine(yc, seed, n = 15, amp = 4.5) {
  const r = rng(seed);
  return Array.from({ length: n + 1 }, (_, i) => ({ x: i / n * 100, y: yc * 100 + (r() - 0.5) * 2 * amp }));
}

/* ── helpers ────────────────────────────────────────────────────────────── */
const rise = (clipEl, innerEl, p, dy = 40) => {

/* ═══ the timeline ══════════════════════════════════════════════════════ */
window.seek = function (t) {

    if (p > 0 && p < 1) { bandOn = 1; bandDir = T.dir; bandX = T.dir === 'ltr' ? lerp(-300, 2220, p) : lerp(2220, -300, p); }
  }
  $('tear').style.opacity = bandOn;
  $('tear').style.transform =
    `translate(${bandX - 595}px, -172px) rotate(${bandDir === 'ltr' ? -90 : 90}deg)`;

  const P1 = tearP(0)(t), P2 = tearP(1)(t), P3 = tearP(2)(t), P4 = tearP(3)(t);

  /* ═══ BEAT 1 · 0.00–3.60 — the wordmark run ═══════════════════════════ */
  {

      const f = lerp(0.055, 0.5, run);
      const col = at(t, 1.16, 1.18, easeEmphatic);
      const s = lerp(1, RUN.send, col);
      const tx = 960 - s * RUN.W * f;
      $('run').style.transform =
        `translate(${tx}px, 540px) scale(${s}) translateY(${-RUN.capOff}px)`;

      /* the two torn bands crop the letters top and bottom, and open as the
         line resolves — the crop is material, not a frame edge */
      const open = col;
      $('bandT').style.transform = `translate(${-104 * (1 - run)}px, ${-176 - 176 * open}px) rotate(-1.1deg)`;
      $('bandB').style.transform = `translate(${72 * (1 - run)}px, ${922 + 176 * open}px) rotate(-1.1deg) scaleY(-1)`;

      const brad = at(t, 2.16, 0.44, easeEmphatic);
      $('runBrad').style.opacity = brad;
      $('runBrad').style.transform =
        `translate(${138 - 26 * (1 - brad)}px, ${476}px) rotate(${-14 + 22 * brad}deg) scale(${lerp(0.5, 1, brad)})`;

      /* two birds cross the run — the type is broken up, not decorated */
      const g1 = clamp((t + 0.28) / 2.35);
      $('k1').style.width = '360px';
      $('k1').style.transform =
        `translate(${lerp(2180, -520, easeInOut(g1))}px, ${lerp(206, 320, g1)}px) rotate(${lerp(-14, 6, g1)}deg)`;
      const g2 = clamp((t - 0.95) / 2.5);

        `translate(${lerp(-320, 2100, easeInOut(g2))}px, ${lerp(806, 700, g2)}px) rotate(${lerp(10, -8, g2)}deg) scaleX(-1)`;
      $('k2').style.opacity = g2 > 0 ? 0.9 : 0;

  /* the desk is under everything the first tear reveals */
  $('deskLay').style.opacity = P1 > 0.02 ? 1 : 0;
  $('desk').style.transform = $('deskShadow').style.transform = `rotate(${TILT.desk}deg)`;

  {
    const inP = at(t, 3.20, 0.94, easeEntrance);
    const split = t >= 5.86 ? 1 : 0;                     /* a break, never a fade */
    const press = at(t, 5.78, 0.16, easeStandard) * (1 - at(t, 5.94, 0.18, easeStandard));
    const p = $('pw');
    p.style.opacity = inP * (1 - split);

    const lift = at(t, 5.36, 0.34, easeEntrance);
    $('send').style.transform =
      `translateY(${-7 * lift}px) scale(${lerp(1, 1.07, lift) * (1 - 0.14 * press)})`;

    /* the split: the card is torn into three, and the birds take the pieces */
    const sp = clamp((t - 5.86) / 1.15);
    FRAGS.forEach((el, i) => {
      const s = scatterPose(sp, i, 3, { seed: 19, spread: 1.12 });
      el.style.opacity = (t >= 5.86 ? 1 : 0) * s.opacity;
      el.style.transform = `${s.transform} rotate(${TILT.prompt}deg)`;
    });
  }

  /* ═══ BEAT 3 · 5.85–9.50 — three surfaces ═════════════════════════════ */
  {
    CARDS.forEach((c, i) => {
      const born = at(t, c.birth, 1.06, easeEntrance);
      const toStrip = at(t, 9.44 + i * 0.07, 0.94, easeEmphatic);
      const tp = tapedCard(born, i, { rise: 0 });
      const rx = c.x + c.ww / 2, ry = c.y + c.h / 2;
      let ccx = lerp(c.sx, rx, born);
      let ccy = lerp(544, ry, born);
      let s = lerp(214 / c.h, 1, born);
      let rot = lerp(c.rot * 0.25, c.rot, born);
      ccx = lerp(ccx, c.strip[0], toStrip);
      ccy = lerp(ccy, c.strip[1], toStrip);
      s = lerp(s, c.strip[2], toStrip);
      rot = lerp(rot, c.strip[3], toStrip);
      poseCard(c.w, c.rest, ccx, ccy, s, rot, born);
      c.w.querySelector('.sh').style.opacity = tp.opacity;

      const labP = at(t, 6.94 + i * 0.16, 0.66) * (1 - at(t, 9.40, 0.30, easeStandard));
      c.lab.style.opacity = labP;
      c.lab.style.transform = `translateY(${(1 - labP) * 18}px) rotate(${c.rot * 0.5}deg)`;
    });
    /* labels ride under their own card */
    $('labA').style.left = '112px'; $('labA').style.top = '828px';
    $('labB').style.left = '700px'; $('labB').style.top = '672px';
    $('labC').style.left = '1338px'; $('labC').style.top = '600px';

    CHIPS.forEach((c) => {
      const p = at(t, c.at, 0.40, easeEmphatic);
      c.chip.style.opacity = p;
      c.chip.style.transform = `scale(${lerp(0.76, 1, p)}) rotate(${lerp(-4, 0, p)}deg)`;
      if (c.box) c.box.style.opacity = p;
    });
  }

  /* ═══ BEAT 4 · 9.45–13.10 — the checklist ═════════════════════════════ */
  {
    CI.forEach((it, i) => {
      const p = at(t, 9.86 + i * 0.46, 0.70);
      it.el.style.opacity = p;
      it.el.style.transform = `translateY(${(1 - p) * 28}px)`;
      it.rule.style.width = `${at(t, 9.98 + i * 0.46, 0.62, easeEmphatic) * 660}px`;
    });
    const bp = at(t, 10.70, 0.86, easeEntrance);
    const bt = tapedCard(bp, 1, { rise: 30, tilt: 2.4 });
    $('k3').style.opacity = bt.opacity * 0.95;
    $('k3').style.transform = bt.transform;
  }

  /* ═══ BEAT 5 · 12.84–16.14 — SEO · AEO · GEO ══════════════════════════ */
  {
    /* in behind the second tear, out behind the third — no dissolve either side */
    $('deep').style.opacity = (P2 > 0 && P3 < 1) ? 1 : 0;
    if (P2 > 0 && P3 < 1) {
      $('deep').style.clipPath = P3 > 0
        ? tornWipe(P3 * 1.06 + 0.03, { seed: 63, teeth: 78, jag: 0.013 })
        : tornWipe(1 - clamp(P2 * 1.04 - 0.01), { seed: 17, teeth: 78, jag: 0.013, dir: 'rtl' });
    }

    const T = [
      { el: $('t1'), in: 13.02, out: 13.78, seed: 5 },
      { el: $('t2'), in: 14.00, out: 14.76, seed: 71 },
      { el: $('t3'), in: 14.98, out: 15.92, seed: 23 },
    ];
    T.forEach((s) => {
      const a = at(t, s.in, 0.44, easeEntrance);
      const b = at(t, s.out, 0.26, easeEmphatic);
      const w = s.el.querySelector('.w'), big = s.el.querySelector('b'), sub = s.el.querySelector('i');
      rise(w, big, a, 104);
      s.el.style.opacity = a > 0 ? 1 : 0;
      /* each term is torn away, not faded */
      s.el.style.clipPath = b > 0 ? tornWipe(b, { seed: s.seed, teeth: 40, jag: 0.03 }) : 'none';
      s.el.style.transform = `translateY(${-40 * b}px)`;
      const sp = at(t, s.in + 0.12, 0.28);
      sub.style.opacity = sp;
      sub.style.transform = `translateY(${(1 - sp) * 18}px)`;
    });
    const step = (at(t, 13.02, 0.42) + at(t, 14.00, 0.42) + at(t, 14.98, 0.42)) / 3;
    $('deepfill').style.width = `${step * 296}px`;

    const bd = clamp((t - 13.55) / 2.1);
    $('deepbird').style.transform =
      `translate(${lerp(-360, 1900, easeInOut(bd))}px, ${lerp(96, -34, bd)}px) rotate(${lerp(8, -6, bd)}deg)`;
  }

  /* ═══ BEAT 6 · 15.48–19.55 — the deliverable ══════════════════════════ */
  {
    /* it is already built underneath when the third tear passes over it */
    const inP = at(t, 15.16, 0.80, easeEntrance);
    const b = $('bw');
    b.style.opacity = inP * (P4 < 1 ? 1 : 0);
    b.style.transform =
      `translateY(${lerp(96, 0, inP)}px) rotate(${TILT.browser * (0.3 + 0.7 * inP)}deg) `
      + `scale(${lerp(0.955, 1, inP)})`;

    SECS.forEach((sc, i) => {
      const p = at(t, 15.62 + i * 0.24, 0.46, easeEntrance);
      sc.el.style.height = `${p * sc.h}px`;
      sc.in.style.transform = `translateY(${(1 - p) * -26}px)`;
    });

    const lv = at(t, 18.10, 0.34, easeEmphatic);
    $('live').style.opacity = lv * (P4 < 1 ? 1 : 0);
    $('live').style.transform = `rotate(${lerp(-11, -2.4, lv)}deg) scale(${lerp(0.6, 1, lv)})`;

    /* the fourth tear carries the whole deliverable off to the left */
    $('sc6').style.clipPath = P4 > 0
      ? tornWipe(P4 * 1.06 + 0.03, { seed: 29, teeth: 78, jag: 0.013, dir: 'rtl' })
      : 'none';
  }

  /* ═══ BEAT 7 · 19.20–22.30 — the line ═════════════════════════════════ */
  {
    const out1 = at(t, 21.10, 0.44, easeStandard);
    const settle = at(t, 21.28, 0.60, easeEmphatic);
    revealWords($('ln1'), t, 19.30, 0.70, 0.09, 46);
    revealWords($('ln2'), t, 19.74, 0.70, 0.08, 46);
    $('ln1').style.opacity = 1 - out1;
    $('ln1').style.transform = `translateY(${-52 * out1}px)`;

    /* the ochre strip is torn in under the payoff line, then torn away */
    const hin = at(t, 19.92, 0.62, easeEmphatic);
    const hout = at(t, 21.06, 0.42, easeEmphatic);
    $('hl').style.opacity = hin > 0 ? 1 : 0;
    $('hl').style.clipPath = hout > 0
      ? tornWipe(hout, { seed: 88, teeth: 34, jag: 0.04 })
      : tornWipe(1 - hin, { seed: 12, teeth: 34, jag: 0.04, dir: 'rtl' });

    $('ln2').style.transform =
      `translateY(${LN2_DY * settle}px) scale(${lerp(1, LN2_SCALE, settle)})`;
  }

  /* ═══ BEAT 8 · 21.70–24.00 — the lockup ═══════════════════════════════ */
  if (lock) lock.pose(at(t, 21.70, 1.10));
  {
    const bp = at(t, 22.30, 0.80, easeEntrance);
    const bt = tapedCard(bp, 0, { rise: 26, tilt: -2.2 });
    $('k4').style.width = '176px';
    $('k4').style.opacity = bt.opacity * 0.9;
    $('k4').style.transform = bt.transform;
  }

  /* ── the tabs: one thread from beat 2 to the last frame ───────────────── */
  PILLS.forEach((el, i) => {
    const track = PILL_POS[i];
    let x = track[0][0], y = track[0][1], r = track[0][2], s = PILL_SCALE[0];
    for (let k = 0; k < PILL_HOP.length; k++) {
      const nxt = track[k + 1];
      if (!nxt) break;
      const p = at(t, PILL_HOP[k][0] + i * 0.045, PILL_HOP[k][1], easeStandard);
      x = lerp(x, nxt[0], p); y = lerp(y, nxt[1], p); r = lerp(r, nxt[2], p);
      s = lerp(s, PILL_SCALE[k + 1], p);
    }
    const born = at(t, 3.66 + i * 0.11, 0.62);
    el.style.opacity = born;
    el.style.transform =
      `translate(${x}px, ${y + (1 - born) * 20}px) translate(-50%, -50%) `
      + `rotate(${r}deg) scale(${s * lerp(0.86, 1, born)})`;
  });
};

window.seek(0);
</script>
