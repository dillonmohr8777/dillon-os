<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Field Guide to Local Demand — Momentum</title>
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  html,body { background:#000; }
  .stage {
    position:relative; width:1920px; height:1080px; overflow:hidden;
    background:var(--m-deep); font-family:var(--m-font-text);
    -webkit-font-smoothing:antialiased;
  }

  /* ── the lens: a hard circular mask. No blur, no bevel, no glass. ───────── */
  #lens { position:absolute; inset:0; }
  #paperbg { position:absolute; inset:0; background:var(--m-paper); }
  #panelbg { position:absolute; inset:0; background:var(--m-panel); }
  #stripScale { position:absolute; inset:0; transform-origin:960px 496px; }
  #stripWrap  { position:absolute; left:0; top:0; }

  /* ── the page layer: statement, credit, lockup. Also inside the mask. ──── */
  #page { position:absolute; inset:0; }

  #stmt { position:absolute; left:0; right:0; top:352px; text-align:center; }
  #stmt div { font-weight:400; font-size:88px; letter-spacing:.05em;
              line-height:1.42; color:var(--m-ink); }

  #credit { position:absolute; left:150px; top:608px; }
  #credit .rule { height:2px; background:var(--m-line-strong); width:0; }
  #credit .a { margin-top:32px; font-weight:700; font-size:28px; letter-spacing:.30em;
               color:var(--m-muted); }
  #credit .b { margin-top:21px; font-weight:400; font-size:22px; letter-spacing:.26em;
               color:var(--m-signal-ink); }

  /* the release beat's subject: one recorded trace across open paper */
  #trace { position:absolute; inset:0; }

  #lock { position:absolute; left:0; right:0; top:436px; text-align:center;
          display:flex; flex-direction:column; align-items:center; opacity:0; }

  /* ── the optic: ring, graduations, reticle, registration. Above the mask. ─ */
  #optic { position:absolute; inset:0; }

  /* ── surround furniture ─────────────────────────────────────────────────── */
  .tl { position:absolute; left:100px; top:88px; display:flex; align-items:center; gap:13px; }
  /* the mark is never recoloured: --m-mark on every surface in this film.
     contrast.json rates mark-on-deep at 4.39, role graphic — legal as-is. */
  .tl .mk { width:34px; height:34px; color:var(--m-mark); display:block; }
  .tl .wd { font-family:var(--m-font-display); font-size:20px; letter-spacing:-.01em;
            line-height:1; color:var(--m-on-deep); }
  .tr { position:absolute; right:100px; top:94px; font-weight:700; font-size:15px;
        letter-spacing:.24em; color:var(--m-on-deep-muted); text-align:right; }

  .figs { position:absolute; left:100px; bottom:92px; height:34px; }
  .figs .fr { position:absolute; left:0; bottom:60px; width:62px; height:2px;
              background:var(--m-brand-lift); }
  .figs span { position:absolute; left:0; bottom:0; white-space:nowrap;
               font-weight:400; font-size:23px; letter-spacing:.05em;
               color:var(--m-on-deep-muted); }

  #grain { position:absolute; inset:0; pointer-events:none; }
</style></head>
<body>
<div class="stage">

  <div id="lens">
    <div id="paperbg"></div>
    <div id="panelbg"></div>
    <div id="stripScale"><div id="stripWrap"></div></div>

    <div id="page">
      <svg id="trace" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
      <div id="stmt"><div id="s1">Demand leaves traces.</div><div id="s2">We read them.</div></div>
      <div id="credit">
        <div class="rule" id="crule"></div>
        <div class="a" id="ca">FIELD GUIDE TO LOCAL DEMAND</div>
        <div class="b" id="cb">SEO · AEO · GEO · PAID</div>
      </div>
      <div id="lock"></div>
      <svg id="xh" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0;opacity:0">
        <g id="xhg">
          <path d="M 900,496 h 120 M 960,436 v 120" stroke="#8E8578" stroke-width="1.2"/>
          <circle cx="960" cy="496" r="26" fill="none" stroke="#8E8578" stroke-width="1.2"
                  stroke-dasharray="3 7"/>
          <path d="M 828,496 h 26 M 1066,496 h 26 M 960,364 v 26 M 960,602 v 26"
                stroke="#8E8578" stroke-width="1.2" stroke-opacity=".7"/>
        </g>
      </svg>
    </div>
  </div>

  <svg id="optic" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

  <div class="tl" id="tl"><span class="mk" id="mk"></span><span class="wd">MOMENTUM</span></div>
  <div class="tr" id="tr">PHILADELPHIA · 39.95° N</div>

  <div class="figs" id="figs"><div class="fr" id="fr"></div></div>

  <div id="grain"></div>
</div>

<script type="module">
import { at, clamp, lerp, easeEntrance, easeEmphatic, easeStandard, easeInOut,
         osc, revealWords, grainURL, markSVG, Lockup }
  from '../../brand/film-kit.js';

window.FILM = { width: 1920, height: 1080, fps: 30, duration: 26.0 };
window.__ready = false;

/* ── palette: literals matched to tokens.css ──────────────────────────────── */
const PAPER = '#FBF8F4', PANEL = '#F0ECE5', INK = '#14181B', MUTED = '#636465',
      LINE  = '#DCD6CC', LSTRONG = '#8E8578', BRAND = '#155E86',
      SIGNAL = '#E27113', SIGINK = '#A35309', ONDEEPMUTED = '#8A9296',
      LIFT = '#3897CC', WHITE = '#FFFFFF';

/* ── stage geometry ───────────────────────────────────────────────────────── */
const CX = 960, CY = 496;          // the lens never moves; only its radius does
const W  = 1000;                   // one plate cell on the strip
const NP = 5;

/* ── tiny SVG DSL ─────────────────────────────────────────────────────────── */
const NS = 'http://www.w3.org/2000/svg';
function E(tag, a, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (parent) parent.appendChild(e);
  return e;
}
/* Every plate element is registered with an order o in [0,1]: strokes draw on
   that order, fills and type arrive just behind them. */
const plate = [[], [], [], [], []];
function S(pi, o, tag, a, p) { const e = E(tag, a, p); e.__o = o; e.__s = 1; plate[pi].push(e); return e; }
function F(pi, o, tag, a, p) { const e = E(tag, a, p); e.__o = o; e.__s = 0; plate[pi].push(e); return e; }
function T(pi, o, str, a, p) {
  const e = F(pi, o, 'text', Object.assign({ 'font-family': 'Nunito Sans', fill: INK }, a), p);
  e.textContent = str; return e;
}
/* Late accents. One element per plate arrives *after* the plate has settled, on
   its own clock — the move that answers "what is this revealing". Elements
   marked late are skipped by the draw pass and posed from t directly. */
const lateList = [];
function LATE(e, start, dur = 0.34) { e.__late = [start, dur]; lateList.push(e); return e; }

/* ── the strip ────────────────────────────────────────────────────────────── */
const strip = E('svg', { width: W * NP, height: 1080, viewBox: `0 0 ${W * NP} 1080` });
document.getElementById('stripWrap').appendChild(strip);
const defs = E('defs', {}, strip);

/* field-notebook grid, travelling with the specimens */
const gp = E('pattern', { id: 'grid', width: 46, height: 46, patternUnits: 'userSpaceOnUse' }, defs);
E('path', { d: 'M46 0 H0 V46', fill: 'none', stroke: LINE, 'stroke-width': 1 }, gp);
const gridRect = E('rect', { x: 0, y: 0, width: W * NP, height: 1080, fill: 'url(#grid)' }, strip);

/* three geological hatches for Plate II */
function hatch(id, build) {
  const p = E('pattern', { id, width: 14, height: 14, patternUnits: 'userSpaceOnUse' }, defs);
  build(p); return `url(#${id})`;
}
const H_STIPPLE = hatch('hStip', p => {
  E('circle', { cx: 3.5, cy: 3.5, r: 1.5, fill: LSTRONG, 'fill-opacity': .75 }, p);
  E('circle', { cx: 10.5, cy: 10.5, r: 1.5, fill: LSTRONG, 'fill-opacity': .75 }, p);
});
const H_HACHURE = hatch('hHach', p => {
  E('path', { d: 'M-4 4 L4 -4 M0 14 L14 0 M10 18 L18 10', stroke: LSTRONG,
              'stroke-width': 1.2, 'stroke-opacity': .8 }, p);
});
const H_DASH = hatch('hDash', p => {
  E('path', { d: 'M0 4 H8 M6 11 H14', stroke: LSTRONG, 'stroke-width': 1.3, 'stroke-opacity': .8 }, p);
});

/* one group per plate, so opacity can be posed per plate */
const G = [];
for (let i = 0; i < NP; i++) G.push(E('g', { transform: `translate(${i * W},0)` }, strip));

/* helpers ─────────────────────────────────────────────────────────────────── */
/* Naturalist caption. Roman, not italic: Nunito Sans ships no italic and
   Chromium's synthesized oblique reads as a rendering fault at this size. */
const IT = { 'font-size': 17, 'font-weight': 400, fill: MUTED, 'letter-spacing': '.10em' };
function leafPath(x, y, deg, len, wid) {
  const a = deg * Math.PI / 180, dx = Math.cos(a) * len, dy = Math.sin(a) * len;
  const px = -Math.sin(a) * wid, py = Math.cos(a) * wid;
  return `M ${x},${y} Q ${x + dx * .42 + px},${y + dy * .42 + py} ${x + dx},${y + dy}`
       + ` Q ${x + dx * .42 - px},${y + dy * .42 - py} ${x},${y} Z`;
}

/* ══ PLATE I — the query ══════════════════════════════════════════════════ */
{
  const g = G[0], P = 0;
  // stem
  S(P, .08, 'path', { d: 'M 500,750 C 486,676 512,570 500,430', fill: 'none',
                      stroke: INK, 'stroke-width': 2.8, 'stroke-linecap': 'round' }, g);
  // roots, then finer root hairs
  const roots = [[-104, 50], [-58, 60], [-8, 58], [44, 56], [96, 44]];
  roots.forEach((r, i) => S(P, .13 + i * .025, 'path', {
    d: `M 500,750 C ${500 + r[0] * .32},${770} ${500 + r[0] * .78},${762 + r[1] * .4} ${500 + r[0]},${750 + r[1]}`,
    fill: 'none', stroke: INK, 'stroke-width': 1.4, 'stroke-opacity': .82,
    'stroke-linecap': 'round' }, g));
  [[-72, 28], [-30, 38], [24, 36], [66, 24]].forEach((r, i) => S(P, .19 + i * .02, 'path', {
    d: `M 500,750 Q ${500 + r[0] * .6},${764} ${500 + r[0]},${750 + r[1]}`,
    fill: 'none', stroke: INK, 'stroke-width': .9, 'stroke-opacity': .5 }, g));
  // three leaves, each with a midrib and veins that land exactly on the edge
  const leaves = [
    { x: 502, y: 534, d: -6,  l: 178, w: 48 },
    { x: 498, y: 622, d: 187, l: 190, w: 50 },
    { x: 502, y: 686, d: -16, l: 150, w: 40 },
  ];
  leaves.forEach((lf, i) => {
    const a = lf.d * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const ex = lf.x + ca * lf.l, ey = lf.y + sa * lf.l;
    S(P, .26 + i * .075, 'path', { d: leafPath(lf.x, lf.y, lf.d, lf.l, lf.w), fill: 'none',
                                   stroke: INK, 'stroke-width': 2 }, g);
    S(P, .31 + i * .075, 'line', { x1: lf.x, y1: lf.y, x2: ex, y2: ey, stroke: INK,
                                   'stroke-width': 1.1, 'stroke-opacity': .7 }, g);
    [.24, .46, .70].forEach((u, v) => {
      const along = 2 * u * (1 - u) * .42 * lf.l + u * u * lf.l;
      const off   = 2 * u * (1 - u) * lf.w;
      const bx = lf.x + ca * along, by = lf.y + sa * along;
      const nx = -sa * off, ny = ca * off;
      S(P, .35 + i * .075 + v * .01, 'line', { x1: bx, y1: by, x2: bx + nx, y2: by + ny,
        stroke: INK, 'stroke-width': .9, 'stroke-opacity': .45 }, g);
      S(P, .36 + i * .075 + v * .01, 'line', { x1: bx, y1: by, x2: bx - nx, y2: by - ny,
        stroke: INK, 'stroke-width': .9, 'stroke-opacity': .45 }, g);
    });
  });
  // two buds, each seated on a stalk of petiole weight so they read as growth,
  // not as debris. They arrive last — the growing tip is the last thing drawn.
  const BUD_T = [3.34, 3.48];
  [[494, 520, -26, -13], [506, 478, 27, -12]].forEach((b, i) => {
    const sx = b[0], sy = b[1], tx = sx + b[2] * 1.34, ty = sy + b[3] * 1.34;
    LATE(S(P, .48 + i * .03, 'line', { x1: sx, y1: sy, x2: tx, y2: ty, stroke: INK,
      'stroke-width': 2.0, 'stroke-linecap': 'round' }, g), BUD_T[i], 0.30);
    LATE(S(P, .51 + i * .03, 'ellipse', { cx: tx + b[2] * .40, cy: ty + b[3] * .40, rx: 9.5, ry: 6.5,
      fill: 'none', stroke: INK, 'stroke-width': 1.8,
      transform: `rotate(${b[2] > 0 ? -24 : 24} ${tx + b[2] * .40} ${ty + b[3] * .40})` }, g),
      BUD_T[i] + 0.10, 0.30);
  });
  // the query field, drawn as the specimen's flower head
  S(P, .56, 'rect', { x: 320, y: 354, width: 360, height: 68, rx: 34, fill: 'none',
                      stroke: INK, 'stroke-width': 2.4 }, g);
  F(P, .62, 'rect', { x: 322, y: 356, width: 356, height: 64, rx: 32, fill: PAPER }, g);
  S(P, .64, 'circle', { cx: 364, cy: 388, r: 11, fill: 'none', stroke: INK, 'stroke-width': 2 }, g);
  S(P, .66, 'line', { x1: 372, y1: 396, x2: 380, y2: 404, stroke: INK,
                      'stroke-width': 2, 'stroke-linecap': 'round' }, g);
  T(P, .72, '"roofer near me"', { x: 398, y: 398, 'font-size': 28, 'font-weight': 400 }, g);
  // one named part. The specimen-sheet gesture needs a word exactly once.
  LATE(S(P, .78, 'line', { x1: 300, y1: 608, x2: 352, y2: 600, stroke: LSTRONG,
                           'stroke-width': 1 }, g), 3.62, 0.28);
  LATE(T(P, .82, 'folium', Object.assign({ x: 292, y: 614, 'text-anchor': 'end' }, IT), g),
       3.72, 0.30);
}

/* ══ PLATE II — the map pack ═════════════════════════════════════════════ */
{
  const g = G[1], P = 1;
  const fills = [H_STIPPLE, H_HACHURE, H_DASH];
  /* Real strata are never congruent. Unequal thickness, unequal spacing,
     unequal extent, unequal furniture — the map pack has three slots, the
     drawing does not have to make them the same shape to say so. */
  const beds = [
    { x0: 236, x1: 766, y: 296, h:  94, ph: 0.0, num: 66, px: 300, pd: 62,
      bars: [[188, 40]] },
    { x0: 208, x1: 792, y: 410, h: 150, ph: 2.1, num: 96, px: 266, pd: 112,
      bars: [[232, 28], [154, 56], [516, 92]] },
    { x0: 254, x1: 750, y: 592, h: 104, ph: 4.2, num: 70, px: 404, pd: 70,
      bars: [[126, 34], [206, 62]] },
  ];
  function wavy(b, amp) {
    let d = `M ${b.x0},${b.y + Math.sin(b.ph) * amp}`;
    for (let i = 1; i <= 36; i++) {
      const x = b.x0 + (b.x1 - b.x0) * i / 36;
      d += ` L ${x.toFixed(1)},${(b.y + Math.sin(i * .42 + b.ph) * amp).toFixed(1)}`;
    }
    return d;
  }
  // a map pin, pressed in like a fossil
  function pin(px, py, r) {
    const h = r * 0.87;
    return `M ${px},${py} L ${px - h},${py - r * 1.38} A ${r},${r} 0 1 1 ${px + h},${py - r * 1.38} Z`;
  }
  const PIN_T = [5.96, 6.10, 6.24];
  beds.forEach((b, i) => {
    const y = b.y, H = b.h, cid = `st${i}`;
    const cp = E('clipPath', { id: cid }, defs);
    E('path', { d: wavy(b, 7) + ` L ${b.x1},${y + H} L ${b.x0},${y + H} Z` }, cp);
    F(P, .30 + i * .10, 'rect', { x: b.x0, y: y - 12, width: b.x1 - b.x0, height: H + 14,
                                  fill: fills[i], 'clip-path': `url(#${cid})` }, g);
    S(P, .06 + i * .09, 'path', { d: wavy(b, 7), fill: 'none', stroke: INK,
                                  'stroke-width': 2.2 }, g);
    S(P, .12 + i * .09, 'line', { x1: b.x0, y1: y + H, x2: b.x1, y2: y + H, stroke: INK,
                                  'stroke-width': 1.2, 'stroke-opacity': .5 }, g);
    S(P, .10 + i * .09, 'line', { x1: b.x0, y1: y, x2: b.x0, y2: y + H, stroke: INK,
                                  'stroke-width': 1.4 }, g);
    S(P, .11 + i * .09, 'line', { x1: b.x1, y1: y, x2: b.x1, y2: y + H, stroke: INK,
                                  'stroke-width': 1.4 }, g);
    T(P, .48 + i * .07, String(i + 1), { x: b.x0 - 30, y: y + b.num, 'text-anchor': 'end',
      'font-size': 34, 'font-weight': 700, fill: BRAND }, g);
    // bars: unequal counts and lengths; the long one runs into the bed edge and is cut by it
    b.bars.forEach((bar, k) =>
      F(P, .64 + i * .07 + k * .02, 'rect', { x: b.px + 44, y: y + bar[1], width: bar[0],
        height: 9, rx: 4.5, fill: LSTRONG, 'fill-opacity': .8,
        'clip-path': `url(#${cid})` }, g));
    // the pins seat one after another, after the beds have settled
    const px = b.px, py = y + b.pd;
    LATE(F(P, .54 + i * .07, 'path', { d: pin(px, py, 17), fill: SIGNAL }, g), PIN_T[i], 0.30);
    LATE(S(P, .58 + i * .07, 'path', { d: pin(px, py, 17), fill: 'none', stroke: INK,
                                  'stroke-width': 1.8, 'stroke-linejoin': 'round' }, g),
      PIN_T[i], 0.30);
    LATE(F(P, .60 + i * .07, 'circle', { cx: px, cy: py - 23.5, r: 6, fill: PANEL }, g),
      PIN_T[i] + 0.08, 0.24);
  });
  // a scale bar, where a field plate would put one
  S(P, .80, 'line', { x1: 300, y1: 762, x2: 620, y2: 762, stroke: LSTRONG, 'stroke-width': 1.4 }, g);
  for (let k = 0; k <= 4; k++)
    S(P, .82 + k * .012, 'line', { x1: 300 + k * 80, y1: 762, x2: 300 + k * 80,
      y2: 762 + (k % 2 ? 6 : 12), stroke: LSTRONG, 'stroke-width': 1.4 }, g);
}

/* ══ PLATE III — intent ══════════════════════════════════════════════════ */
{
  const g = G[2], P = 2;
  const hx = 250, hy = 496;
  S(P, .04, 'circle', { cx: hx, cy: hy, r: 25, fill: 'none', stroke: INK, 'stroke-width': 2.4 }, g);
  F(P, .10, 'circle', { cx: hx, cy: hy, r: 22, fill: PAPER }, g);
  T(P, .14, '"roofer"', { x: hx, y: hy - 46, 'text-anchor': 'middle', 'font-size': 21,
                          'font-weight': 700, fill: BRAND, 'letter-spacing': '.02em' }, g);
  const ends = [
    { x: 600, y: 252, n: '1', s: 'near me' },
    { x: 642, y: 374, n: '2', s: 'cost' },
    { x: 666, y: 496, n: '3', s: 'emergency' },
    { x: 642, y: 620, n: '4', s: 'repair' },
    { x: 600, y: 742, n: '5', s: 'best' },
  ];
  ends.forEach((e, i) => {
    S(P, .18 + i * .06, 'path', {
      d: `M ${hx + 27},${hy} C ${hx + 150},${hy} ${e.x - 150},${e.y} ${e.x - 14},${e.y}`,
      fill: 'none', stroke: INK, 'stroke-width': 1.7, 'stroke-opacity': .85 }, g);
    S(P, .46 + i * .04, 'circle', { cx: e.x, cy: e.y, r: 10, fill: 'none', stroke: INK,
                                    'stroke-width': 2 }, g);
    // the hand numbering happens after the branches land — the classifying act
    LATE(T(P, .60 + i * .04, e.n, { x: e.x - 22, y: e.y - 18, 'text-anchor': 'middle',
      'font-size': 15, 'font-weight': 700, fill: MUTED }, g), 8.66 + i * 0.07, 0.30);
    T(P, .66 + i * .04, e.s, { x: e.x + 24, y: e.y + 7, 'font-size': 22, 'font-weight': 400,
      fill: INK, 'letter-spacing': '.01em' }, g);
  });
  // second-order twigs, unlabelled — a classification chart keeps going
  const twigs = [[600, 252, 566, 190], [600, 252, 654, 196], [642, 620, 596, 700], [642, 620, 700, 690]];
  twigs.forEach((w, i) => {
    S(P, .72 + i * .03, 'path', { d: `M ${w[0]},${w[1]} Q ${(w[0] + w[2]) / 2 + 8},${(w[1] + w[3]) / 2} ${w[2]},${w[3]}`,
      fill: 'none', stroke: INK, 'stroke-width': 1.2, 'stroke-opacity': .6 }, g);
    S(P, .80 + i * .03, 'circle', { cx: w[2], cy: w[3], r: 7, fill: 'none', stroke: INK,
      'stroke-width': 1.5, 'stroke-opacity': .75 }, g);
  });
}

/* ══ PLATE IV — the answer engine ════════════════════════════════════════ */
{
  const g = G[3], P = 3;
  const x0 = 332, y0 = 352, w = 336, h = 292;
  S(P, .04, 'rect', { x: x0, y: y0, width: w, height: h, fill: 'none', stroke: INK,
                      'stroke-width': 2.6 }, g);
  S(P, .14, 'rect', { x: x0 + 9, y: y0 + 9, width: w - 18, height: h - 18, fill: 'none',
                      stroke: LSTRONG, 'stroke-width': 1 }, g);
  [[x0 + 9, y0 + 9, 1, 1], [x0 + w - 9, y0 + 9, -1, 1],
   [x0 + 9, y0 + h - 9, 1, -1], [x0 + w - 9, y0 + h - 9, -1, -1]].forEach((c, i) =>
    S(P, .20 + i * .02, 'path', { d: `M ${c[0]},${c[1] + 22 * c[3]} Q ${c[0]},${c[1]} ${c[0] + 22 * c[2]},${c[1]}`,
      fill: 'none', stroke: SIGINK, 'stroke-width': 1.6 }, g));
  // the illuminated initial
  F(P, .32, 'rect', { x: x0 + 24, y: y0 + 28, width: 68, height: 68, fill: BRAND }, g);
  T(P, .40, 'A', { x: x0 + 58, y: y0 + 82, 'text-anchor': 'middle', 'font-family': 'Archivo Black',
                   'font-size': 48, fill: WHITE }, g);
  S(P, .44, 'path', { d: `M ${x0 + 20},${y0 + 102} q -14,10 -4,24 q 12,10 22,-4`, fill: 'none',
                      stroke: SIGINK, 'stroke-width': 1.6 }, g);
  S(P, .46, 'path', { d: `M ${x0 + 96},${y0 + 22} q 16,-10 26,2 q 8,12 -6,20`, fill: 'none',
                      stroke: SIGINK, 'stroke-width': 1.6 }, g);
  // the answer, redacted to hairlines — illustrative UI, never a claim
  [[x0 + 106, y0 + 46, 190], [x0 + 106, y0 + 74, 154]].forEach((r, i) =>
    F(P, .52 + i * .03, 'rect', { x: r[0], y: r[1], width: r[2], height: 8, rx: 4,
      fill: LSTRONG, 'fill-opacity': .68 }, g));
  [[x0 + 26, y0 + 126, 284], [x0 + 26, y0 + 152, 284], [x0 + 26, y0 + 178, 198]].forEach((r, i) =>
    F(P, .58 + i * .03, 'rect', { x: r[0], y: r[1], width: r[2], height: 8, rx: 4,
      fill: LSTRONG, 'fill-opacity': .68 }, g));
  S(P, .68, 'line', { x1: x0 + 26, y1: y0 + 208, x2: x0 + w - 26, y2: y0 + 208,
                      stroke: LSTRONG, 'stroke-width': 1 }, g);
  // the film's single script accent
  T(P, .76, 'Answer Engine Optimization', { x: 500, y: y0 + 252, 'text-anchor': 'middle',
    'font-family': 'Caveat', 'font-weight': 700, 'font-size': 29, fill: SIGINK }, g);
  // marginalia — the annotator's hand, and the last thing on this plate to move
  T(P, .88, 'nota bene', Object.assign({ x: 500, y: y0 + 334, 'text-anchor': 'middle' }, IT), g);
  LATE(S(P, .84, 'path', { d: `M ${x0 - 20},${y0 + 40} l 0,34 m -8,-17 l 16,0`, fill: 'none',
                      stroke: SIGINK, 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g),
       11.34, 0.38);
}

/* ══ PLATE V — where they look ═══════════════════════════════════════════ */
{
  const g = G[4], P = 4;
  const cx = 500, cy = 496;
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6;
    S(P, .04 + k * .008, 'line', { x1: cx + Math.cos(a) * 58, y1: cy + Math.sin(a) * 58,
      x2: cx + Math.cos(a) * 322, y2: cy + Math.sin(a) * 322, stroke: LINE, 'stroke-width': 1 }, g);
  }
  const rings = [
    { r: 92,  s: 'MAP',     ang: 90 },
    { r: 162, s: 'ORGANIC', ang: -90 },
    { r: 232, s: 'PAID',    ang: 0 },
    { r: 300, s: 'AI',      ang: 180 },
  ];
  rings.forEach((rg, i) => {
    S(P, .14 + i * .10, 'circle', { cx, cy, r: rg.r, fill: 'none', stroke: LSTRONG,
      'stroke-width': i === 3 ? 1.9 : 1.4 }, g);
  });
  // one tilted hairline, so the chart reads celestial and not diagrammatic
  S(P, .56, 'ellipse', { cx, cy, rx: 268, ry: 94, fill: 'none', stroke: LSTRONG,
    'stroke-width': 1, 'stroke-dasharray': '7 7', transform: `rotate(-19 ${cx} ${cy})` }, g);
  for (let k = 0; k < 24; k++) {
    const a = k * Math.PI / 12;
    S(P, .60 + k * .004, 'line', { x1: cx + Math.cos(a) * 300, y1: cy + Math.sin(a) * 300,
      x2: cx + Math.cos(a) * (k % 2 ? 311 : 318), y2: cy + Math.sin(a) * (k % 2 ? 311 : 318),
      stroke: LSTRONG, 'stroke-width': 1.3 }, g);
  }
  /* Ring labels knock the ring out with a halo painted in the surface colour —
     a stroke, not a filled plate, so nothing can survive as a grey slab when
     the surface changes underneath. */
  rings.forEach((rg, i) => {
    const a = rg.ang * Math.PI / 180;
    const lx = cx + Math.cos(a) * rg.r, ly = cy + Math.sin(a) * rg.r;
    T(P, .74 + i * .04, rg.s, { x: lx, y: ly + 7, 'text-anchor': 'middle', 'font-size': 19,
      'font-weight': 700, 'letter-spacing': '.16em', fill: INK,
      'paint-order': 'stroke', stroke: PANEL, 'stroke-width': 9,
      'stroke-linejoin': 'round' }, g);
  });
  S(P, .10, 'path', { d: `M ${cx - 15},${cy} h 30 M ${cx},${cy - 15} v 30`, stroke: INK,
    'stroke-width': 1.4 }, g);
  F(P, .18, 'circle', { cx, cy, r: 5, fill: INK }, g);
  // the traveller — posed from seek(t), so it is registered but never dash-drawn
  var travTrail = E('path', { fill: 'none', stroke: SIGNAL, 'stroke-width': 2.6,
    'stroke-linecap': 'round', opacity: 0 }, g);
  var travDot = E('circle', { r: 9, fill: SIGNAL, opacity: 0 }, g);
}
const TRAIL = travTrail, DOT = travDot;

/* ── measure every stroked element once, at load ──────────────────────────── */
for (const list of plate) for (const e of list) {
  if (e.__s) {
    const L = e.getTotalLength ? e.getTotalLength() : 0;
    e.__L = L || 1;
    e.style.strokeDasharray = `${e.__L} ${e.__L}`;
    e.style.strokeDashoffset = e.__L;
  } else {
    e.style.opacity = 0;
  }
}

/* ══ THE TRACE — the release beat's own subject ═══════════════════════════
   Not a magnification of Plate V. When the traveller leaves the orbit it puts
   a pen on the page and runs, and the recording it leaves is wider than the
   lens: opening the mask reveals more of the same trace in both directions.
   Screen space, inside the mask, unscaled — it is the page, not the strip.  */
const traceSvg = document.getElementById('trace');
const TR_Y = 780, TR_X0 = -140, TR_X1 = 2060, TR_DX = 4, TR_ENTER = 608;
const TR_PEAKS = [[130, 34, 54], [470, 62, 72], [1180, 124, 86], [1660, 74, 62]];
function traceY(x) {
  let y = TR_Y - 7.5 * Math.sin(x / 46) - 4.6 * Math.sin(x / 22 + 1.1)
                - 3.0 * Math.sin(x / 12.5 + 2.2);
  for (const p of TR_PEAKS) { const u = (x - p[0]) / p[2]; y -= p[1] * Math.exp(-u * u); }
  return y;
}
const TP = [];
for (let x = TR_X0; x <= TR_X1; x += TR_DX) TP.push([x, traceY(x)]);
const TCUM = [0];
for (let i = 1; i < TP.length; i++)
  TCUM.push(TCUM[i - 1] + Math.hypot(TP[i][0] - TP[i - 1][0], TP[i][1] - TP[i - 1][1]));
const TLEN = TCUM[TCUM.length - 1];

const DATUM_Y = 886, DATUM_X0 = 96, DATUM_X1 = 1824;
const datum = E('path', { d: `M ${DATUM_X0},${DATUM_Y} H ${DATUM_X1}`, fill: 'none',
  stroke: LSTRONG, 'stroke-width': 1.2 }, traceSvg);
const TICK_X = [470, 1180, 1660];
const ticks = TICK_X.map(x => E('path', { d: `M ${x},${traceY(x).toFixed(1)} V ${DATUM_Y}`,
  fill: 'none', stroke: LSTRONG, 'stroke-width': 1.3 }, traceSvg));
const tracePath = E('path', {
  d: TP.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1].toFixed(1)).join(' '),
  fill: 'none', stroke: INK, 'stroke-width': 2.4,
  'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, traceSvg);
const pen = E('circle', { r: 8, fill: SIGNAL, opacity: 0 }, traceSvg);
for (const e of [datum, ...ticks, tracePath]) {
  e.__L = e.getTotalLength();
  e.style.strokeDasharray = `${e.__L} ${e.__L}`;
  e.style.strokeDashoffset = e.__L;
}
/** Pen position and arc-length fraction at t. Constant speed once it is visible. */
function traceAt(t) {
  const x = t < 13.62
    ? lerp(TR_X0, TR_ENTER, easeStandard(clamp((t - 12.95) / 0.67)))
    : lerp(TR_ENTER, TR_X1, clamp((t - 13.62) / 2.98));
  const fi = clamp((x - TR_X0) / TR_DX, 0, TP.length - 1.001);
  const i = Math.floor(fi), f = fi - i;
  return { x, y: lerp(TP[i][1], TP[i + 1][1], f), u: lerp(TCUM[i], TCUM[i + 1], f) / TLEN };
}

/* ── the optic: ring, graduations, reticle, registration marks ────────────── */
const optic = document.getElementById('optic');
const gRing = E('g', { transform: `translate(${CX},${CY})` }, optic);
const ring = E('circle', { cx: 0, cy: 0, r: 1, fill: 'none', stroke: LSTRONG,
                           'stroke-width': 3, 'vector-effect': 'non-scaling-stroke' }, gRing);
const gTicks = E('g', { transform: `translate(${CX},${CY})` }, optic);
for (let k = 0; k < 36; k++) {
  const a = k * Math.PI / 18, big = k % 3 === 0;
  E('line', { x1: Math.cos(a), y1: Math.sin(a),
              x2: Math.cos(a) * (big ? 1.055 : 1.03), y2: Math.sin(a) * (big ? 1.055 : 1.03),
              stroke: ONDEEPMUTED, 'stroke-width': big ? 1.8 : 1.1,
              'vector-effect': 'non-scaling-stroke' }, gTicks);
}
const gRet = E('g', {}, optic);
E('path', { d: `M ${CX - 460},${CY} h 920 M ${CX},${CY - 452} v 904`, stroke: ONDEEPMUTED,
            'stroke-width': 1.1 }, gRet);
for (let k = -10; k <= 10; k++) {
  if (!k) continue;
  const d = k * 42, len = k % 5 === 0 ? 11 : 6;
  E('line', { x1: CX + d, y1: CY - len, x2: CX + d, y2: CY + len, stroke: ONDEEPMUTED,
              'stroke-width': 1.1 }, gRet);
  E('line', { x1: CX - len, y1: CY + d, x2: CX + len, y2: CY + d, stroke: ONDEEPMUTED,
              'stroke-width': 1.1 }, gRet);
}
E('circle', { cx: CX, cy: CY, r: 372, fill: 'none', stroke: ONDEEPMUTED, 'stroke-width': 1.4,
              'stroke-dasharray': '5 11' }, gRet);
const gReg = E('g', {}, optic);
[[92, 92], [1828, 92], [92, 988], [1828, 988]].forEach(c =>
  E('path', { d: `M ${c[0] - 13},${c[1]} h 26 M ${c[0]},${c[1] - 13} v 26`, stroke: ONDEEPMUTED,
              'stroke-width': 1.4 }, gReg));

/* ── plate labels in the surround ─────────────────────────────────────────── */
const FIG = ['Fig. I — the query', 'Fig. II — the map pack', 'Fig. III — intent',
             'Fig. IV — the answer engine', 'Fig. V — where they look'];
const figEls = FIG.map(s => {
  const d = document.createElement('span');
  d.textContent = s; document.getElementById('figs').appendChild(d); return d;
});
const FIGWIN = [[1.50, 3.94], [4.40, 6.62], [7.08, 9.28], [9.80, 11.76], [12.22, 13.60]];

/* ── grain: one seeded texture, generated once, never resampled ───────────── */
document.getElementById('grain').style.background = `url(${grainURL(190, 0.052, 23)}) repeat`;

/* ── boot ─────────────────────────────────────────────────────────────────── */
const els = {
  lens: document.getElementById('lens'),
  panel: document.getElementById('panelbg'),
  scale: document.getElementById('stripScale'),
  wrap: document.getElementById('stripWrap'),
  grid: gridRect,
  stmt: document.getElementById('stmt'),
  s1: document.getElementById('s1'), s2: document.getElementById('s2'),
  credit: document.getElementById('credit'), crule: document.getElementById('crule'),
  ca: document.getElementById('ca'), cb: document.getElementById('cb'),
  tl: document.getElementById('tl'), tr: document.getElementById('tr'),
  fr: document.getElementById('fr'), mk: document.getElementById('mk'),
  lock: document.getElementById('lock'),
  xh: document.getElementById('xh'), xhg: document.getElementById('xhg'),
};
let lock = null;

Promise.all([markSVG(), Lockup(document.getElementById('lock'), {
  line: 'Philadelphia. Since 2015.', markSize: 104, wordSize: 72,
})]).then(([svg, lk]) => {
  els.mk.innerHTML = svg;
  const s = els.mk.querySelector('svg');
  s.setAttribute('width', '100%'); s.setAttribute('height', '100%'); s.style.display = 'block';
  lock = lk;
  window.seek(0);
  window.__ready = true;
});

/* ── timeline helpers ─────────────────────────────────────────────────────── */
const DRAW = [[1.35, 1.96], [4.20, 1.82], [6.88, 1.82], [9.60, 1.76], [12.02, 1.48]];

const T_IV_V = 11.88;                                  // the scale-through
const T_OPEN = 14.95;                                  // the mask races past the frame

function lensR(t) {
  let R = 372 * at(t, 0.00, 1.35, easeEmphatic);       // the aperture irises open
  R = lerp(R, 274, at(t, 9.40, 0.78, easeEmphatic));   // it narrows for the manuscript
  R = lerp(R, 452, at(t, T_IV_V, 0.92, easeEmphatic)); // and widens for the celestial chart
  R = lerp(R, 1560, at(t, T_OPEN, 1.05, easeEmphatic));// then races past the frame
  R = lerp(R, 424, at(t, 23.30, 1.65, easeEmphatic));  // and closes back to frame the lockup
  return R;
}

/* IV → V is the one transition that is not a slide: Plate IV is pinned in screen
   space and scaled through the viewer's eye while the strip travels under it, so
   nothing is carved by the mask arc. p4 is that travel. */
const p4at = (t) => at(t, T_IV_V, 0.88, easeEmphatic);

function stripX(t) {
  return at(t, 4.06, 0.62, easeEmphatic)      // I → II : a decisive slide
       + at(t, 6.74, 0.94, easeStandard)      // II → III: a slower drift with a rise
       + at(t, 9.40, 0.72, easeEmphatic)      // III → IV: under a narrowing iris
       + p4at(t);                             // IV → V : the scale-through
}

/* ── the timeline ─────────────────────────────────────────────────────────── */
window.seek = function (t) {

  /* --- the instrument -------------------------------------------------- */
  const R = lensR(t);
  els.lens.style.clipPath = `circle(${R.toFixed(2)}px at ${CX}px ${CY}px)`;

  const surround = Math.max(at(t, 0.25, 0.9) * (1 - at(t, T_OPEN, 0.80)), at(t, 23.90, 0.9));
  gRing.setAttribute('transform', `translate(${CX},${CY}) scale(${(R + 2.4).toFixed(3)})`);
  gTicks.setAttribute('transform', `translate(${CX},${CY}) scale(${R.toFixed(3)})`);
  ring.style.opacity = surround;
  gTicks.style.opacity = surround * 0.85;
  gReg.style.opacity = surround * 0.55;

  /* the reticle: present on the first frame, drifting, gone once the iris lands */
  const ret = 0.52 * (1 - at(t, 0.85, 0.90, easeStandard));
  gRet.style.opacity = ret;
  gRet.setAttribute('transform', `translate(${(osc(t, 5.2) * 7).toFixed(2)},${(osc(t, 3.7, .3) * 5).toFixed(2)})`);

  /* the crosshair holds the plate only until the stem starts — the specimen is
     already forming as the iris settles, so the iris never lands on nothing */
  const xhP = at(t, 0.62, 0.55) * (1 - at(t, 1.40, 0.50, easeStandard));
  els.xh.style.opacity = xhP * 0.85;
  els.xhg.setAttribute('transform',
    `translate(${(osc(t, 4.4) * 13).toFixed(2)},${(osc(t, 3.1, .2) * 9).toFixed(2)})`);

  /* --- the strip under the lens ---------------------------------------- */
  const idx = stripX(t);
  const p4 = p4at(t);
  const rise = -22 * Math.sin(Math.PI * clamp((t - 6.74) / 0.94));      // the II→III drift lifts
  const driftX = osc(t, 9.0) * 3.5, driftY = osc(t, 6.4, 0.35) * 2.6;   // held by hand, not bolted
  els.wrap.style.transform =
    `translate(${(CX - 500 - idx * W + driftX).toFixed(2)}px,${(rise + driftY).toFixed(2)}px)`;

  const sc = 1 + 0.0048 * Math.min(t, 14.2);                            // a slow, constant push
  els.scale.style.transform = `scale(${sc.toFixed(4)})`;

  /* the plates leave together as the traveller puts a pen on the page */
  const platesOut = 1 - at(t, 13.54, 0.58, easeStandard);
  els.grid.style.opacity = 0.85 * (1 - at(t, 14.30, 1.20, easeStandard));
  els.panel.style.opacity = 1 - at(t, 14.85, 1.35, easeStandard);

  /* --- the plates draw themselves in ----------------------------------- */
  for (let i = 0; i < NP; i++) {
    const p = at(t, DRAW[i][0], DRAW[i][1], easeStandard);
    if (p !== G[i].__last) {
      G[i].__last = p;
      for (const e of plate[i]) {
        if (e.__late) continue;                          // posed on its own clock below
        if (e.__s) {
          const q = easeStandard(clamp((p - e.__o * 0.56) / 0.44));
          e.style.strokeDashoffset = (e.__L * (1 - q)).toFixed(2);
        } else {
          e.style.opacity = easeStandard(clamp((p - 0.26 - e.__o * 0.46) / 0.30));
        }
      }
    }
    G[i].style.opacity = platesOut.toFixed(3);
  }
  /* the late accents: the move that lands after each plate has settled */
  for (const e of lateList) {
    const q = at(t, e.__late[0], e.__late[1], easeStandard);
    if (e.__s) e.style.strokeDashoffset = (e.__L * (1 - q)).toFixed(2);
    else e.style.opacity = q.toFixed(3);
  }

  /* Plate IV is pinned in screen space and driven through the viewer's eye from
     its own centre, so the manuscript is never carved by the mask arc. */
  const p4s = at(t, T_IV_V, 0.42, easeStandard);
  G[3].setAttribute('transform',
    `translate(${(3 * W + p4 * W).toFixed(2)},0) translate(500,498) ` +
    `scale(${(1 + 0.92 * p4s).toFixed(4)}) translate(-500,-498)`);
  G[3].style.opacity = ((1 - p4s) * platesOut).toFixed(3);

  /* --- Plate V: the traveller on the ORGANIC ring ----------------------- */
  {
    const live = at(t, 12.70, 0.45) * (1 - at(t, 13.62, 0.30));
    const cx = 500, cy = 496, r = 162;
    const a0 = Math.PI * 0.17, a1 = a0 - Math.PI * 0.80;   // right → top → upper left
    const a = lerp(a0, a1, easeInOut(clamp((t - 12.70) / 1.05)));
    const b = Math.min(a0, a + 0.70);
    const large = 0, sweep = 0;
    TRAIL.setAttribute('d',
      `M ${(cx + Math.cos(b) * r).toFixed(1)},${(cy + Math.sin(b) * r).toFixed(1)}` +
      ` A ${r},${r} 0 ${large} ${sweep} ${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`);
    TRAIL.setAttribute('opacity', (live * 0.55).toFixed(3));
    DOT.setAttribute('cx', (cx + Math.cos(a) * r).toFixed(1));
    DOT.setAttribute('cy', (cy + Math.sin(a) * r).toFixed(1));
    DOT.setAttribute('opacity', live.toFixed(3));
  }

  /* --- the release: one recorded trace, wider than the lens ------------- */
  {
    const tp = traceAt(t);
    const out = 1 - at(t, 20.15, 0.60, easeStandard);
    tracePath.style.strokeDashoffset = (tracePath.__L * (1 - tp.u)).toFixed(2);
    tracePath.style.opacity = out.toFixed(3);
    const penOn = at(t, 12.95, 0.02) * (1 - at(t, 16.58, 0.42, easeStandard));
    pen.setAttribute('cx', tp.x.toFixed(1));
    pen.setAttribute('cy', tp.y.toFixed(1));
    pen.setAttribute('opacity', (penOn * out).toFixed(3));
    // then it is read: the peaks are dropped to a datum and the datum is ruled
    ticks.forEach((e, i) => {
      e.style.strokeDashoffset = (e.__L * (1 - at(t, 17.55 + i * 0.25, 0.36, easeStandard))).toFixed(2);
      e.style.opacity = out.toFixed(3);
    });
    datum.style.strokeDashoffset =
      (datum.__L * (1 - at(t, 18.45, 1.00, easeStandard))).toFixed(2);
    datum.style.opacity = out.toFixed(3);
  }

  /* --- surround furniture ---------------------------------------------- */
  const surOut = 1 - at(t, T_OPEN, 0.70);
  const tlP = at(t, 1.40, 0.8) * surOut;
  els.tl.style.opacity = tlP;
  els.tl.style.transform = `translateX(${((1 - at(t, 1.40, 0.8)) * -18).toFixed(2)}px)`;
  els.tr.style.opacity = at(t, 1.70, 0.8) * surOut;

  /* the Fig. rule and the Fig. label share one envelope — they never separate */
  let figMax = 0;
  figEls.forEach((el, i) => {
    const [a, b] = FIGWIN[i];
    const p = at(t, a, 0.55) * (1 - at(t, b, 0.30, easeStandard));
    el.style.opacity = p;
    el.style.transform = `translateY(${((1 - at(t, a, 0.55)) * 15).toFixed(2)}px)`;
    if (p > figMax) figMax = p;
  });
  els.fr.style.opacity = (figMax * surOut).toFixed(3);
  els.fr.style.transform = `scaleX(${at(t, 1.45, 0.8, easeEmphatic).toFixed(3)})`;
  els.fr.style.transformOrigin = 'left center';

  /* --- the statement --------------------------------------------------- */
  const sOut = at(t, 20.15, 0.50, easeEmphatic);
  revealWords(els.s1, t, 16.10, 0.90, 0.085, 34);
  revealWords(els.s2, t, 16.72, 0.90, 0.085, 34);
  els.stmt.style.opacity = 1 - sOut;
  els.stmt.style.transform = `translateY(${(-sOut * 46).toFixed(2)}px)`;

  /* --- the credit ------------------------------------------------------ */
  const cOut = 1 - at(t, 22.95, 0.45, easeStandard);
  els.crule.style.width = `${(at(t, 20.55, 0.85, easeEmphatic) * 980).toFixed(1)}px`;
  els.credit.style.opacity = cOut;
  const caP = at(t, 21.05, 0.65), cbP = at(t, 21.35, 0.65);
  els.ca.style.opacity = caP; els.ca.style.transform = `translateY(${((1 - caP) * 14).toFixed(2)}px)`;
  els.cb.style.opacity = cbP; els.cb.style.transform = `translateY(${((1 - cbP) * 14).toFixed(2)}px)`;

  /* --- the lockup ------------------------------------------------------ */
  if (lock) lock.pose(at(t, 23.10, 1.45));
};

window.seek(0);
</script>
</body></html>
