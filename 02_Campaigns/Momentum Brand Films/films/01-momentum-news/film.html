<script type="module">
import { at, clamp, lerp, easeEntrance, easeEmphatic, easeStandard, osc,
         markSVG, rng, grainURL, MATERIAL, tornWipe, tapedCard, scatterPose,
         plateStrip, lens, VF }
  from '../../brand/film-kit.js';

window.FILM = { width: 1080, height: 1080, fps: 30, duration: 12.0 };
window.__ready = false;

/* tornWipe() hides the layer it is applied to. A REVEAL is its complement. */
const tornIn = (p, o) => tornWipe(1 - clamp(p), o);

/* ══ palettes, as literals matched to tokens.css ═══════════════════════════ */
const P_PAPER = { disc:'#EDEEE4', rim:'#B4BBAB', land:'#155E86', sea:'#7C8A7F',
                  arc:'#A35309', pin:'#A35309', seaA:0.50, landA:1.0, dot:1.28 };
const P_DEEP  = { disc:'#111A1F', rim:'#33414A', land:'#3897CC', sea:'#F4F1EC',
                  arc:'#E27113', pin:'#E27113', seaA:0.24, landA:1.0, dot:1.0 };

/* ══ material sheets — one source PNG each, addressed by box ═══════════════ */
const TAPE_SHEET = { src: MATERIAL.tapeSet, w:1434, h:736 };
const TAPES = [
  { x:21,  y:1,   w:779, h:187 },
  { x:876, y:4,   w:538, h:191 },
  { x:512, y:275, w:867, h:184 },
  { x:20,  y:278, w:354, h:188 },
  { x:744, y:541, w:688, h:181 },
  { x:0,   y:551, w:642, h:184 },
];
const FAST_SHEET = { src: MATERIAL.fasteners, w:1328, h:737 };
const FASTS = { pinA:{x:789,y:278,w:202,h:143}, pinB:{x:684,y:338,w:203,h:140},
                clip:{x:1170,y:75,w:157,h:591} };
/* the torn strip's real alpha extent, measured: (118,1)-(1482,404) of 1600x645 */
const TORN_SHEET = { src: MATERIAL.tornStrip, w:1600, h:645 };
const TORN = {
  full: { x:118, y:1, w:1364, h:403 },   /* ragged on all four sides   */
  midA: { x:400, y:1, w:820,  h:403 },   /* scissor-cut ends, chunkier */
  midB: { x:250, y:1, w:760,  h:403 },
  band: { x:118, y:1, w:1364, h:403 },
  sign: { x:640, y:1, w:520,  h:403 },
};

function applyCrop(el, sheet, box, displayW) {
  const k = displayW / box.w;
  el.style.width  = displayW + 'px';
  el.style.height = (box.h * k) + 'px';
  el.style.backgroundImage = `url(${sheet.src})`;
  el.style.backgroundSize = `${sheet.w * k}px ${sheet.h * k}px`;
  el.style.backgroundPosition = `${-box.x * k}px ${-box.y * k}px`;
  return box.h * k;
}

/* ══ hand-cut edges: a deckle polygon, seeded once, never at paint time ════ */
function deckle(seed, amp = 0.7, n = 13) {
  const r = rng(seed);
  const j = () => (r() - 0.5) * 2 * amp;
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push([i / n * 100, j()]);
  for (let i = 1; i <= n; i++) pts.push([100 + j(), i / n * 100]);
  for (let i = n - 1; i >= 0; i--) pts.push([i / n * 100, 100 + j()]);
  for (let i = n - 1; i >= 1; i--) pts.push([j(), i / n * 100]);
  return `polygon(${pts.map(p => `${p[0].toFixed(2)}% ${p[1].toFixed(2)}%`).join(',')})`;
}

/* ══ the sphere: a fixed point set, built once ═════════════════════════════ */
let PTS_BIG = [], PTS_SM = [];
async function buildPoints() {
  const txt = await fetch('../../brand/land-mask.txt').then(r => r.text());
  const [head, b64] = txt.trim().split('\n');
  const [NX, NY] = head.split(' ').map(Number);
  const bin = atob(b64);
  const bit = (i) => (bin.charCodeAt(i >> 3) >> (i & 7)) & 1;
  const build = (STEP) => {
    const pts = [];
    for (let j = 0; j < NY; j += STEP) {
      const lat = 90 - (j + 0.5) * 180 / NY;
      const cosl = Math.cos(lat * Math.PI / 180);
      const stride = Math.max(STEP, Math.round(STEP / Math.max(0.12, cosl)));
      for (let i = 0; i < NX; i += stride) {
        const lon = -180 + (i + 0.5) * 360 / NX;
        pts.push({ lat, lon, land: bit(j * NX + i) === 1 });
      }
    }
    return pts;
  };
  PTS_BIG = build(2);
  PTS_SM  = build(4);
}

const D2R = Math.PI / 180;
function project(lat, lon, rot, cx, cy, R) {
  const a = (lon + rot) * D2R, b = lat * D2R;
  const cb = Math.cos(b);
  const x = cb * Math.sin(a), y = -Math.sin(b), z = cb * Math.cos(a);
  return { x: cx + x * R, y: cy + y * R, z, limb: Math.hypot(x, y) };
}
function slerp(p, q, f) {
  const [la1, lo1] = p.map(v => v * D2R), [la2, lo2] = q.map(v => v * D2R);
  const A = [Math.cos(la1)*Math.cos(lo1), Math.cos(la1)*Math.sin(lo1), Math.sin(la1)];
  const B = [Math.cos(la2)*Math.cos(lo2), Math.cos(la2)*Math.sin(lo2), Math.sin(la2)];
  let d = Math.max(-1, Math.min(1, A[0]*B[0] + A[1]*B[1] + A[2]*B[2]));
  const w = Math.acos(d), s = Math.sin(w);
  const k1 = s < 1e-6 ? 1 - f : Math.sin((1 - f) * w) / s;
  const k2 = s < 1e-6 ? f : Math.sin(f * w) / s;
  const v = [A[0]*k1 + B[0]*k2, A[1]*k1 + B[1]*k2, A[2]*k1 + B[2]*k2];
  const n = Math.hypot(v[0], v[1], v[2]);
  return [Math.asin(v[2] / n) / D2R, Math.atan2(v[1], v[0]) / D2R];
}
const PHL = [39.95, -75.16];
const DESTS = [
  [40.71, -74.01], [38.91, -77.04], [42.36, -71.06], [43.65, -79.38],
  [41.88, -87.63], [25.76, -80.19], [39.74, -104.99], [34.05, -118.24],
  [49.28, -123.12], [19.43, -99.13],
];
const ARCS = DESTS.map(d => Array.from({ length: 56 }, (_, i) => slerp(PHL, d, i / 55)));

function drawGlobe(ctx, W, pts, cx, cy, R, rot, born, pal, arcT, scale) {
  ctx.clearRect(0, 0, W, W);
  if (born <= 0) return;
  ctx.globalAlpha = 1;
  ctx.fillStyle = pal.disc;
  ctx.beginPath(); ctx.arc(cx, cy, R * born, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = pal.rim; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, R * born, 0, 6.2832); ctx.stroke();

  for (const p of pts) {
    const q = project(p.lat, p.lon, rot, cx, cy, R);
    if (q.z <= 0.02) continue;
    if (q.limb > born * 1.06) continue;
    const depth = q.z;
    const edge = 1 - Math.pow(q.limb, 3.4);
    if (p.land) {
      ctx.globalAlpha = (0.50 + 0.50 * depth) * edge * pal.landA;
      ctx.fillStyle = pal.land;
      const r = (1.0 + 1.7 * depth) * scale * (pal.dot || 1);
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 6.2832); ctx.fill();
    } else {
      ctx.globalAlpha = pal.seaA * (0.35 + 0.65 * depth) * edge;
      ctx.fillStyle = pal.sea;
      const s2 = 1.45 * scale;
      ctx.fillRect(q.x - s2 / 2, q.y - s2 / 2, s2, s2);
    }
  }
  ctx.globalAlpha = 1;

  /* inked great-circle arcs out of Philadelphia — the reference's good idea */
  ARCS.forEach((path, i) => {
    const draw = at(arcT, i * 0.082, 0.60, easeEntrance);
    if (draw <= 0) return;
    const fade = 1 - 0.52 * at(arcT, i * 0.082 + 1.05, 1.4, easeStandard);
    const n = Math.max(2, Math.round(draw * path.length));
    ctx.beginPath();
    let pen = false;
    for (let k = 0; k < n; k++) {
      const q = project(path[k][0], path[k][1], rot, cx, cy, R * 1.004);
      if (q.z <= 0) { pen = false; continue; }
      if (!pen) { ctx.moveTo(q.x, q.y); pen = true; } else ctx.lineTo(q.x, q.y);
    }
    ctx.strokeStyle = pal.arc;
    ctx.globalAlpha = 0.92 * fade;
    ctx.lineWidth = 2.4 * scale;
    ctx.lineCap = 'round';
    ctx.stroke();
    if (draw >= 1) {
      const q = project(path[path.length-1][0], path[path.length-1][1], rot, cx, cy, R * 1.01);
      if (q.z > 0) {
        ctx.globalAlpha = 0.95 * fade; ctx.fillStyle = pal.pin;
        ctx.beginPath(); ctx.arc(q.x, q.y, 3.8 * scale, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  });

  const q = project(PHL[0], PHL[1], rot, cx, cy, R * 1.01);
  if (q.z > 0) {
    const beat = 0.5 + 0.5 * osc(arcT, 1.9);
    ctx.globalAlpha = 0.26 * beat; ctx.fillStyle = pal.pin;
    ctx.beginPath(); ctx.arc(q.x, q.y, (6 + 5 * beat) * scale, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(q.x, q.y, 4.0 * scale, 0, 6.2832); ctx.fill();
  }
}

/* ══ ticker band content ═══════════════════════════════════════════════════ */
const TICK = ['"roofer near me"', 'Map pack', 'AI answers', 'Organic', 'Paid', 'GBP'];
const strip2 = document.getElementById('strip2');
for (let rep = 0; rep < 5; rep++) for (const w of TICK) {
  const s = document.createElement('span');
  s.textContent = w;
  if (w.startsWith('"')) s.className = 'hot';
  strip2.appendChild(s);
}

/* ══ elements ══════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const E = {
  paper:$('paper'), lkP:$('lkP'), lkD:$('lkD'), badge:$('badge'), tapeB:$('tapeB'),
  plateP:$('plateP'), faceP:$('faceP'), tape1:$('tape1'), tape2:$('tape2'),
  pinP:$('pinP'), clipimg:$('clipimg'), strip1:$('strip1'), ring:$('ring').getContext('2d'),
  strips:[$('s1'),$('s2'),$('s3'),$('s4')], sUnder:$('sUnder'),
  tgroup:$('tgroup'), titlecard:$('titlecard'), tl2clip:$('tl2clip'), tl2:$('tl2'),
  tl1:$('tl1'), tbar:$('tbar'), tapeT1:$('tapeT1'), tapeT2:$('tapeT2'),
  rule:$('rule'), cap:$('cap'),
  plateD:$('plateD'), faceD:$('faceD'), tapeD:$('tapeD'), pinD:$('pinD'), aperD:$('aperD'),
  band:$('band'), signstrip:$('signstrip'), birds:[$('b0'),$('b1'),$('b2')],
  gp:$('gp').getContext('2d'), gd:$('gd').getContext('2d'),
  grainP:$('grainP'), grainD:$('grainD'), deckleEl:$('deckle'),
};

/* ══ deterministic geometry, seeded once at load ═══════════════════════════ */
const DECKLE_EDGE = (() => {
  const r = rng(0x2ad39), n = 34, pts = [];
  for (let i = 0; i <= n; i++) pts.push({ y: i / n * 100, x: 30 + (r() - 0.5) * 48 });
  return 'polygon(100% 0%,100% 100%,'
       + pts.slice().reverse().map(p => `${p.x.toFixed(1)}% ${p.y.toFixed(1)}%`).join(',') + ')';
})();
const CUT_PLATE = deckle(0x71a3, 0.55);
const CUT_TITLE = deckle(0x9c2e, 0.42);
const CUT_PLATED = deckle(0x33f1, 0.9);

/* the four label strips: box, width, position, tilt, tear direction */
const STRIPS = [
  { box: TORN.full, w: 348, x: 668, y: 236, rot: -1.7, dir: 'rtl', seed: 12, t: 0.14 },
  { box: TORN.midA, w: 318, x: 690, y: 384, rot:  1.3, dir: 'ltr', seed: 31, t: 0.40 },
  { box: TORN.full, w: 366, x: 660, y: 566, rot: -0.9, dir: 'rtl', seed: 57, t: 0.66 },
  { box: TORN.midB, w: 332, x: 682, y: 700, rot:  2.2, dir: 'ltr', seed: 74, t: 0.92 },
];
const BIRD_BASE = [{ rot:-6, drop:34 }, { rot:3, drop:26 }, { rot:-4, drop:30 }];
const TILT_PLATE = -1.6, TILT_BADGE = 2.2, TILT_PLATED = 2.5, TILT_TITLE = -1.8;

/* ══ boot ══════════════════════════════════════════════════════════════════ */
const IMGS = [...document.querySelectorAll('img')];
function preload(src) {
  return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}

Promise.all([
  buildPoints(),
  markSVG(),
  preload(MATERIAL.tapeSet),
  preload(MATERIAL.fasteners),
  preload(MATERIAL.tornStrip),
  Promise.all(IMGS.map(i => (i.getAttribute('src') ? i.decode().catch(() => {}) : null))),
]).then(([, svg]) => {
  for (const host of [E.lkP, E.lkD]) {
    const m = host.querySelector('.mk');
    m.innerHTML = svg;
    const s = m.querySelector('svg');
    s.setAttribute('width', '100%'); s.setAttribute('height', '100%'); s.style.display = 'block';
  }

  /* hand-cut card edges */
  E.faceP.style.clipPath = CUT_PLATE;
  document.getElementById('faceT').style.clipPath = CUT_TITLE;
  E.faceD.style.clipPath = CUT_PLATED;
  E.deckleEl.style.clipPath = DECKLE_EDGE;

  /* torn label strips */
  STRIPS.forEach((s, i) => {
    const el = E.strips[i];
    const h = applyCrop(el, TORN_SHEET, s.box, s.w);
    el.style.left = s.x + 'px';
    el.style.top  = s.y + 'px';
    s.h = h;
  });
  /* the signal underline lives under the hot query on strip 01 */
  E.sUnder.style.left = (STRIPS[0].x + 34) + 'px';
  E.sUnder.style.top  = (STRIPS[0].y + STRIPS[0].h * 0.63) + 'px';
  E.sUnder.style.transform = `rotate(${STRIPS[0].rot}deg)`;
  E.sUnder.style.transformOrigin = '0% 50%';

  /* the bottom band and the sign-off strip */
  applyCrop(E.band, TORN_SHEET, TORN.band, 1248);
  applyCrop(E.signstrip, TORN_SHEET, TORN.sign, 306);

  /* tape and fasteners */
  applyCrop(E.tape1, TAPE_SHEET, TAPES[0], 158);
  applyCrop(E.tape2, TAPE_SHEET, TAPES[4], 136);
  applyCrop(E.tapeB, TAPE_SHEET, TAPES[3], 104);
  applyCrop(E.tapeD, TAPE_SHEET, TAPES[1], 118);
  applyCrop(E.tapeT1, TAPE_SHEET, TAPES[2], 184);
  applyCrop(E.tapeT2, TAPE_SHEET, TAPES[5], 152);
  applyCrop(E.pinP,  FAST_SHEET, FASTS.pinA, 34);
  applyCrop(E.pinD,  FAST_SHEET, FASTS.pinB, 32);
  const cb = FASTS.clip, ck = 26 / cb.w;
  E.clipimg.removeAttribute('src');
  E.clipimg.style.width = '26px'; E.clipimg.style.height = (cb.h * ck) + 'px';
  E.clipimg.style.backgroundImage = `url(${FAST_SHEET.src})`;
  E.clipimg.style.backgroundSize = `${FAST_SHEET.w * ck}px ${FAST_SHEET.h * ck}px`;
  E.clipimg.style.backgroundPosition = `${-cb.x * ck}px ${-cb.y * ck}px`;
  E.clipimg.style.transform = 'rotate(11deg)';

  const g = grainURL(160, 0.05, 11);
  E.grainP.style.backgroundImage = `url(${g})`;
  E.grainD.style.backgroundImage = `url(${g})`;
  E.grainD.style.opacity = '.32';

  return document.fonts.ready.then(() => {
    E.sUnder.style.width = (E.strips[0].querySelector('.lab').offsetWidth + 6) + 'px';
    const hot = [...strip2.querySelectorAll('span.hot')];
    const target = hot.reduce((a, b) => (Math.abs(b.offsetLeft - 640) < Math.abs(a.offsetLeft - 640) ? b : a));
    TICK_REST = -(target.offsetLeft - 360);
    TICK_START = TICK_REST + 292;
    window.seek(0);
    window.__ready = true;
  });
});
let TICK_REST = 0, TICK_START = 292;

/* ══ the timeline ══════════════════════════════════════════════════════════
   0.00  the desk is already dressed — a compass chart under the lens
   0.14  four torn label strips tear into place, one after another
   0.60  lockup wipes in · 0.90 the badge is taped down
   1.45  DEVICE 04 — the strip travels: compass out, local demand in
   2.35  the arcs draw out of Philadelphia · birds settle on the material
   4.35  DEVICE 01 — the tear. The desk is pulled off the deep board
   4.45  DEVICE 03 — the birds scatter; one crosses and rides it out
   5.25  DEVICE 02 — MOMENTUM / SIGNAL lands as a taped card
   6.60  the plate comes back demoted, small and pinned
   7.30  the rule draws · 7.85 the editorial line
   8.60  the torn ticker band rises; the whole title group lifts for it
  10.90  the sign-off strip is pasted over the band's right end          */
window.seek = function (t) {

  /* ── the tear ─────────────────────────────────────────────────────────── */
  const tear = at(t, 4.35, 1.35, easeEmphatic);
  E.paper.style.clipPath = tear > 0
    ? tornWipe(tear * 1.10, { seed: 41, teeth: 46, jag: 0.026, dir: 'ltr' })
    : 'none';

  const rot = 48 + t * 7.0;

  /* ═══════════ THE DESK — beats 1 to 3 ═══════════ */

  /* the plate is already down when the film starts: no dead first frame */
  E.plateP.style.transform = `rotate(${TILT_PLATE}deg)`;
  E.tape1.style.left = '106px'; E.tape1.style.top = '212px';
  E.tape1.style.transform = 'rotate(-7.5deg)';
  E.tape2.style.left = '498px'; E.tape2.style.top = '826px';
  E.tape2.style.transform = 'rotate(5deg)';
  const pnP = at(t, 0.30, 0.26, easeEmphatic);
  E.pinP.style.left = '592px'; E.pinP.style.top = '246px';
  E.pinP.style.opacity = pnP;
  E.pinP.style.transform = `rotate(${lerp(-18, 0, pnP)}deg) scale(${lerp(1.4, 1, pnP)})`;

  /* the compass ring is re-scribed over the engraved plate */
  const scribe = at(t, 0.06, 1.00, easeEmphatic);
  const rc = E.ring;
  rc.clearRect(0, 0, 500, 500);
  if (scribe > 0) {
    rc.save();
    rc.strokeStyle = '#5F6C60'; rc.lineWidth = 2.2; rc.globalAlpha = 0.9;
    rc.beginPath(); rc.arc(250, 250, 243, -Math.PI/2, -Math.PI/2 + scribe*Math.PI*2); rc.stroke();
    rc.strokeStyle = '#9BA595'; rc.lineWidth = 1; rc.globalAlpha = 0.75;
    rc.beginPath(); rc.arc(250, 250, 231, -Math.PI/2, -Math.PI/2 + scribe*Math.PI*2); rc.stroke();
    if (scribe < 1) {
      const a = -Math.PI/2 + scribe*Math.PI*2;
      rc.globalAlpha = 1; rc.fillStyle = '#A35309';
      rc.beginPath(); rc.arc(250 + Math.cos(a)*243, 250 + Math.sin(a)*243, 3.6, 0, 6.2832); rc.fill();
    }
    rc.restore();
  }
  /* the lens is a hard circular mask, open from frame one */
  document.getElementById('aperP').style.clipPath = lens(250, 250, 243);

  /* DEVICE 01 as a reveal — each label strip is TORN into place, not faded */
  STRIPS.forEach((s, i) => {
    const el = E.strips[i];
    const p = at(t, s.t, 0.52, easeEmphatic);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.clipPath = p >= 1 ? 'none' : tornIn(p, { seed: s.seed, teeth: 15, jag: 0.055, dir: s.dir });
    el.style.transform = `rotate(${s.rot}deg) translateY(${((1 - p) * 9).toFixed(1)}px)`;
  });
  /* the signal underline is scribed under the live query, on its own beat */
  const und = at(t, 3.05, 0.44, easeEmphatic);
  E.sUnder.style.clipPath = `inset(0 ${((1 - und) * 100).toFixed(1)}% 0 0)`;
  E.sUnder.style.opacity = und > 0 ? 1 : 0;

  /* DEVICE 04 — the lens holds; the strip of plates travels beneath it.
     compass chart → local demand. A cut, made of paper, not a cross-fade.  */
  const travel = at(t, 1.45, 0.78, easeEmphatic);
  E.strip1.style.transform = plateStrip(travel, 500);

  const born = at(t, 1.62, 0.62, easeStandard);
  if (t < 6.1) drawGlobe(E.gp, 500, PTS_BIG, 250, 250, 219, rot, born, P_PAPER, t - 2.35, 0.96);

  /* corner furniture */
  const lkp = at(t, 0.60, 0.78, easeEntrance);
  E.lkP.style.opacity = lkp > 0 ? 1 : 0;
  E.lkP.style.clipPath = `inset(0 ${((1 - lkp) * 100).toFixed(1)}% 0 0)`;

  const bdg = tapedCard(at(t, 0.90, 0.70), 1, { rise: 24, tilt: TILT_BADGE });
  E.badge.style.transform = bdg.transform;
  E.badge.style.opacity = bdg.opacity;
  E.badge.style.boxShadow = bdg.boxShadow;
  const tpb = at(t, 1.20, 0.24, easeEmphatic);
  E.tapeB.style.right = '200px'; E.tapeB.style.top = '50px';
  E.tapeB.style.opacity = tpb;
  E.tapeB.style.transform = `rotate(-6deg) scale(${lerp(1.12, 1, tpb)})`;

  /* ═══════════ BIRDS — settle on the material, then break the beat ═══════ */
  const scat = at(t, 4.45, 1.05, easeEntrance);
  E.birds.forEach((b, i) => {
    const inP = at(t, 2.42 + i * 0.15, 0.66, easeEntrance);
    if (scat <= 0) {
      b.style.opacity = inP;
      b.style.filter = 'none';
      b.style.transform = `translateY(${((1 - inP) * BIRD_BASE[i].drop).toFixed(1)}px)`
                        + ` rotate(${BIRD_BASE[i].rot}deg)`;
      return;
    }
    if (i < 2) {                       /* two cut loose and take the beat with them */
      const s = scatterPose(scat, i, 3, { seed: 19, spread: 1.05 });
      b.style.opacity = s.opacity;
      b.style.filter = 'none';
      b.style.transform = `${s.transform} rotate(${BIRD_BASE[i].rot}deg)`;
    } else {                           /* one crosses the tear and lands on the card */
      const e = easeEntrance(clamp((t - 4.62) / 1.75));
      const bow = Math.sin(Math.PI * e);
      const lf  = at(t, 8.60, 0.90, easeStandard);
      b.style.opacity = 1;
      b.style.filter = `brightness(${lerp(1, 1.30, e).toFixed(3)})`;
      b.style.transform =
        `translate(${(-152 * e + 88 * bow).toFixed(1)}px, ${(-486 * e - 150 * bow - 38 * lf * e).toFixed(1)}px)`
      + ` rotate(${lerp(BIRD_BASE[2].rot, 6, e).toFixed(1)}deg) scale(${lerp(1, 0.82, e).toFixed(3)})`;
    }
  });

  /* ═══════════ THE DEEP BOARD — beats 4 to 7 ═══════════ */

  /* the mark's one restrained scale-pulse, on the settle beat */
  const pl = Math.sin(clamp((t - 9.85) / 0.60) * Math.PI);
  E.lkD.querySelector('.mk').style.transform = `scale(${(1 + 0.07 * pl).toFixed(3)})`;

  /* DEVICE 02 — the title arrives as a taped card of warm paper */
  const tc = tapedCard(at(t, 5.25, 1.00), 0, { rise: 46, tilt: TILT_TITLE });
  E.titlecard.style.transform = tc.transform;
  E.titlecard.style.opacity = tc.opacity;
  const t1 = at(t, 5.55, 0.62, easeEntrance);
  E.tl1.style.opacity = t1;
  E.tl1.style.clipPath = `inset(0 ${((1 - t1) * 100).toFixed(1)}% 0 0)`;
  const t2 = at(t, 6.00, 0.72, easeEmphatic);
  E.tl2clip.style.clipPath = `inset(0 ${((1 - t2) * 100).toFixed(2)}% 0 0)`;
  E.tl2.style.transform = `translateX(${((1 - t2) * -30).toFixed(1)}px)`;
  E.tbar.style.transform = `scaleY(${at(t, 5.45, 0.55, easeEmphatic).toFixed(3)})`;
  E.tbar.style.transformOrigin = '50% 0%';

  const tt1 = at(t, 5.62, 0.22, easeEmphatic);
  E.tapeT1.style.left = '40px'; E.tapeT1.style.top = '446px';
  E.tapeT1.style.opacity = tt1 * tc.opacity;
  E.tapeT1.style.transform = `rotate(-6.5deg) scale(${lerp(1.14, 1, tt1)})`;
  const tt2 = at(t, 5.86, 0.22, easeEmphatic);
  E.tapeT2.style.left = '852px'; E.tapeT2.style.top = '712px';
  E.tapeT2.style.opacity = tt2 * tc.opacity;
  E.tapeT2.style.transform = `rotate(4.5deg) scale(${lerp(1.14, 1, tt2)})`;

  /* the plate is not deleted, it is demoted: small, taped, pinned */
  const pd = tapedCard(at(t, 6.60, 0.90), 2, { rise: -28, tilt: TILT_PLATED });
  E.plateD.style.transform = `${pd.transform} translateX(${((1 - easeEntrance(clamp((t - 6.60) / 0.9))) * 52).toFixed(1)}px)`;
  E.plateD.style.opacity = pd.opacity;
  E.aperD.style.clipPath = lens(113, 113, 113);
  const tpd = at(t, 7.05, 0.26, easeEmphatic);
  E.tapeD.style.right = '240px'; E.tapeD.style.top = '74px';
  E.tapeD.style.opacity = tpd * pd.opacity;
  E.tapeD.style.transform = `rotate(-5deg) scale(${lerp(1.12, 1, tpd)})`;
  const pnd = at(t, 9.65, 0.28, easeEmphatic);
  E.pinD.style.right = '300px'; E.pinD.style.top = '360px';
  E.pinD.style.opacity = pnd;
  E.pinD.style.transform = `rotate(${lerp(22, 4, pnd)}deg) scale(${lerp(1.4, 1, pnd)})`;

  if (t > 6.2) drawGlobe(E.gd, 226, PTS_SM, 113, 113, 98, rot, 1, P_DEEP, t - 2.35, 0.62);

  /* rule + the film's one editorial line */
  const lift = at(t, 8.60, 0.90, easeStandard);
  E.tgroup.style.transform = `translateY(${((1 - lift) * 40).toFixed(1)}px)`;
  E.rule.style.width = `${(at(t, 7.30, 0.95, easeEmphatic) * lerp(430, 690, lift)).toFixed(0)}px`;
  const capP = at(t, 7.85, 0.80, easeEntrance);
  E.cap.style.opacity = capP;
  E.cap.style.transform = `translateY(${((1 - capP) * 16).toFixed(1)}px)`;

  /* the ticker rides a torn band: paper arrives like paper, and travels */
  const bIn = at(t, 8.60, 0.90, easeEntrance);
  E.band.style.opacity = bIn > 0 ? 1 : 0;
  E.band.style.clipPath = bIn >= 1 ? 'none'
    : tornIn(bIn, { seed: 88, teeth: 30, jag: 0.020, dir: 'rtl' });
  E.band.style.transform = `translateY(${lerp(58, 0, bIn).toFixed(1)}px)`;
  const glide = at(t, 8.62, 2.30, easeStandard);
  strip2.style.transform = `translateX(${lerp(TICK_START, TICK_REST, glide).toFixed(1)}px)`;
  const dim = at(t, 11.02, 0.60, easeStandard);
  strip2.style.color = dim > 0.5 ? 'var(--m-warm-muted)' : 'var(--m-warm-ink)';
  [...strip2.querySelectorAll('.hot')].forEach(s => {
    s.style.color = dim > 0.5 ? 'var(--m-warm-muted)' : 'var(--m-signal-ink)';
  });

  /* the sign-off is a last scrap, pasted over the band's right end */
  const sg = at(t, 10.90, 0.60, easeEmphatic);
  E.signstrip.style.opacity = sg > 0 ? 1 : 0;
  E.signstrip.style.clipPath = sg >= 1 ? 'none'
    : tornIn(sg, { seed: 63, teeth: 14, jag: 0.06, dir: 'rtl' });
  E.signstrip.style.transform = `rotate(1.7deg) translateY(${((1 - sg) * 12).toFixed(1)}px)`;
};

window.seek(0);
</script>
</body></html>
