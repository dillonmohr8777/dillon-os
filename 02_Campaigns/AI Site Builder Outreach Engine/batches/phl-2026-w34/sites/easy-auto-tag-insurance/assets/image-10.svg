<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 10 for easy-auto-tag-insurance</title>
  <defs>
    <linearGradient id="g10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 15%)"/>
      <stop offset=".45" stop-color="hsl(169 58% 40%)"/>
      <stop offset="1" stop-color="hsl(43 28% 90%)"/>
    </linearGradient>
    <radialGradient id="r10" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(181 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 15%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(181 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <style>
      .float { animation: float 6.35s ease-in-out infinite alternate; }
      .spin { animation: spin 9.60s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 6.35s ease-in-out infinite alternate; }
      .sheen { animation: sheen 9.35s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(18px, -22px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(43 28% 90%)"/>
  <rect width="1600" height="1000" fill="url(#g10)" opacity=".88"/>
  <ellipse class="float" cx="531" cy="370" rx="261" ry="145" fill="url(#r10)" filter="url(#f10)" opacity=".85"/>
  <ellipse class="pulse" cx="1010" cy="560" rx="185" ry="81" fill="hsl(181 62% 52%)" opacity=".35" filter="url(#f10)"/>
  <circle class="float" cx="710" cy="470" r="64" fill="hsl(25 78% 54%)" opacity=".28"/>
  <circle class="pulse" cx="1290" cy="310" r="28" fill="hsl(169 58% 40%)" opacity=".22"/>
  <g class="spin" opacity=".22">
    <path d="M80 16 124 36v34c0 28-20 48-44 58-24-10-44-30-44-58V36z" fill="hsl(169 58% 40%)" transform="translate(720 380) scale(4.2)"/>
  </g>
  <g class="float" opacity=".9">
    <path d="M80 16 124 36v34c0 28-20 48-44 58-24-10-44-30-44-58V36z" fill="hsl(43 28% 90%)" stroke="hsl(169 58% 40%)" stroke-width="4" transform="translate(588 220) scale(3.4)"/>
  </g>
  <rect x="120" y="90" width="1360" height="820" fill="url(#glass10)" rx="48" opacity=".55"/>
  <rect class="sheen" x="120" y="90" width="220" height="820" fill="#fff" opacity=".12" rx="48"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="hsl(181 62% 52%)" stroke-opacity=".35" stroke-width="2" rx="42"/>
</svg>
