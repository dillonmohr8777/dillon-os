<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 9 for train-and-nourish</title>
  <defs>
    <linearGradient id="g9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 10%)"/>
      <stop offset=".45" stop-color="hsl(180 58% 39%)"/>
      <stop offset="1" stop-color="hsl(44 28% 91%)"/>
    </linearGradient>
    <radialGradient id="r9" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(192 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 10%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(192 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <style>
      .float { animation: float 10.70s ease-in-out infinite alternate; }
      .spin { animation: spin 9.20s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 10.70s ease-in-out infinite alternate; }
      .sheen { animation: sheen 13.7s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(17px, -21px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(44 28% 91%)"/>
  <rect width="1600" height="1000" fill="url(#g9)" opacity=".88"/>
  <ellipse class="float" cx="635" cy="283" rx="262" ry="78" fill="url(#r9)" filter="url(#f9)" opacity=".85"/>
  <ellipse class="pulse" cx="987" cy="541" rx="118" ry="82" fill="hsl(192 62% 52%)" opacity=".35" filter="url(#f9)"/>
  <circle class="float" cx="669" cy="441" r="56" fill="hsl(26 78% 54%)" opacity=".28"/>
  <circle class="pulse" cx="1271" cy="273" r="52" fill="hsl(180 58% 39%)" opacity=".22"/>
  <g class="spin" opacity=".22">
    <path d="M80 28a40 40 0 1 1 0 80 40 40 0 1 1 0-80zm0 14a26 26 0 1 0 .1 0z" fill="hsl(180 58% 39%)" transform="translate(720 380) scale(4.2)"/>
  </g>
  <g class="float" opacity=".9">
    <path d="M80 28a40 40 0 1 1 0 80 40 40 0 1 1 0-80zm0 14a26 26 0 1 0 .1 0z" fill="hsl(44 28% 91%)" stroke="hsl(180 58% 39%)" stroke-width="4" transform="translate(552 332) scale(3.4)"/>
  </g>
  <rect x="120" y="90" width="1360" height="820" fill="url(#glass9)" rx="48" opacity=".55"/>
  <rect class="sheen" x="120" y="90" width="220" height="820" fill="#fff" opacity=".12" rx="48"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="hsl(192 62% 52%)" stroke-opacity=".35" stroke-width="2" rx="42"/>
</svg>
