  <rect width="1600" height="1000" fill="url(#g3)" opacity=".88"/>
  <ellipse class="float" cx="481" cy="237" rx="270" ry="74" fill="url(#r3)" filter="url(#f3)" opacity=".85"/>
  <ellipse class="pulse" cx="1049" cy="547" rx="114" ry="90" fill="hsl(184 62% 52%)" opacity=".35" filter="url(#f3)"/>
