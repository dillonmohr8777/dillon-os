<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 13 for auger-manufacturing</title>
  <defs>
    <linearGradient id="g13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 14%)"/>
      <stop offset=".45" stop-color="hsl(164 58% 43%)"/>
      <stop offset="1" stop-color="hsl(48 28% 91%)"/>
    </linearGradient>
    <radialGradient id="r13" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(176 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 14%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(176 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f13" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <style>
      .float { animation: float 9.70s ease-in-out infinite alternate; }
      .spin { animation: spin 8.40s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 9.70s ease-in-out infinite alternate; }
      .sheen { animation: sheen 12.7s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(21px, -25px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
