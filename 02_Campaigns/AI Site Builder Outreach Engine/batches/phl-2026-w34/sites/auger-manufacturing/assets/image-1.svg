<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 1 for auger-manufacturing</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 15%)"/>
      <stop offset=".45" stop-color="hsl(179 58% 39%)"/>
      <stop offset="1" stop-color="hsl(49 28% 91%)"/>
    </linearGradient>
    <radialGradient id="r1" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(191 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 15%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(191 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <style>
      .float { animation: float 8.05s ease-in-out infinite alternate; }
      .spin { animation: spin 8.40s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 8.05s ease-in-out infinite alternate; }
      .sheen { animation: sheen 11.05s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(9px, -13px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(49 28% 91%)"/>
  <rect width="1600" height="1000" fill="url(#g1)" opacity=".88"/>
  <ellipse class="float" cx="608" cy="256" rx="291" ry="76" fill="url(#r1)" filter="url(#f1)" opacity=".85"/>
  <ellipse class="pulse" cx="1003" cy="509" rx="116" ry="111" fill="hsl(191 62% 52%)" opacity=".35" filter="url(#f1)"/>
  <circle class="float" cx="341" cy="209" r="48" fill="hsl(25 78% 54%)" opacity=".28"/>
  <circle class="pulse" cx="1119" cy="197" r="34" fill="hsl(179 58% 39%)" opacity=".22"/>
  <g class="spin" opacity=".22">
    <path d="M70 18h20l6 16 16-6 10 18-14 10 14 10-10 18-16-6-6 16H70l-6-16-16 6-10-18 14-10-14-10 10-18 16 6z M80 58a18 18 0 1 0 0.1 0z" fill="hsl(179 58% 39%)" transform="translate(720 380) scale(4.2)"/>
  </g>
  <g class="float" opacity=".9">
    <path d="M70 18h20l6 16 16-6 10 18-14 10 14 10-10 18-16-6-6 16H70l-6-16-16 6-10-18 14-10-14-10 10-18 16 6z M80 58a18 18 0 1 0 0.1 0z" fill="hsl(49 28% 91%)" stroke="hsl(179 58% 39%)" stroke-width="4" transform="translate(516 248) scale(3.4)"/>
  </g>
  <rect x="120" y="90" width="1360" height="820" fill="url(#glass1)" rx="48" opacity=".55"/>
  <rect class="sheen" x="120" y="90" width="220" height="820" fill="#fff" opacity=".12" rx="48"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="hsl(191 62% 52%)" stroke-opacity=".35" stroke-width="2" rx="42"/>
</svg>
