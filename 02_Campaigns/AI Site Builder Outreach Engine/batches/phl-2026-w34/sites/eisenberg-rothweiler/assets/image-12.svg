<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 12 for eisenberg-rothweiler</title>
  <defs>
    <linearGradient id="g12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 15%)"/>
      <stop offset=".45" stop-color="hsl(177 58% 42%)"/>
      <stop offset="1" stop-color="hsl(49 28% 92%)"/>
    </linearGradient>
    <radialGradient id="r12" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(189 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 15%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(189 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <style>
      .float { animation: float 9.05s ease-in-out infinite alternate; }
      .spin { animation: spin 8.00s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 9.05s ease-in-out infinite alternate; }
      .sheen { animation: sheen 12.05s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(20px, -24px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(49 28% 92%)"/>
  <rect width="1600" height="1000" fill="url(#g12)" opacity=".88"/>
  <ellipse class="float" cx="507" cy="371" rx="283" ry="122" fill="url(#r12)" filter="url(#f12)" opacity=".85"/>
  <ellipse class="pulse" cx="1056" cy="598" rx="162" ry="103" fill="hsl(189 62% 52%)" opacity=".35" filter="url(#f12)"/>
