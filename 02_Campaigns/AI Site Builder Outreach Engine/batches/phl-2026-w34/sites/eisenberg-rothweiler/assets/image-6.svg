<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 6 for eisenberg-rothweiler</title>
  <defs>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 14%)"/>
      <stop offset=".45" stop-color="hsl(168 58% 44%)"/>
      <stop offset="1" stop-color="hsl(42 28% 90%)"/>
    </linearGradient>
    <radialGradient id="r6" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(180 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 14%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(180 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <style>
      .float { animation: float 7.00s ease-in-out infinite alternate; }
      .spin { animation: spin 8.00s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 7.00s ease-in-out infinite alternate; }
      .sheen { animation: sheen 10s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(14px, -18px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(42 28% 90%)"/>
  <rect width="1600" height="1000" fill="url(#g6)" opacity=".88"/>
  <ellipse class="float" cx="550" cy="266" rx="268" ry="109" fill="url(#r6)" filter="url(#f6)" opacity=".85"/>
  <ellipse class="pulse" cx="1118" cy="604" rx="149" ry="88" fill="hsl(180 62% 52%)" opacity=".35" filter="url(#f6)"/>
  <circle class="float" cx="546" cy="354" r="88" fill="hsl(32 78% 54%)" opacity=".28"/>
  <circle class="pulse" cx="1214" cy="162" r="34" fill="hsl(168 58% 44%)" opacity=".22"/>
  <g class="spin" opacity=".22">
    <path d="M40 28h80v12H40zm12 12h56v72H52zM36 112h88v12H36z" fill="hsl(168 58% 44%)" transform="translate(720 380) scale(4.2)"/>
  </g>
  <g class="float" opacity=".9">
    <path d="M40 28h80v12H40zm12 12h56v72H52zM36 112h88v12H36z" fill="hsl(42 28% 90%)" stroke="hsl(168 58% 44%)" stroke-width="4" transform="translate(696 248) scale(3.4)"/>
  </g>
  <rect x="120" y="90" width="1360" height="820" fill="url(#glass6)" rx="48" opacity=".55"/>
  <rect class="sheen" x="120" y="90" width="220" height="820" fill="#fff" opacity=".12" rx="48"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="hsl(180 62% 52%)" stroke-opacity=".35" stroke-width="2" rx="42"/>
</svg>
