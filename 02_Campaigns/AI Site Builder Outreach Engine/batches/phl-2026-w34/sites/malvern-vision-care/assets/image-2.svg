<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 2 for malvern-vision-care</title>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 11%)"/>
      <stop offset=".45" stop-color="hsl(175 58% 40%)"/>
      <stop offset="1" stop-color="hsl(47 28% 90%)"/>
    </linearGradient>
    <radialGradient id="r2" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(187 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 11%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(187 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <style>
      .float { animation: float 8.35s ease-in-out infinite alternate; }
      .spin { animation: spin 8.80s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 8.35s ease-in-out infinite alternate; }
      .sheen { animation: sheen 11.35s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(10px, -14px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(47 28% 90%)"/>
  <rect width="1600" height="1000" fill="url(#g2)" opacity=".88"/>
  <ellipse class="float" cx="467" cy="275" rx="273" ry="79" fill="url(#r2)" filter="url(#f2)" opacity=".85"/>
  <ellipse class="pulse" cx="1026" cy="528" rx="119" ry="93" fill="hsl(187 62% 52%)" opacity=".35" filter="url(#f2)"/>
  <circle class="float" cx="382" cy="238" r="56" fill="hsl(27 78% 54%)" opacity=".28"/>
  <circle class="pulse" cx="1138" cy="234" r="40" fill="hsl(175 58% 40%)" opacity=".22"/>
  <g class="spin" opacity=".22">
    <path d="M80 30a42 42 0 1 1 0 84 42 42 0 1 1 0-84zm0 14a28 28 0 1 0 0 56 28 28 0 1 0 0-56z" fill="hsl(175 58% 40%)" transform="translate(720 380) scale(4.2)"/>
  </g>
  <g class="float" opacity=".9">
    <path d="M80 30a42 42 0 1 1 0 84 42 42 0 1 1 0-84zm0 14a28 28 0 1 0 0 56 28 28 0 1 0 0-56z" fill="hsl(47 28% 90%)" stroke="hsl(175 58% 40%)" stroke-width="4" transform="translate(552 276) scale(3.4)"/>
  </g>
  <rect x="120" y="90" width="1360" height="820" fill="url(#glass2)" rx="48" opacity=".55"/>
  <rect class="sheen" x="120" y="90" width="220" height="820" fill="#fff" opacity=".12" rx="48"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="hsl(187 62% 52%)" stroke-opacity=".35" stroke-width="2" rx="42"/>
</svg>
