<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 2 for county-line-veterinary-hospital</title>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 10%)"/>
      <stop offset=".45" stop-color="hsl(176 58% 40%)"/>
      <stop offset="1" stop-color="hsl(44 28% 90%)"/>
    </linearGradient>
    <radialGradient id="r2" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(188 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 10%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(188 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f2" x="-20%" y="-20%" width="140%" height="140%">
