<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 8 for verruni-landscaping</title>
  <defs>
    <linearGradient id="g8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 12%)"/>
      <stop offset=".45" stop-color="hsl(172 58% 38%)"/>
      <stop offset="1" stop-color="hsl(46 28% 92%)"/>
    </linearGradient>
    <radialGradient id="r8" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(184 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 12%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(184 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <style>
      .float { animation: float 9.00s ease-in-out infinite alternate; }
      .spin { animation: spin 8.80s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 9.00s ease-in-out infinite alternate; }
      .sheen { animation: sheen 12s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(16px, -20px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(46 28% 92%)"/>
  <rect width="1600" height="1000" fill="url(#g8)" opacity=".88"/>
  <ellipse class="float" cx="456" cy="175" rx="280" ry="80" fill="url(#r8)" filter="url(#f8)" opacity=".85"/>
  <ellipse class="pulse" cx="1164" cy="522" rx="120" ry="100" fill="hsl(184 62% 52%)" opacity=".35" filter="url(#f8)"/>
  <circle class="float" cx="628" cy="412" r="48" fill="hsl(24 78% 54%)" opacity=".28"/>
  <circle class="pulse" cx="1252" cy="236" r="46" fill="hsl(172 58% 38%)" opacity=".22"/>
  <g class="spin" opacity=".22">
    <path d="M80 16c36 22 48 54 28 88-28 8-52-10-60-40 22-8 40-22 32-48z" fill="hsl(172 58% 38%)" transform="translate(720 380) scale(4.2)"/>
  </g>
  <g class="float" opacity=".9">
    <path d="M80 16c36 22 48 54 28 88-28 8-52-10-60-40 22-8 40-22 32-48z" fill="hsl(46 28% 92%)" stroke="hsl(172 58% 38%)" stroke-width="4" transform="translate(516 304) scale(3.4)"/>
  </g>
  <rect x="120" y="90" width="1360" height="820" fill="url(#glass8)" rx="48" opacity=".55"/>
  <rect class="sheen" x="120" y="90" width="220" height="820" fill="#fff" opacity=".12" rx="48"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="hsl(184 62% 52%)" stroke-opacity=".35" stroke-width="2" rx="42"/>
</svg>
