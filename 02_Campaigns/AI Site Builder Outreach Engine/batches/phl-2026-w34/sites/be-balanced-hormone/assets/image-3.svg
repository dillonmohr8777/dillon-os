<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <title>Animated Align-teal illustration 3 for be-balanced-hormone</title>
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(214 48% 10%)"/>
      <stop offset=".45" stop-color="hsl(166 58% 41%)"/>
      <stop offset="1" stop-color="hsl(46 28% 89%)"/>
    </linearGradient>
    <radialGradient id="r3" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="hsl(178 62% 52%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(214 48% 10%)" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="glass3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="hsl(178 62% 52%)" stop-opacity=".05"/>
    </linearGradient>
    <filter id="f3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <style>
      .float { animation: float 9.00s ease-in-out infinite alternate; }
      .spin { animation: spin 9.20s linear infinite; transform-origin: 800px 500px; }
      .pulse { animation: pulse 9.00s ease-in-out infinite alternate; }
      .sheen { animation: sheen 12s ease-in-out infinite; }
      @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(11px, -15px) scale(1.04); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { from { opacity:.55; } to { opacity:.95; } }
      @keyframes sheen { from { transform: translateX(-12%); opacity:.15; } to { transform: translateX(18%); opacity:.4; } }
      @media (prefers-reduced-motion: reduce) {
        .float,.spin,.pulse,.sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="hsl(46 28% 89%)"/>
  <rect width="1600" height="1000" fill="url(#g3)" opacity=".88"/>
  <ellipse class="float" cx="519" cy="406" rx="288" ry="158" fill="url(#r3)" filter="url(#f3)" opacity=".85"/>
  <ellipse class="pulse" cx="1049" cy="547" rx="198" ry="108" fill="hsl(178 62% 52%)" opacity=".35" filter="url(#f3)"/>
  <circle class="float" cx="423" cy="267" r="64" fill="hsl(32 78% 54%)" opacity=".28"/>
