    <g id="pa-ic-base" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <!-- HVAC and trades -->
  <symbol id="ic-furnace" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 8c-2 2-2 4 0 5 1.5-1 1.5-2.5 0-5zM9 17h6"/></g></symbol>
