<!-- The Juice Merchant, cold-pressed juice and smoothie bar, Narberth.
     Concept: a hydraulic press plate coming down on a stack of citrus halves, a
     tall glass filling from the spout, orange and leaf cross-sections drifting.
     Leaf green, citrus orange, cream. Motion: plate presses, glass fills in a
     loop, citrus wheel turns, leaves drift. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="pa-hero pa-hero-juice" role="img" aria-label="Cold-pressed juice being pressed and poured">
  <style>
    .pa-hero-juice .plate{animation:ju-press 6s ease-in-out infinite}
    .pa-hero-juice .fill{transform-origin:640px 500px;animation:ju-fill 6s ease-in-out infinite}
    .pa-hero-juice .stream{animation:ju-stream 6s ease-in-out infinite}
    .pa-hero-juice .wheel{transform-origin:170px 150px;animation:ju-turn 30s linear infinite}
    .pa-hero-juice .leaf{animation:ju-drift 7s ease-in-out infinite}.pa-hero-juice .leaf.b{animation-delay:-3.5s}
    @keyframes ju-press{0%,20%{transform:translateY(0)}45%,70%{transform:translateY(46px)}95%,100%{transform:translateY(0)}}
    @keyframes ju-fill{0%,25%{transform:scaleY(.08)}75%,100%{transform:scaleY(1)}}
    @keyframes ju-stream{0%,25%{opacity:0}35%,70%{opacity:1}80%,100%{opacity:0}}
    @keyframes ju-turn{to{transform:rotate(360deg)}}
    @keyframes ju-drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(12px,-18px) rotate(12deg)}}
    @media (prefers-reduced-motion:reduce){.pa-hero-juice *{animation:none!important}.pa-hero-juice .fill{transform:scaleY(.8)}.pa-hero-juice .stream{opacity:0}}
  </style>
  <rect width="900" height="600" fill="var(--paper)"/>
  <circle cx="450" cy="300" r="320" fill="url(#pa-glow)"/>
  <!-- citrus wheel -->
  <g class="wheel">
    <circle cx="170" cy="150" r="110" fill="var(--accent)"/>
    <circle cx="170" cy="150" r="92" fill="var(--paper)" opacity=".9"/>
    <circle cx="170" cy="150" r="84" fill="var(--accent)" opacity=".85"/>
    <g stroke="var(--paper)" stroke-width="5" stroke-linecap="round">
      <line x1="170" y1="70" x2="170" y2="230"/><line x1="90" y1="150" x2="250" y2="150"/><line x1="113" y1="93" x2="227" y2="207"/><line x1="227" y1="93" x2="113" y2="207"/>
    </g>
    <circle cx="170" cy="150" r="10" fill="var(--paper)"/>
  </g>
  <!-- leaves -->
  <g fill="var(--brand)">
    <path class="leaf a" d="M300,90 C340,40 400,50 420,90 C380,120 320,120 300,90 Z"/>
    <path class="leaf b" d="M760,420 C800,370 860,380 880,420 C840,450 780,450 760,420 Z"/>
  </g>
  <!-- press frame -->
  <g filter="url(#pa-plate)">
    <rect x="300" y="120" width="40" height="400" rx="8" fill="var(--brand-2)"/>
    <rect x="540" y="120" width="40" height="400" rx="8" fill="var(--brand-2)"/>
    <rect x="280" y="100" width="320" height="40" rx="10" fill="var(--brand-2)"/>
    <rect x="280" y="500" width="320" height="44" rx="10" fill="var(--brand-2)"/>
    <rect x="290" y="500" width="300" height="10" fill="var(--accent)"/>
  </g>
  <!-- plate and ram -->
  <g class="plate">
    <rect x="420" y="140" width="40" height="120" fill="var(--brand)"/>
    <rect x="340" y="250" width="200" height="30" rx="6" fill="var(--brand)"/>
  </g>
  <!-- fruit stack -->
  <g>
    <ellipse cx="440" cy="470" rx="90" ry="28" fill="var(--accent)"/>
    <ellipse cx="440" cy="440" rx="84" ry="26" fill="var(--paper)" opacity=".85"/>
    <ellipse cx="440" cy="412" rx="80" ry="24" fill="var(--accent)"/>
    <ellipse cx="440" cy="386" rx="74" ry="22" fill="var(--paper)" opacity=".85"/>
    <ellipse cx="440" cy="362" rx="70" ry="20" fill="var(--accent)"/>
  </g>
  <!-- spout and stream -->
  <path d="M560,486 L610,486 L610,500" fill="none" stroke="var(--brand-2)" stroke-width="10" stroke-linecap="round"/>
  <line class="stream" x1="610" y1="500" x2="610" y2="470" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" transform="translate(30,60)"/>
  <!-- glass -->
  <g transform="translate(600,0)">
    <path d="M10,300 L70,300 L64,500 L16,500 Z" fill="var(--paper)" stroke="var(--brand-2)" stroke-width="6" stroke-linejoin="round"/>
    <path class="fill" d="M18,306 L62,306 L58,494 L22,494 Z" fill="var(--accent)" opacity=".9"/>
    <rect x="30" y="320" width="8" height="120" rx="4" fill="var(--paper)" opacity=".5"/>
  </g>
  <rect width="900" height="600" fill="var(--brand-2)" filter="url(#pa-grain)" opacity=".2" style="mix-blend-mode:multiply"/>
</svg>
