<!-- Advance Exterior Solutions, roofing and exteriors, Macungie.
     Concept: a gable roofline in cross-section with shingle courses laid up, a
     rain cloud sliding off to the left as the sun comes on at the right, a
     gutter run and downspout. Slate, charcoal, copper. Motion: rain falls and
     thins, cloud drifts out, sun rays turn, one shingle course "lays" in a loop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="pa-hero pa-hero-advance" role="img" aria-label="A roof weathering the storm as the sun returns">
  <style>
    .pa-hero-advance .cloud{animation:ad-drift 12s ease-in-out infinite}
    .pa-hero-advance .rain{stroke-dasharray:14 26;animation:ad-rain 1.1s linear infinite}
    .pa-hero-advance .rays{transform-origin:760px 130px;animation:ad-turn 70s linear infinite}
    .pa-hero-advance .course{animation:ad-lay 6s ease-in-out infinite}
    @keyframes ad-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-70px)}}
    @keyframes ad-rain{to{stroke-dashoffset:-40}}
    @keyframes ad-turn{to{transform:rotate(360deg)}}
    @keyframes ad-lay{0%,15%{transform:translateX(-40px);opacity:0}35%,100%{transform:translateX(0);opacity:1}}
    @media (prefers-reduced-motion:reduce){.pa-hero-advance *{animation:none!important}.pa-hero-advance .course{opacity:1}}
  </style>
  <rect width="900" height="600" fill="url(#pa-wash)"/>
  <!-- sun -->
  <g class="rays" fill="var(--accent)" opacity=".35">
    <path d="M760,130 L900,40 L900,110 Z"/><path d="M760,130 L900,190 L900,260 Z"/><path d="M760,130 L700,0 L800,0 Z"/><path d="M760,130 L880,360 L820,400 Z"/>
  </g>
  <circle cx="760" cy="130" r="70" fill="var(--accent)"/>
  <!-- cloud and rain -->
  <g class="cloud">
    <g fill="var(--paper)" opacity=".92">
      <ellipse cx="200" cy="130" rx="120" ry="60"/><circle cx="130" cy="150" r="60"/><circle cx="270" cy="140" r="70"/><circle cx="210" cy="90" r="64"/>
    </g>
    <g class="rain" stroke="var(--paper)" stroke-width="4" stroke-linecap="round" opacity=".7">
      <line x1="120" y1="210" x2="100" y2="300"/><line x1="170" y1="215" x2="150" y2="305"/><line x1="220" y1="212" x2="200" y2="302"/><line x1="270" y1="218" x2="250" y2="308"/><line x1="320" y1="210" x2="300" y2="300"/>
    </g>
  </g>
  <!-- house body -->
  <rect x="180" y="360" width="540" height="200" fill="var(--paper)" opacity=".92"/>
  <rect x="180" y="360" width="540" height="200" fill="url(#pa-hatch)" style="color:var(--brand-2)" opacity=".35"/>
  <!-- roof deck and shingle courses -->
  <g filter="url(#pa-plate)">
    <polygon points="150,370 450,190 750,370" fill="var(--brand-2)"/>
    <g fill="var(--ink)">
      <polygon points="180,352 450,190 720,352 450,214"/>
    </g>
    <g fill="var(--paper)" opacity=".85">
      <polygon points="214,330 450,214 686,330 450,236"/>
      <polygon points="248,312 450,236 652,312 450,258"/>
      <polygon points="282,294 450,258 618,294 450,280"/>
    </g>
    <g class="course" fill="var(--accent)">
      <polygon points="316,276 450,280 584,276 450,302"/>
    </g>
    <line x1="450" y1="190" x2="450" y2="370" stroke="var(--paper)" stroke-width="2" opacity=".35"/>
    <!-- ridge cap -->
    <path d="M436,196 L450,184 L464,196" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- fascia, gutter, downspout -->
  <rect x="150" y="366" width="600" height="14" fill="var(--accent)"/>
  <rect x="150" y="380" width="600" height="8" fill="var(--brand-2)"/>
  <rect x="140" y="380" width="14" height="180" rx="4" fill="var(--accent)"/>
  <path d="M140,540 L110,560" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"/>
  <!-- window and door -->
  <rect x="250" y="410" width="90" height="80" rx="4" fill="var(--brand)"/>
  <rect x="260" y="420" width="70" height="60" fill="var(--paper)" opacity=".7"/>
  <rect x="560" y="410" width="90" height="80" rx="4" fill="var(--brand)"/>
  <rect x="570" y="420" width="70" height="60" fill="var(--paper)" opacity=".7"/>
  <rect x="410" y="420" width="80" height="140" rx="4" fill="var(--brand-2)"/>
  <circle cx="478" cy="492" r="5" fill="var(--accent)"/>
  <rect width="900" height="600" fill="var(--brand-2)" filter="url(#pa-grain)" opacity=".38" style="mix-blend-mode:multiply"/>
</svg>
