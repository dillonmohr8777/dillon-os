<!-- Sangillo's Tire Center, family tire shop in Folsom, 60 years. Brand purple.
     Concept: one oversized wheel cropped off the right edge with real spoke
     geometry and a tread ring, a tread-print road sweeping under it, a lug wrench
     crossed in the foreground. Motion: wheel turns, tread prints scroll, a torque
     flash pulses on the lug. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="pa-hero pa-hero-sangillo" role="img" aria-label="A wheel and tread on the road">
  <style>
    .pa-hero-sangillo .wheel{transform-origin:660px 330px;animation:sa-turn 14s linear infinite}
    .pa-hero-sangillo .prints{animation:sa-scroll 3s linear infinite}
    .pa-hero-sangillo .flash{animation:sa-pulse 2.8s ease-in-out infinite}
    @keyframes sa-turn{to{transform:rotate(360deg)}}
    @keyframes sa-scroll{from{transform:translateX(0)}to{transform:translateX(-120px)}}
    @keyframes sa-pulse{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.pa-hero-sangillo *{animation:none!important}.pa-hero-sangillo .flash{opacity:.6}}
  </style>
  <rect width="900" height="600" fill="var(--brand-2)"/>
  <rect width="900" height="600" fill="url(#pa-dots)" style="color:var(--paper)" opacity=".5"/>
  <!-- road band -->
  <path d="M0,470 L900,410 L900,600 L0,600 Z" fill="var(--ink)"/>
  <g class="prints" fill="var(--paper)" opacity=".25">
    <g transform="translate(0,486) skewY(-3.8)">
      <rect x="0" y="0" width="60" height="14" rx="3"/><rect x="120" y="0" width="60" height="14" rx="3"/><rect x="240" y="0" width="60" height="14" rx="3"/><rect x="360" y="0" width="60" height="14" rx="3"/><rect x="480" y="0" width="60" height="14" rx="3"/><rect x="600" y="0" width="60" height="14" rx="3"/><rect x="720" y="0" width="60" height="14" rx="3"/><rect x="840" y="0" width="60" height="14" rx="3"/><rect x="960" y="0" width="60" height="14" rx="3"/>
      <rect x="60" y="30" width="60" height="14" rx="3"/><rect x="180" y="30" width="60" height="14" rx="3"/><rect x="300" y="30" width="60" height="14" rx="3"/><rect x="420" y="30" width="60" height="14" rx="3"/><rect x="540" y="30" width="60" height="14" rx="3"/><rect x="660" y="30" width="60" height="14" rx="3"/><rect x="780" y="30" width="60" height="14" rx="3"/><rect x="900" y="30" width="60" height="14" rx="3"/><rect x="1020" y="30" width="60" height="14" rx="3"/>
    </g>
  </g>
  <!-- wheel -->
  <g class="wheel">
    <circle cx="660" cy="330" r="250" fill="var(--ink)"/>
    <circle cx="660" cy="330" r="250" fill="none" stroke="var(--paper)" stroke-width="22" stroke-dasharray="22 16" opacity=".9"/>
    <circle cx="660" cy="330" r="206" fill="none" stroke="var(--brand)" stroke-width="10" opacity=".6"/>
    <circle cx="660" cy="330" r="150" fill="var(--brand)"/>
    <g stroke="var(--paper)" stroke-width="26" stroke-linecap="round">
      <line x1="660" y1="330" x2="660" y2="196"/><line x1="660" y1="330" x2="787" y2="289"/><line x1="660" y1="330" x2="739" y2="438"/><line x1="660" y1="330" x2="581" y2="438"/><line x1="660" y1="330" x2="533" y2="289"/>
    </g>
    <circle cx="660" cy="330" r="46" fill="var(--paper)"/>
    <g fill="var(--brand-2)"><circle cx="660" cy="300" r="7"/><circle cx="688" cy="321" r="7"/><circle cx="677" cy="354" r="7"/><circle cx="643" cy="354" r="7"/><circle cx="632" cy="321" r="7"/></g>
    <circle cx="660" cy="330" r="12" fill="var(--accent)"/>
  </g>
  <!-- lug wrench -->
  <g filter="url(#pa-plate)" transform="translate(120,300) rotate(-28)">
    <rect x="0" y="-14" width="300" height="28" rx="14" fill="var(--paper)"/>
    <rect x="136" y="-150" width="28" height="300" rx="14" fill="var(--paper)"/>
    <g fill="var(--brand)"><circle cx="0" cy="0" r="22"/><circle cx="300" cy="0" r="22"/><circle cx="150" cy="-150" r="22"/><circle cx="150" cy="150" r="22"/></g>
    <g fill="var(--brand-2)"><circle cx="0" cy="0" r="9"/><circle cx="300" cy="0" r="9"/><circle cx="150" cy="-150" r="9"/><circle cx="150" cy="150" r="9"/></g>
  </g>
  <g class="flash" style="transform-origin:384px 168px">
    <polygon points="384,120 396,158 434,168 396,178 384,216 372,178 334,168 372,158" fill="var(--accent)"/>
  </g>
  <rect width="900" height="600" fill="var(--brand-2)" filter="url(#pa-grain)" opacity=".4" style="mix-blend-mode:multiply"/>
</svg>
