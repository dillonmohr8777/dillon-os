<!-- "Since YEAR" seal. Builder replaces the two text spans. Only use when the year
     is a sourced fact; otherwise omit the seal entirely. Rotates slowly; reduced
     motion stops it. Colors: ring and text in var(dash dash accent), disc in var(dash dash brand-2). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="pa-seal" width="120" height="120" role="img" aria-label="Established SEAL_YEAR">
  <style>
    .pa-seal .ring{animation:pa-spin 24s linear infinite;transform-origin:60px 60px}
    @media (prefers-reduced-motion:reduce){.pa-seal .ring{animation:none}}
    @keyframes pa-spin{to{transform:rotate(360deg)}}
  </style>
  <circle cx="60" cy="60" r="58" fill="var(--brand-2)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 4"/>
  <g class="ring">
    <text font-family="var(--font-display)" font-size="11" font-weight="800" letter-spacing="2.6" fill="var(--accent)">
      <textPath href="#pa-seal-ring" startOffset="0">SEAL_RING_TEXT · SEAL_RING_TEXT ·</textPath>
    </text>
  </g>
  <text x="60" y="56" text-anchor="middle" font-family="var(--font-display)" font-size="9" font-weight="700" letter-spacing="3" fill="var(--paper)" opacity=".8">SINCE</text>
  <text x="60" y="78" text-anchor="middle" font-family="var(--font-display)" font-size="24" font-weight="900" fill="var(--paper)">SEAL_YEAR</text>
</svg>
