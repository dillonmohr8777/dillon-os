<!-- Nolt's Auto Parts, wholesale parts supplier to dealers and shops, Lancaster
     County, since 1959. Concept: a warehouse bin wall in perspective, a conveyor
     with three parts crates moving to a dock door, a hex bolt and brake rotor as
     hero objects. Graphite, safety orange. Motion: conveyor slats scroll, crates
     travel, rotor turns slowly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="pa-hero pa-hero-nolts" role="img" aria-label="Parts warehouse and delivery conveyor">
  <style>
    .pa-hero-nolts .slats{stroke-dasharray:18 14;animation:no-slats 1.4s linear infinite}
    .pa-hero-nolts .crates{animation:no-travel 9s linear infinite}
    .pa-hero-nolts .rotor{transform-origin:690px 250px;animation:no-turn 18s linear infinite}
    @keyframes no-slats{to{stroke-dashoffset:-32}}
    @keyframes no-travel{from{transform:translateX(-260px)}to{transform:translateX(620px)}}
    @keyframes no-turn{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.pa-hero-nolts *{animation:none!important}.pa-hero-nolts .crates{transform:translateX(120px)}}
  </style>
  <rect width="900" height="600" fill="var(--brand-2)"/>
  <!-- bin wall -->
  <g opacity=".9">
    <rect x="0" y="60" width="520" height="330" fill="var(--brand)"/>
    <g stroke="var(--brand-2)" stroke-width="6">
      <line x1="0" y1="140" x2="520" y2="140"/><line x1="0" y1="220" x2="520" y2="220"/><line x1="0" y1="300" x2="520" y2="300"/>
      <line x1="130" y1="60" x2="130" y2="390"/><line x1="260" y1="60" x2="260" y2="390"/><line x1="390" y1="60" x2="390" y2="390"/>
    </g>
    <g fill="var(--paper)" opacity=".85">
      <rect x="20" y="80" width="90" height="44" rx="3"/><rect x="150" y="80" width="90" height="44" rx="3"/><rect x="410" y="80" width="90" height="44" rx="3"/>
      <rect x="280" y="160" width="90" height="44" rx="3"/><rect x="20" y="160" width="90" height="44" rx="3"/><rect x="410" y="240" width="90" height="44" rx="3"/>
      <rect x="150" y="240" width="90" height="44" rx="3"/><rect x="280" y="320" width="90" height="44" rx="3"/><rect x="20" y="320" width="90" height="44" rx="3"/>
    </g>
    <g fill="var(--accent)"><rect x="24" y="112" width="40" height="6"/><rect x="154" y="112" width="40" height="6"/><rect x="284" y="192" width="40" height="6"/><rect x="414" y="272" width="40" height="6"/><rect x="24" y="352" width="40" height="6"/></g>
  </g>
  <!-- dock door -->
  <rect x="560" y="60" width="340" height="330" fill="var(--ink)"/>
  <rect x="590" y="90" width="280" height="270" fill="var(--paper)" opacity=".08"/>
  <g stroke="var(--paper)" stroke-width="2" opacity=".25"><line x1="590" y1="150" x2="870" y2="150"/><line x1="590" y1="210" x2="870" y2="210"/><line x1="590" y1="270" x2="870" y2="270"/><line x1="590" y1="330" x2="870" y2="330"/></g>
  <rect x="560" y="60" width="340" height="16" fill="var(--accent)"/>
  <!-- rotor -->
  <g class="rotor">
    <circle cx="690" cy="250" r="86" fill="var(--paper)"/>
    <circle cx="690" cy="250" r="86" fill="none" stroke="var(--brand-2)" stroke-width="10" stroke-dasharray="4 10" opacity=".5"/>
    <circle cx="690" cy="250" r="40" fill="var(--brand-2)"/>
    <g fill="var(--paper)"><circle cx="690" cy="222" r="6"/><circle cx="716" cy="241" r="6"/><circle cx="706" cy="272" r="6"/><circle cx="674" cy="272" r="6"/><circle cx="664" cy="241" r="6"/></g>
    <circle cx="690" cy="250" r="9" fill="var(--accent)"/>
  </g>
  <!-- conveyor -->
  <rect x="0" y="440" width="900" height="34" fill="var(--paper)"/>
  <line class="slats" x1="0" y1="457" x2="900" y2="457" stroke="var(--brand-2)" stroke-width="20"/>
  <g fill="var(--brand-2)"><circle cx="60" cy="500" r="18"/><circle cx="300" cy="500" r="18"/><circle cx="540" cy="500" r="18"/><circle cx="800" cy="500" r="18"/></g>
  <g class="crates">
    <g transform="translate(0,372)">
      <rect x="0" y="0" width="120" height="68" rx="4" fill="var(--accent)"/><rect x="12" y="14" width="60" height="8" fill="var(--brand-2)" opacity=".6"/><rect x="12" y="30" width="96" height="8" fill="var(--brand-2)" opacity=".35"/>
      <rect x="160" y="10" width="100" height="58" rx="4" fill="var(--paper)"/><rect x="172" y="24" width="50" height="8" fill="var(--brand-2)" opacity=".6"/>
    </g>
  </g>
  <!-- hex bolt foreground -->
  <g filter="url(#pa-plate)" transform="translate(120,470)">
    <polygon points="60,0 112,30 112,90 60,120 8,90 8,30" fill="var(--paper)"/>
    <polygon points="60,22 92,40 92,80 60,98 28,80 28,40" fill="var(--brand-2)"/>
    <circle cx="60" cy="60" r="10" fill="var(--accent)"/>
  </g>
  <rect width="900" height="600" fill="var(--brand-2)" filter="url(#pa-grain)" opacity=".4" style="mix-blend-mode:multiply"/>
</svg>
