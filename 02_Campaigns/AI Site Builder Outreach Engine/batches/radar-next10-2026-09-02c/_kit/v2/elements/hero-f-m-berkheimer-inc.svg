<!-- F M Berkheimer Inc, residential heating and cooling, Mechanicsburg, since 1950.
     Concept: a Cumberland County house at dusk with two air plumes, cool from the
     condenser outside, warm from the register inside, meeting at the thermostat.
     Motion: plumes drift, thermostat needle settles, window light breathes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="pa-hero pa-hero-berk" role="img" aria-label="A home kept comfortable in every season">
  <style>
    .pa-hero-berk .plume{animation:berk-drift 9s ease-in-out infinite}
    .pa-hero-berk .plume.b{animation-delay:-4.5s}
    .pa-hero-berk .needle{transform-origin:640px 168px;animation:berk-needle 7s ease-in-out infinite}
    .pa-hero-berk .win{animation:berk-breathe 5s ease-in-out infinite}
    @keyframes berk-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-14px)}}
    @keyframes berk-needle{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(22deg)}}
    @keyframes berk-breathe{0%,100%{opacity:.75}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.pa-hero-berk *{animation:none!important}}
  </style>
  <rect width="900" height="600" fill="url(#pa-wash)"/>
  <circle cx="700" cy="120" r="220" fill="url(#pa-glow)"/>
  <!-- ground -->
  <path d="M0,470 C180,440 320,500 520,468 C700,440 800,480 900,462 L900,600 L0,600 Z" fill="var(--brand-2)" opacity=".9"/>
  <!-- house -->
  <g filter="url(#pa-plate)">
    <polygon points="250,300 430,170 610,300" fill="var(--paper)"/>
    <rect x="280" y="298" width="300" height="180" fill="var(--paper)"/>
    <rect x="470" y="190" width="34" height="70" fill="var(--paper)"/>
    <rect x="280" y="298" width="300" height="180" fill="currentColor" opacity=".06"/>
    <rect class="win" x="312" y="330" width="70" height="60" rx="4" fill="var(--accent)"/>
    <rect class="win" x="480" y="330" width="70" height="60" rx="4" fill="var(--accent)" style="animation-delay:-2.5s"/>
    <rect x="400" y="380" width="60" height="98" rx="3" fill="var(--brand-2)"/>
    <circle cx="448" cy="432" r="4" fill="var(--accent)"/>
  </g>
  <!-- condenser -->
  <g>
    <rect x="640" y="404" width="96" height="74" rx="8" fill="var(--paper)" opacity=".95"/>
    <circle cx="688" cy="441" r="26" fill="none" stroke="var(--brand-2)" stroke-width="6"/>
    <g stroke="var(--brand-2)" stroke-width="3" opacity=".7">
      <line x1="652" y1="418" x2="724" y2="418"/><line x1="652" y1="466" x2="724" y2="466"/>
    </g>
  </g>
  <!-- cool plume from condenser -->
  <g class="plume a" fill="none" stroke="var(--paper)" stroke-width="10" stroke-linecap="round" opacity=".55">
    <path d="M700,398 C720,360 660,330 690,290 C716,254 672,224 700,190"/>
    <path d="M736,410 C760,372 704,346 732,306" opacity=".6"/>
  </g>
  <!-- warm plume from chimney -->
  <g class="plume b" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" opacity=".8">
    <path d="M487,186 C500,150 460,130 480,96 C498,64 466,42 486,12"/>
  </g>
  <!-- thermostat dial -->
  <g>
    <circle cx="640" cy="168" r="60" fill="var(--paper)" filter="url(#pa-plate)"/>
    <path d="M592,196 A56,56 0 0 1 688,196" fill="none" stroke="var(--brand)" stroke-width="10" stroke-linecap="round"/>
    <path d="M640,112 A56,56 0 0 1 688,196" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
    <line class="needle" x1="640" y1="168" x2="640" y2="126" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="640" cy="168" r="7" fill="var(--ink)"/>
  </g>
  <rect width="900" height="600" fill="var(--brand-2)" filter="url(#pa-grain)" opacity=".35" style="mix-blend-mode:multiply"/>
</svg>
