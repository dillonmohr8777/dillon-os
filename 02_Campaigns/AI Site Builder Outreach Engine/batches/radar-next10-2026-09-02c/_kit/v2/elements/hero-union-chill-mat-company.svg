<!-- Union Chill Mat Company, industrial heating and cooling equipment, since 1946.
     Concept: a riveted chiller casing in section view, a big axial fan, heat bands
     leaving the top, spec-sheet hatching behind. Heavy, precise, factory floor.
     Motion: fan spins, heat bands rise, pressure gauge needle flickers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="pa-hero pa-hero-union" role="img" aria-label="Industrial heating and cooling equipment">
  <style>
    .pa-hero-union .fan{transform-origin:330px 330px;animation:un-spin 6s linear infinite}
    .pa-hero-union .band{animation:un-rise 5s ease-in-out infinite}
    .pa-hero-union .band.b{animation-delay:-1.7s}.pa-hero-union .band.c{animation-delay:-3.4s}
    .pa-hero-union .gauge{transform-origin:690px 190px;animation:un-gauge 4s ease-in-out infinite}
    @keyframes un-spin{to{transform:rotate(360deg)}}
    @keyframes un-rise{0%{transform:translateY(0);opacity:0}30%{opacity:.85}100%{transform:translateY(-70px);opacity:0}}
    @keyframes un-gauge{0%,100%{transform:rotate(-30deg)}40%{transform:rotate(18deg)}60%{transform:rotate(12deg)}}
    @media (prefers-reduced-motion:reduce){.pa-hero-union *{animation:none!important}.pa-hero-union .band{opacity:.6}}
  </style>
  <rect width="900" height="600" fill="var(--brand-2)"/>
  <rect width="900" height="600" fill="url(#pa-hatch)" style="color:var(--paper)" opacity=".5"/>
  <!-- casing -->
  <g filter="url(#pa-plate)">
    <rect x="150" y="150" width="600" height="360" rx="14" fill="var(--brand)"/>
    <rect x="150" y="150" width="600" height="360" rx="14" fill="url(#pa-dots)" style="color:var(--paper)" opacity=".35"/>
    <rect x="176" y="176" width="548" height="308" rx="8" fill="none" stroke="var(--paper)" stroke-width="2" opacity=".5"/>
    <g fill="var(--paper)" opacity=".7">
      <circle cx="166" cy="166" r="5"/><circle cx="734" cy="166" r="5"/><circle cx="166" cy="494" r="5"/><circle cx="734" cy="494" r="5"/>
      <circle cx="450" cy="166" r="5"/><circle cx="450" cy="494" r="5"/><circle cx="166" cy="330" r="5"/><circle cx="734" cy="330" r="5"/>
    </g>
  </g>
  <!-- fan housing -->
  <circle cx="330" cy="330" r="118" fill="var(--brand-2)"/>
  <circle cx="330" cy="330" r="118" fill="none" stroke="var(--paper)" stroke-width="8" opacity=".9"/>
  <g class="fan" fill="var(--paper)" opacity=".95">
    <path d="M330,330 C300,270 250,250 240,250 C260,300 300,320 330,330 Z"/>
    <path d="M330,330 C390,300 410,250 410,240 C360,260 340,300 330,330 Z"/>
    <path d="M330,330 C360,390 410,410 420,410 C400,360 360,340 330,330 Z"/>
    <path d="M330,330 C270,360 250,410 250,420 C300,400 320,360 330,330 Z"/>
    <circle cx="330" cy="330" r="16" fill="var(--accent)"/>
  </g>
  <!-- grille lines -->
  <g stroke="var(--paper)" stroke-width="3" opacity=".8">
    <line x1="500" y1="230" x2="700" y2="230"/><line x1="500" y1="262" x2="700" y2="262"/>
    <line x1="500" y1="294" x2="700" y2="294"/><line x1="500" y1="326" x2="700" y2="326"/>
    <line x1="500" y1="358" x2="700" y2="358"/><line x1="500" y1="390" x2="700" y2="390"/>
  </g>
  <!-- gauge -->
  <circle cx="690" cy="190" r="36" fill="var(--paper)"/>
  <path d="M662,206 A34,34 0 0 1 718,206" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
  <line class="gauge" x1="690" y1="190" x2="690" y2="164" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="690" cy="190" r="5" fill="var(--ink)"/>
  <!-- heat bands leaving the top -->
  <g fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round">
    <path class="band a" d="M560,150 C576,124 544,108 560,84"/>
    <path class="band b" d="M610,150 C626,124 594,108 610,84"/>
    <path class="band c" d="M660,150 C676,124 644,108 660,84"/>
  </g>
  <!-- nameplate -->
  <rect x="560" y="430" width="150" height="44" rx="4" fill="var(--paper)"/>
  <rect x="572" y="442" width="90" height="6" rx="3" fill="var(--brand-2)" opacity=".7"/>
  <rect x="572" y="456" width="126" height="6" rx="3" fill="var(--brand-2)" opacity=".4"/>
  <rect width="900" height="600" fill="var(--brand-2)" filter="url(#pa-grain)" opacity=".4" style="mix-blend-mode:multiply"/>
</svg>
