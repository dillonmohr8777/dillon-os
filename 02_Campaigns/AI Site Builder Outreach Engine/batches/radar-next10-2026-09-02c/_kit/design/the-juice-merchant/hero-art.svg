<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      @keyframes jc-rise{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-90px);opacity:0}}
      @keyframes jc-press{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
      @keyframes jc-fill{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1)}}
      @keyframes jc-spin{to{transform:rotate(360deg)}}
      .jc-leaf{animation:jc-rise 5s ease-in infinite}
      .jc-leaf2{animation:jc-rise 6.5s ease-in infinite 1.5s}
      .jc-press{animation:jc-press 3.2s ease-in-out infinite;transform-origin:660px 300px}
      .jc-fill{animation:jc-fill 3.2s ease-in-out infinite;transform-origin:660px 460px}
      .jc-wheel{animation:jc-spin 30s linear infinite;transform-origin:210px 320px}
    }
  </style>
  <defs><radialGradient id="jc-bg" cx="30%" cy="20%" r="90%">
    <stop offset="0" stop-color="#faf7ec"/><stop offset="1" stop-color="#4f7a23" stop-opacity=".15"/>
  </radialGradient></defs>
  <rect width="900" height="600" fill="url(#jc-bg)"/>
  <g class="jc-wheel" fill="none" stroke="#e2792e" stroke-width="5">
    <circle cx="210" cy="320" r="110"/>
    <circle cx="210" cy="320" r="34" fill="#e2792e" fill-opacity=".18"/>
    <path d="M210 210v220M100 320h220M138 248l144 144M282 248 138 392"/>
  </g>
  <g fill="none" stroke="#4f7a23" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="150" r="46"/>
    <path d="M120 104v92M74 150h92M90 120l60 60M150 120l-60 60"/>
  </g>
  <g class="jc-leaf" fill="#4f7a23" opacity=".55"><path d="M600 190c26 8 40 26 40 48-24 4-44-8-52-30-3-8-2-14 12-18z"/></g>
  <g class="jc-leaf2" fill="#e2792e" opacity=".5"><path d="M640 150c22 10 32 28 28 50-24 0-40-14-46-36-2-8 0-14 18-14z"/></g>
  <g class="jc-press" fill="none" stroke="#1b2011" stroke-width="6" stroke-linecap="round">
    <rect x="610" y="220" width="100" height="18" rx="4" fill="#1b2011" opacity=".85" stroke="none"/>
    <line x1="660" y1="238" x2="660" y2="300" stroke-width="10"/>
  </g>
  <rect x="630" y="300" width="60" height="30" rx="4" fill="#182410"/>
  <g class="jc-fill">
    <rect x="636" y="330" width="48" height="130" fill="#e2792e" fill-opacity=".55"/>
  </g>
  <rect x="628" y="330" width="64" height="140" rx="6" fill="none" stroke="#1b2011" stroke-width="5"/>
</svg>
