<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      @keyframes wm-drive{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
      @keyframes wm-rise{0%,100%{opacity:.45}50%{opacity:.9}}
      @keyframes wm-line{0%{stroke-dashoffset:120}100%{stroke-dashoffset:0}}
      .wm-car{animation:wm-drive 8s ease-in-out infinite alternate}
      .wm-sun{animation:wm-rise 5s ease-in-out infinite}
      .wm-lane{stroke-dasharray:24 18;animation:wm-line 2.2s linear infinite}
    }
  </style>
  <defs><linearGradient id="wm-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f3e9"/><stop offset="1" stop-color="#1c3a5e" stop-opacity=".2"/>
  </linearGradient></defs>
  <rect width="900" height="600" fill="url(#wm-sky)"/>
  <g class="wm-sun"><circle cx="700" cy="150" r="70" fill="#b3312c" opacity=".18"/></g>
  <path d="M0 430 C 220 380, 680 380, 900 430 L900 460 C 680 410, 220 410, 0 460 Z" fill="#0d1f33" opacity=".9"/>
  <g class="wm-lane" stroke="#f7f3e9" stroke-width="8" fill="none">
    <path d="M0 470 L900 470"/>
  </g>
  <g class="wm-car" transform="translate(420,330)">
    <path d="M-140 60 L-120 20 L-70 -10 L60 -10 L110 20 L140 60 Z" fill="#1c3a5e" stroke="#14212c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-60 -10 L-40 -40 L40 -40 L60 -10Z" fill="#1c3a5e" stroke="#14212c" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-90" cy="62" r="26" fill="#14212c"/>
    <circle cx="90" cy="62" r="26" fill="#14212c"/>
    <circle cx="-90" cy="62" r="10" fill="#f7f3e9"/>
    <circle cx="90" cy="62" r="10" fill="#f7f3e9"/>
    <rect x="-130" y="10" width="16" height="10" fill="#b3312c"/>
  </g>
  <g fill="none" stroke="#14212c" stroke-width="3" opacity=".6">
    <path d="M120 260 l40-16 40 16 40-16 40 16 40-16 40 16 40-16 40 16 40-16 40 16" />
  </g>
  <polygon points="780,120 795,150 828,153 804,175 811,208 780,192 749,208 756,175 732,153 765,150" fill="#b3312c" opacity=".75"/>
</svg>
