  </g>
  <g class="np-hex" fill="none" stroke="#a8420f" stroke-width="6" stroke-linejoin="round">
    <path d="M730 410 l38 22 v44 l-38 22 -38-22 v-44 z"/>
    <circle cx="730" cy="460" r="16"/>
  </g>
  <g class="np-hex2" fill="none" stroke="#52565c" stroke-width="5" stroke-linejoin="round" opacity=".8">
    <path d="M170 108 l32 18 v36 l-32 18 -32-18 v-36 z"/>
  </g>
</svg>
