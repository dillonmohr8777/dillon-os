version: 1
cadence: daily

# Adding work = adding an entry here. No new routine, no new code.
# Schema and rules: ./README.md

jobs:
  # ---------------------------------------------------------------- heartbeat
  # Runs FIRST and deliberately reports on yesterday, because the failure this
  # whole system exists to fix is silence. daily-communications-brain went dark
  # 2026-09-07 through 09-11 and self-recovered with nobody noticing.
  - id: heartbeat
    title: Did yesterday actually happen
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file exists naming every job that was due yesterday and
      whether the ledger shows it ok, failed, skipped, or ABSENT. Absent is the
      loudest state and must be called out first.
    prompt: |
      Read _os/automation/cadence/run-ledger.jsonl and the three manifests in
      _os/automation/cadence/.

      Work out which jobs were DUE yesterday (daily jobs every weekday; weekly on
      Monday; monthly on the 1st). For each, find its most recent ledger entry.

      Classify every due job as:
        ok       - ledger entry, status ok, artifact path exists on disk
        failed   - ledger entry, status failed
        skipped  - enabled: false in its manifest
        ABSENT   - NO ledger entry at all. The driver never ran, or died partway.

      Write the report to the outputs dir as "<date> - cadence heartbeat.md".
      Lead with ABSENT, then failed. If everything is ok, say so in one line and
      stop - do not pad.

      Also check the artifact each ok job claims: if the ledger names a path that
      does not exist on disk, that is a FAILURE, not an ok. A ledger that lies is
      worse than no ledger.

  # ------------------------------------------------------------ approval queue
  - id: approval-queue-diff
    title: What changed in the approval queue
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file listing items added, closed, or newly overdue since
      the previous run, with the total open count.
    prompt: |
      Read C:/Users/dillo/repos/dillon-os/System/approval-queue.md.

      Compare against the previous run's report in the outputs dir (most recent
      dated file). Report:
        - items ADDED since then
        - items marked [x] since then
        - any item whose text contains a date more than 14 days old and is still
          unchecked - these are rotting, list them oldest first
        - total open count

      Write "<date> - approval queue diff.md". If this is the first run, say so
      and just report the current state and the rotting list.

      Do NOT check off, edit, reword, or reorder anything in approval-queue.md.
      This job is read-only against that file.

  # ------------------------------------------------------- untracked deliverables
  # Direct answer to the 2026-09-14 finding: 3,408 untracked files in
  # client-operations, 575 films with no tracked copy, Codex not a git repo.
  - id: unfiled-sweep
    title: Finished work sitting untracked
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file with the untracked count per repo and a named list of
      any NEW deliverable-shaped file that appeared since the last run.
    prompt: |
      For each of these repos, run `git status --porcelain` and count untracked
      entries:
        C:/Users/dillo/repos/dillon-os
        C:/Users/dillo/Documents/Codex/projects/client-operations

      Then list untracked files under any path containing "deliverables/" that
      look finished - .pdf, .mp4, .png, .html, or a README/DELIVERY markdown -
      and that did NOT appear in the previous run's report.

      Write "<date> - unfiled sweep.md". Lead with the counts, then the new
      arrivals. If a new arrival resolves to a client in
      C:/Users/dillo/Documents/Codex/projects/client-operations/registry/clients.json,
      say which one.

      Do NOT commit, stage, move, or delete anything. This job reports; a human
      decides. Committing 5.5 GB of unbacked media is exactly the wrong reflex -
      see the 2026-09-14 approval-queue entry on the backup destination.

  # ----------------------------------------------------------- lead triage
  # Jason Fallon's named bottleneck, from the 2026-09-16 team research:
  # nothing dedupes #360leads. Measured that day, 40 messages deep: every
  # Meta and audit lead double fires into HubSpot seconds later, and about
  # 30 percent of the channel is caller ID noise with no identity at all.
  - id: leads-triage
    title: What in 360leads was actually a lead
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file with counts by class (real, duplicate, noise)
      and a named list of only the real leads, each with contact details
      and source. A run that cannot reach Slack is a failure, not an empty
      report.
    prompt: |
      Read Slack channel #360leads (C05R2B1ULF6) for the last 24 hours.

      Classify every message into exactly one class:

        real      - a person with a name AND at least one of email or a
                    number that is not just caller ID. Keep the richest
                    copy when the same person appears more than once.
        duplicate - the same person already counted, matched on email, or
                    on phone with the last 10 digits equal, or on a close
                    name match within 10 minutes. "New Hubspot Lead /
                    Contact" firing seconds after a "New Meta Lead" or a
                    "SMALL BUSINESS SCHEDULE AUDIT CALL LEAD" for the same
                    person is the known pattern: the Meta or audit copy is
                    the one to keep, it carries campaign and qualifying
                    answers.
        noise     - caller ID only, no real person. Names that are a place
                    (Philadelphia Pa, Salinas Ca, Herkimer Ny), or Wireless
                    Caller, Toll Free Call, Na N/A, or a bare email in the
                    name field with nothing else.

      Write "<date> - lead triage.md" to the outputs dir:
        - one line of counts: real / duplicate / noise, and the duplicate
          and noise percentages
        - the real leads as a table: name, email, phone, business, source
        - a short list of which duplicate pairs fired, with both timestamps,
          so the Zap overlap stays visible until someone fixes it upstream

      Do NOT post to Slack, do NOT reply in the channel, do NOT touch
      HubSpot. This job reports; Jason and Sean decide.

  # ------------------------------------------------- Sean, operations mode
  # MOMENTUM-ORG-PLAN.md priority 2. Outcome: decision packets for blocked
  # production, capacity and scope. Proof: each packet has one decision,
  # current evidence, a responsible person, a deadline, and the effect of
  # delay. Service line: Copilots and Agents.
  - id: ops-decision-packets
    title: Blocked work, turned into one decision each
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file where every blocked item is a packet with
      exactly one decision to make, the current evidence, a named
      responsible person, a deadline, and what happens if it slips. An
      open ended summary is a failure, not a packet.
    prompt: |
      Read System/approval-queue.md and the last 3 days of Slack in
      #momentumsites, #outbound and #ghl-leads-apollo.

      Find work that is BLOCKED: waiting on a decision, a credit, a
      credential, a scope answer, or another person. Sean Boyle's named
      blockers as of 2026-09-16 were Apollo credits, thin production
      briefs, and Deborah Mara client confusion; treat those as examples
      of the shape, not a fixed list.

      For each, write one packet:
        DECISION      one sentence, answerable yes/no or A/B
        EVIDENCE      what is currently true, with a source path or a
                      Slack permalink
        RESPONSIBLE   the one named person who can decide it
        DEADLINE      a real date, or "no deadline stated" if none exists
        IF IT SLIPS   the concrete cost of waiting

      Write "<date> - ops decision packets.md". Order by cost of delay,
      highest first. If an item has no single decider, say so plainly:
      that is itself the finding.

      Do NOT decide anything. Do NOT message anyone. Packets only.

  # --------------------------------- Melissa Silber, marketing production
  # MOMENTUM-ORG-PLAN.md priority 4. Outcome: complete briefs and
  # dependency maps carried to the requested artifact count. Proof:
  # supplied answers are retained, only material missing inputs are asked,
  # every promised asset has a review link or a precise blocker.
  # Service line: Knowledge Engineering.
  - id: production-briefs
    title: Every promised asset has a link or a named blocker
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file listing every in flight production item with
      its requested asset count, how many exist, a review link for each
      that exists, and a precise named blocker for each that does not.
      "In progress" is not a blocker.
    prompt: |
      Read the last 7 days of Slack in #momentumsites and #outbound, plus
      02_Campaigns/ and 03_Content/ in this vault.

      For every piece of promised production work, record:
        ITEM          what was asked for, and by whom
        ASKED FOR     the requested count, if a count was named
        DELIVERED     how many exist, with a link or path for each
        BLOCKER       for anything missing: the exact thing it waits on
                      and who holds it. Never "in progress", never "TBD".

      Melissa Silber's standing problem is that press and website items
      stall with no owner, and a bot re asks questions she already
      answered. So: if an answer already exists anywhere in the thread or
      the vault, carry it forward and mark it ANSWERED rather than asking
      again. Only genuinely missing inputs get asked.

      Write "<date> - production briefs.md". Lead with the items that
      have a promised count and an unmet delivery.

      Do NOT post, do NOT ask anyone anything directly. Report only.

  # ------------------------------------ Melissa Rigby, client delivery
  # MOMENTUM-ORG-PLAN.md priority 5. Outcome: milestone review agendas and
  # specialist dependency packets. Proof: build completion, internal
  # review, client acceptance and delivery stay separate evidenced states.
  # Service line: Workflow Automation.
  - id: delivery-milestones
    title: Build, review, acceptance and delivery kept separate
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file with one row per active client deliverable and
      four SEPARATE state columns: built, internally reviewed, client
      accepted, delivered. Each state carries its own evidence or reads
      "no evidence". Collapsing any two states into one is a failure.
    prompt: |
      Read clients/*/deliverables/ under
      C:/Users/dillo/Documents/Codex/projects/client-operations and the
      last 7 days of the matching client Slack channels.

      For every active deliverable, resolve four states INDEPENDENTLY.
      A thing can be built and not reviewed, reviewed and not accepted,
      accepted and not delivered. Never infer one state from another:

        BUILT      the artifact exists on disk. Give the path.
        REVIEWED   someone internal signed off. Give who and where.
        ACCEPTED   the client said yes. Give the message or "no evidence".
        DELIVERED  it actually reached the client. Give the receipt.

      Resolve every client id against
      client-operations/registry/clients.json. An id that does not resolve
      is a failure for that row, not a guess.

      Write "<date> - delivery milestones.md". Lead with anything built
      but never delivered, that is finished work nobody received.

      Do NOT deliver anything. Do NOT message a client. Report only.

  # ------------------------------------------------- shared, the verifier
  # MOMENTUM-ORG-PLAN.md: "No agent can close its own work from a success
  # message alone." Runs LAST, checks the others. Service line: the trust
  # layer that makes the other three sellable.
  - id: agent-verifier
    title: Check what the other agents claimed today
    enabled: true
    outputs: 12_Brain/07_Reviews/Cadence
    accept: |
      A dated markdown file naming every agent that produced a report
      today, whether its claimed artifact actually exists on disk, and
      whether its accept sentence is genuinely met. A verifier that finds
      nothing wrong says so in one line, but it must have actually opened
      the files to say it.
    prompt: |
      Read _os/automation/cadence/run-ledger.jsonl and
      _os/automation/runs.jsonl for today, plus every file written to
      12_Brain/07_Reviews/Cadence/ today.

      For each agent that ran:
        EXISTS     does the artifact it named actually exist on disk?
        NONEMPTY   does it have real content, not a stub or a header only?
        MEETS      re read that job's accept sentence in its manifest.
                   Does the artifact actually satisfy it? Quote the line
                   that proves it, or state exactly what is missing.
        FRESH      is it dated today?

      A ledger entry claiming ok whose artifact is absent, empty, or does
      not meet its own accept gate is the single most important finding
      here. Lead with those. That failure mode, work that runs and
      produces nothing while reporting success, is the reason this whole
      cadence exists.

      Write "<date> - verifier.md".

      Do NOT fix anything. Do NOT rerun anything. Report only.
