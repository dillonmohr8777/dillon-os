<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url(data:font/woff2;base64,__FONT400__) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url(data:font/woff2;base64,__FONT600__) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(data:font/woff2;base64,__FONT700__) format('woff2'); }

  :root {
    --navy: #101E33;
    --navy-2: #16263F;
    --card-navy: #1B2E4B;
    --ink: #1B2A44;
    --body: #44506A;
    --muted: #8B95A9;
    --paper: #F7F4EF;
    --white: #FFFFFF;
    --accent: #F0812C;   /* per-client override */
    --accent-2: #5B9BD5; /* per-client override */
    --good: #2FB380;
    --bad: #E4574F;
    --warn: #E9A13B;
    --line: #E4DED4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #DDD; }
  body { font-family: 'Poppins', 'Segoe UI', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  @page { size: letter; margin: 0; }
  .page {
    width: 8.5in; height: 11in;
    position: relative; overflow: hidden;
    page-break-after: always;
    background: var(--paper);
    margin: 0 auto;
  }
  .page:last-child { page-break-after: auto; }

  /* ---------- COVER ---------- */
  .cover { background: radial-gradient(120% 90% at 85% 100%, #17304E 0%, var(--navy) 55%); color: var(--white); }
  .cover-blob {
    position: absolute; top: -3.1in; right: -2.6in;
    width: 6.6in; height: 6.6in; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--accent) 0%, color-mix(in srgb, var(--accent) 72%, #7A2E08) 100%);
  }
  .cover-blob-2 {
    position: absolute; top: 3.4in; right: -1.4in;
    width: 3.4in; height: 3.4in; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent-2) 60%, var(--navy)) 0%, transparent 75%);
    opacity: .8;
  }
  .cover-inner { position: absolute; inset: 0; padding: .75in .8in; }
  .agency-mark { font-weight: 700; font-size: 21px; letter-spacing: .5px; }
  .agency-mark .m360 { color: var(--white); }
  .agency-mark .sub { display: block; font-size: 9px; font-weight: 600; letter-spacing: 4.5px; color: var(--accent); margin-top: 2px; }
  .client-badge {
    position: absolute; top: .68in; right: .8in;
    background: var(--white); border-radius: 16px;
    padding: 20px 26px; min-width: 2.1in; max-width: 2.6in;
    text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,.35);
    border: 3px solid color-mix(in srgb, var(--accent) 45%, var(--white));
  }
  .client-badge .cb-name { font-weight: 700; font-size: 19px; line-height: 1.15; color: var(--ink); }
  .client-badge .cb-tag { font-size: 8.5px; font-weight: 600; letter-spacing: 2.5px; color: var(--accent); margin-top: 5px; text-transform: uppercase; }
  .client-badge img { max-width: 2.1in; max-height: 1in; object-fit: contain; display: block; margin: 0 auto; }

  .cover-kicker { margin-top: 2.55in; font-size: 12px; font-weight: 600; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; }
  .cover-title { margin-top: .22in; font-size: 58px; font-weight: 700; line-height: 1.04; letter-spacing: -.5px; max-width: 6.6in; }
  .cover-title .hl { color: var(--accent-2); }
  .cover-sub { margin-top: .28in; font-size: 14.5px; font-weight: 400; line-height: 1.6; color: #C9D3E4; max-width: 4.9in; }
  .cover-rule { width: .62in; height: 4px; background: var(--accent); margin-top: .32in; border-radius: 2px; }
  .cover-meta { display: flex; gap: .55in; margin-top: .26in; }
  .cover-meta .label { font-size: 9.5px; font-weight: 600; letter-spacing: 2.5px; color: #7E8CA6; text-transform: uppercase; }
  .cover-meta .value { font-size: 16px; font-weight: 700; margin-top: 5px; }
  .dots { position: absolute; right: 1.1in; top: 5.4in; width: 2in; height: 1.6in; }
  .dots i { position: absolute; border-radius: 50%; display: block; }

  .core-card {
    position: absolute; left: .8in; right: .8in; bottom: .75in;
    background: linear-gradient(100deg, var(--card-navy) 0%, #223A5E 100%);
    border-radius: 14px; padding: 24px 28px;
    display: flex; gap: 26px; align-items: flex-start;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
    border-top: 3px solid var(--accent);
  }
  .core-card .cc-label { flex: 0 0 1.15in; font-size: 10px; font-weight: 700; letter-spacing: 2.5px; color: var(--accent); text-transform: uppercase; line-height: 1.7; padding-top: 2px; }
  .core-card .cc-text { font-size: 12.5px; line-height: 1.65; color: #DCE4F2; }
  .core-card .cc-text strong { color: var(--white); }

  .draft-ribbon {
    position: absolute; left: .8in; top: 2.1in;
    background: rgba(233,161,59,.14); border: 1px solid var(--warn);
    color: var(--warn); font-size: 9.5px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; border-radius: 100px; padding: 6px 16px;
  }

  /* ---------- INTERIOR ---------- */
  .inner { padding: .62in .8in .95in; height: 100%; position: relative; }
  .page-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .42in; }
  .page-head .ph-left { font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: .8px; }
  .page-head .ph-right { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 2.5px; text-transform: uppercase; }

  .chap-kicker { font-size: 11px; font-weight: 700; letter-spacing: 3.5px; color: var(--accent); text-transform: uppercase; }
  .chap-title { font-size: 37px; font-weight: 700; color: var(--ink); letter-spacing: -.4px; line-height: 1.08; margin-top: 8px; }
  .chap-title .hl { color: var(--accent-2); }
  .chap-rule { display: flex; align-items: center; gap: 9px; margin: 16px 0 20px; }
  .chap-rule .bar { width: .58in; height: 4px; border-radius: 2px; background: var(--accent); }
  .chap-rule i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .chap-lead { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.55; max-width: 6.7in; margin-bottom: 18px; }
  .chap-lead .hl { color: var(--accent-2); }

  .ghost-num {
    position: absolute; right: .3in; bottom: .75in;
    font-size: 260px; font-weight: 700; line-height: .8; letter-spacing: -10px;
    display: flex; z-index: 0; pointer-events: none;
  }
  .ghost-num b { color: color-mix(in srgb, var(--accent) 22%, var(--paper)); font-weight: 700; }
  .ghost-num span { color: color-mix(in srgb, var(--accent-2) 26%, var(--paper)); font-weight: 700; }

  .kpi-row { display: grid; grid-template-columns: repeat(var(--kpi-cols, 4), 1fr); gap: 14px; margin: 6px 0 20px; position: relative; z-index: 1; }
  .kpi-card {
    background: linear-gradient(135deg, var(--card-navy) 0%, #223A5E 115%);
    border-radius: 12px; padding: 16px 16px 14px;
    border-top: 4px solid var(--accent);
    box-shadow: 0 8px 20px rgba(16,30,51,.18);
    color: var(--white);
  }
  .kpi-card .k-label { font-size: 8.5px; font-weight: 700; letter-spacing: 2px; color: #9FB0CC; text-transform: uppercase; }
  .kpi-card .k-value { font-size: 30px; font-weight: 700; color: var(--accent); margin-top: 6px; letter-spacing: -.5px; }
  .kpi-card:nth-child(even) .k-value { color: var(--accent-2); }
  .kpi-card .k-sub { font-size: 9.5px; color: #B9C6DC; line-height: 1.45; margin-top: 4px; min-height: 14px; }
  .kpi-card .k-delta { display: inline-block; margin-top: 8px; font-size: 9.5px; font-weight: 700; border-radius: 100px; padding: 3px 10px; }
  .kpi-card .k-delta.up { background: rgba(47,179,128,.18); color: #56D6A5; }
  .kpi-card .k-delta.down { background: rgba(228,87,79,.18); color: #F49189; }
  .kpi-card .k-delta.flat { background: rgba(155,171,197,.18); color: #B9C6DC; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; position: relative; z-index: 1; }
  .charts.single { grid-template-columns: 1fr; }
  .chart-card { background: var(--white); border-radius: 12px; padding: 16px 18px 10px; border: 1px solid var(--line); border-left: 4px solid var(--accent); }
  .chart-card h4 { font-size: 11px; font-weight: 700; color: var(--ink); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; }
  .chart-card svg { width: 100%; display: block; }

  .takeaway {
    background: linear-gradient(100deg, var(--card-navy) 0%, #223A5E 100%);
    border-radius: 14px; padding: 20px 26px; color: #DCE4F2;
    position: relative; z-index: 1; border-top: 3px solid var(--accent);
  }
  .takeaway .t-label { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  .takeaway .t-label::before { content: '◆ '; font-size: 8px; vertical-align: 1px; }
  .takeaway p { font-size: 12px; line-height: 1.65; }
  .takeaway p strong { color: var(--white); }

  .sec-h { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; position: relative; z-index: 1; }
  .sec-h .tick { width: 4px; height: 18px; border-radius: 2px; background: var(--accent); }
  .sec-h h3 { font-size: 15.5px; font-weight: 700; color: var(--ink); }

  .camp-card {
    background: var(--white); border-radius: 12px; border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    padding: 14px 18px; margin-bottom: 11px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 16px;
    position: relative; z-index: 1;
  }
  .camp-card .c-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  .camp-card .c-note { font-size: 10.5px; color: var(--body); line-height: 1.5; grid-column: 1; }
  .camp-card .c-side { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .chip { display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 100px; padding: 4px 12px; }
  .chip.live { background: rgba(47,179,128,.14); color: #1E8A61; }
  .chip.watch { background: rgba(233,161,59,.16); color: #B87716; }
  .chip.blocked { background: rgba(228,87,79,.14); color: #C13B33; }
  .chip.paused { background: rgba(139,149,169,.16); color: #66718A; }
  .camp-card .c-nums { font-size: 10.5px; color: var(--body); font-weight: 600; }
  .camp-card .c-nums b { color: var(--ink); }

  .win-row { display: flex; gap: 14px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); position: relative; z-index: 1; }
  .win-row:last-child { border-bottom: none; }
  .num-chip {
    flex: 0 0 26px; width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent); color: var(--white);
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .num-chip.alt { background: var(--accent-2); }
  .win-row p { font-size: 12px; color: var(--body); line-height: 1.55; padding-top: 3px; }
  .win-row p strong { color: var(--ink); }

  .quote-card {
    margin-top: 22px; border-radius: 14px; position: relative; z-index: 1;
    background: linear-gradient(115deg, color-mix(in srgb, var(--accent) 9%, var(--white)) 0%, color-mix(in srgb, var(--accent-2) 14%, var(--white)) 100%);
    border-left: 5px solid var(--accent);
    padding: 26px 30px;
  }
  .quote-card .q-mark { position: absolute; top: 14px; right: 24px; font-size: 64px; font-weight: 700; color: color-mix(in srgb, var(--accent-2) 40%, var(--white)); line-height: 1; font-family: Georgia, serif; }
  .quote-card p { font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.4; max-width: 5.6in; }
  .quote-card .q-src { margin-top: 12px; font-size: 9.5px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }

  .contact-card {
    margin-top: 22px; background: linear-gradient(100deg, var(--card-navy) 0%, #223A5E 100%);
    border-radius: 14px; padding: 22px 28px; color: var(--white);
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 1; border-top: 3px solid var(--accent);
  }
  .contact-card .cc-l .lab { font-size: 9.5px; font-weight: 700; letter-spacing: 2.5px; color: var(--accent); text-transform: uppercase; }
  .contact-card .cc-l .who { font-size: 17px; font-weight: 700; margin-top: 5px; }
  .contact-card .cc-l .em { font-size: 11px; color: #B9C6DC; margin-top: 2px; }
  .contact-card .cc-r { font-size: 10.5px; color: #B9C6DC; text-align: right; line-height: 1.6; max-width: 2.9in; }

  .page-foot {
    position: absolute; left: .8in; right: .8in; bottom: .42in;
    display: flex; justify-content: space-between; align-items: baseline;
    z-index: 2;
  }
  .page-foot .f-brand { font-size: 10.5px; font-weight: 700; color: var(--ink); }
  .page-foot .f-mid { font-size: 9px; font-weight: 600; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .page-foot .f-num { font-size: 11px; font-weight: 700; color: var(--accent); }

  .draft-tag {
    display: inline-block; margin-left: 10px;
    font-size: 8px; font-weight: 700; letter-spacing: 1.5px; color: var(--warn);
    border: 1px solid var(--warn); border-radius: 100px; padding: 2px 8px; vertical-align: 1px;
  }
</style>
</head>
<body>
<div id="doc"></div>
<script id="report-data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('report-data').textContent);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const root = document.documentElement;
if (D.theme) {
  if (D.theme.accent) root.style.setProperty('--accent', D.theme.accent);
  if (D.theme.accent2) root.style.setProperty('--accent-2', D.theme.accent2);
}
const agency = D.agency || 'Momentum 360';
const draft = !!D.sampleData;

/* ---- title: highlight one word of the client name ---- */
function coverTitle() {
  const words = D.client.split(' ');
  const hlWord = D.theme && D.theme.titleWord ? D.theme.titleWord : words[0];
  const name = words.map(w => w === hlWord ? `<span class="hl">${esc(w)}</span>` : esc(w)).join(' ');
  return `${name}<br>${esc(D.reportNoun || 'Performance Report')}`;
}

function dotsField(seed) {
  const pos = [[10,20,7],[42,8,9],[70,30,7],[25,55,8],[58,62,10],[88,70,7],[35,88,7],[75,95,9]];
  return pos.map((p,i) => `<i style="left:${p[0]}%;top:${p[1]}%;width:${p[2]}px;height:${p[2]}px;background:${i%2 ? 'var(--accent-2)' : 'var(--accent)'};opacity:.85"></i>`).join('');
}

function deltaChip(k) {
  if (!k.delta) return '';
  const isDown = k.delta.trim().startsWith('-');
  const good = k.deltaGoodWhenDown ? isDown : !isDown;
  const cls = k.delta.replace(/[+\-%]/g,'') === '0' ? 'flat' : (good ? 'up' : 'down');
  const arrow = isDown ? '▼' : '▲';
  return `<span class="k-delta ${cls}">${arrow} ${esc(k.delta)} vs May</span>`;
}

function barChart(c) {
  const W = 320, H = 150, padL = 8, padB = 22, padT = 16;
  const max = Math.max(...c.values) * 1.15 || 1;
  const n = c.values.length;
  const bw = Math.min(38, (W - padL*2) / n * .58);
  const gap = (W - padL*2) / n;
  let bars = '', labels = '', grid = '';
  for (let g = 1; g <= 3; g++) {
    const y = padT + (H - padB - padT) * g / 3;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padL}" y2="${y}" stroke="#EEE8DC" stroke-width="1"/>`;
  }
  c.values.forEach((v,i) => {
    const h = (H - padB - padT) * v / max;
    const x = padL + gap*i + (gap-bw)/2;
    const y = H - padB - h;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="url(#bg${c._i})"/>`;
    bars += `<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="9" font-weight="700" fill="#1B2A44">${c.prefix||''}${v.toLocaleString()}</text>`;
    labels += `<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="8.5" fill="#8B95A9">${esc(c.labels[i])}</text>`;
  });
  return `<div class="chart-card"><h4>${esc(c.title)}</h4>
    <svg viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="bg${c._i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c._i % 2 ? 'var(--accent-2)' : 'var(--accent)'}"/>
        <stop offset="1" stop-color="${c._i % 2 ? 'color-mix(in srgb, var(--accent-2) 60%, var(--card-navy))' : 'color-mix(in srgb, var(--accent) 60%, var(--card-navy))'}"/>
      </linearGradient></defs>
      ${grid}${bars}${labels}</svg></div>`;
}

function head(section) {
  return `<div class="page-head"><span class="ph-left">${esc(D.client)} · ${esc(D.periodLabel)} Report${draft ? '<span class="draft-tag">Draft</span>' : ''}</span><span class="ph-right">${esc(section)}</span></div>`;
}
function foot(n) {
  return `<div class="page-foot"><span class="f-brand">${esc(agency)}</span><span class="f-mid">${esc(D.periodLabel)} Edition</span><span class="f-num">${n}</span></div>`;
}
function ghost(n) {
  const s = String(n).padStart(2,'0');
  return `<div class="ghost-num"><b>${s[0]}</b><span>${s[1]}</span></div>`;
}
function chapRule() {
  return `<div class="chap-rule"><span class="bar"></span><i style="background:var(--accent)"></i><i style="background:var(--accent)"></i><i style="background:var(--accent-2)"></i><i style="background:var(--accent-2)"></i></div>`;
}

/* ---------- PAGE 1 : COVER ---------- */
const services = (D.servicesLine || '').toUpperCase();
const cover = `
<div class="page cover">
  <div class="cover-blob"></div><div class="cover-blob-2"></div>
  <div class="dots">${dotsField()}</div>
  <div class="cover-inner">
    <div class="agency-mark"><span class="m360">${esc(agency)}</span><span class="sub">PERFORMANCE INTELLIGENCE</span></div>
    <div class="client-badge">${D.logo ? `<img src="${D.logo}" alt="${esc(D.client)}">` : `<div class="cb-name">${esc(D.client)}</div>`}<div class="cb-tag">${esc(D.industryTag || 'Client Partner')}</div></div>
    ${draft ? '<div class="draft-ribbon">Draft · Pending Final ' + esc(D.periodLabel) + ' Actuals</div>' : ''}
    <div class="cover-kicker">${esc(D.periodLabel)} &nbsp;·&nbsp; Monthly Performance Report</div>
    <h1 class="cover-title">${coverTitle()}</h1>
    <p class="cover-sub">${esc(D.coverSub || D.summary)}</p>
    <div class="cover-rule"></div>
    <div class="cover-meta">
      <div><div class="label">Prepared by</div><div class="value">${esc(D.preparedBy || 'Dillon Mohr')}</div></div>
      <div><div class="label">Period</div><div class="value">${esc(D.periodLabel)}</div></div>
      <div><div class="label">Engagement</div><div class="value">${esc(services)}</div></div>
    </div>
  </div>
  <div class="core-card"><div class="cc-label">The Bottom Line</div><div class="cc-text">${D.headline || esc(D.summary)}</div></div>
</div>`;

/* ---------- PAGE 2 : SNAPSHOT ---------- */
const kpis = (D.kpis || []).map(k => `
  <div class="kpi-card"><div class="k-label">${esc(k.label)}</div><div class="k-value">${esc(k.value)}</div>
  <div class="k-sub">${esc(k.sub || '')}</div>${deltaChip(k)}</div>`).join('');
const charts = (D.charts || []).map((c,i) => { c._i = i; return barChart(c); }).join('');
const snapshot = `
<div class="page"><div class="inner">
  ${head('Chapter One')}
  <div class="chap-kicker">Chapter One</div>
  <h2 class="chap-title">Performance <span class="hl">Snapshot</span></h2>
  ${chapRule()}
  <p class="chap-lead">${D.snapshotLead || esc(D.summary)}</p>
  <div class="kpi-row" style="--kpi-cols:${Math.min((D.kpis||[]).length,4)}">${kpis}</div>
  <div class="charts ${(D.charts||[]).length === 1 ? 'single' : ''}">${charts}</div>
  <div class="takeaway"><div class="t-label">Month Takeaway</div><p>${D.takeaway || esc(D.summary)}</p></div>
  ${ghost(1)}${foot(2)}
</div></div>`;

/* ---------- PAGE 3 : WORK & WINS ---------- */
const camps = (D.campaigns || []).map(c => `
  <div class="camp-card">
    <div class="c-name">${esc(c.name)}</div>
    <div class="c-side"><span class="chip ${esc(c.status)}">${esc(c.statusLabel || c.status)}</span>
    <span class="c-nums">${c.spend && c.spend !== '—' ? '<b>' + esc(c.spend) + '</b> · ' : ''}${esc(c.results || '')}</span></div>
    <div class="c-note">${esc(c.note || '')}</div>
  </div>`).join('');
const wins = (D.wins || []).map((w,i) => `
  <div class="win-row"><div class="num-chip ${i%2 ? 'alt' : ''}">${i+1}</div><p>${w}</p></div>`).join('');
const work = `
<div class="page"><div class="inner">
