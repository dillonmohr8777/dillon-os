<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum 360 Client Reporting Dashboard</title>
<style>
  :root{
    --bg:#020617; --panel:#0b1220; --panel-2:#111a2e; --edge:#1e293b; --edge-hi:#334155;
    --ink:#e2e8f0; --ink-2:#94a3b8; --ink-3:#64748b;
    --accent:#34d399; --accent-dim:#065f46; --accent-ink:#d1fae5;
    --blue:#38bdf8; --amber:#fbbf24; --rose:#fb7185;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}

  /* sidebar */
  aside{background:var(--panel);border-right:1px solid var(--edge);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
  @media (max-width:820px){aside{position:static;height:auto}}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:30px;height:30px;border-radius:7px;background:#fff;padding:3px;object-fit:contain}
  .brand .t{font-weight:700;letter-spacing:.02em}
  .brand .s{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.14em}
  .navlabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:6px 4px 2px}
  .client-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 10px;color:var(--ink-2);cursor:pointer;font-family:inherit;font-size:13px}
  .client-btn:hover{background:var(--panel-2);color:var(--ink)}
  .client-btn.active{background:var(--panel-2);border-color:var(--edge-hi);color:var(--ink)}
  .client-btn img{width:24px;height:24px;border-radius:6px;background:#fff;padding:2px;object-fit:contain;flex:none}
  .client-btn .meta{min-width:0;display:flex;flex-direction:column;flex:1}
  .client-btn .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .client-btn .st{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .rev-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto;background:var(--ink-3)}
  .rev-dot.ready{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .rev-dot.approved{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .rev-dot.edits{background:var(--rose);box-shadow:0 0 6px var(--rose)}

  /* main */
  main{padding:26px 30px 60px;max-width:1100px}
  @media (max-width:820px){main{padding:20px 16px 48px}}
  .topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:20px}
  .rlogo{width:56px;height:56px;border-radius:12px;background:#fff;padding:6px;object-fit:contain}
  .htext h1{font-size:24px;line-height:1.15;letter-spacing:-.01em}
  .htext .sub{color:var(--ink-2);font-size:12px;margin-top:3px}
  .pillrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--edge-hi);color:var(--ink-2);background:var(--panel)}
  .pill.status{border-color:var(--accent-dim);color:var(--accent-ink);background:rgba(6,95,70,.25)}
  .selectors{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--edge-hi);border-radius:9px;padding:8px 12px;font-family:inherit;font-size:13px}

  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .lede{color:var(--ink);font-size:15px;line-height:1.6}
  .goal{color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi{background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:14px}
  .kpi .l{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
  .kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-family:var(--mono)}
  .kpi .c{font-size:12px;margin-top:3px}
  .kpi .c.up{color:var(--accent)} .kpi .c.down{color:var(--rose)} .kpi .c.neutral{color:var(--ink-2)}
  .kpi .cx{font-size:11px;color:var(--ink-3);margin-top:5px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--edge)}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  td .nm{font-weight:600}
  td .nt{color:var(--ink-3);font-size:12px;margin-top:2px}
  .chip{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--edge-hi);color:var(--ink-2);white-space:nowrap}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.cols{grid-template-columns:1fr}}
  ul.list{list-style:none;display:flex;flex-direction:column;gap:8px}
  ul.list li{position:relative;padding-left:18px;color:var(--ink-2)}
  ul.list li::before{content:"•";position:absolute;left:2px;color:var(--accent)}
  ul.list.warn li::before{color:var(--amber)}

  .srcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  @media (max-width:560px){.srcgrid{grid-template-columns:1fr}}
  .src{background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:14px}
  .src .n{font-size:34px;font-weight:700;font-family:var(--mono)}
  .src .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;margin-top:8px}
  .badge.live{background:rgba(6,95,70,.35);color:var(--accent-ink);border:1px solid var(--accent-dim)}
  .badge.pending{background:rgba(120,53,15,.35);color:#fed7aa;border:1px solid #7c2d12}

  /* chart */
  .chart{display:flex;gap:22px;align-items:flex-end;height:200px;padding:8px 4px 0}
  .bargroup{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .bars{display:flex;gap:12px;align-items:flex-end;height:165px}
  .barcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
  .barcol .bv{font-size:10px;color:var(--ink-2);font-family:var(--mono)}
  .bar{width:22px;border-radius:5px 5px 0 0}
  .bar.impr{background:linear-gradient(180deg,#38bdf8,#0369a1)}
  .bar.clk{background:linear-gradient(180deg,#34d399,#065f46)}
  .bar.lead{background:linear-gradient(180deg,#fbbf24,#b45309)}
  .bargroup .xl{font-size:11px;color:var(--ink-3);text-align:center;white-space:nowrap}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* review */
  .review{border-color:var(--edge-hi)}
  .notice{font-size:12px;color:#fde68a;background:rgba(120,53,15,.22);border:1px solid #7c2d12;border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:5px}
  .field input,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--edge-hi);border-radius:9px;padding:9px 11px;color:var(--ink);font-family:inherit;font-size:13px}
  .field textarea{min-height:72px;resize:vertical}
  .docrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .docrow .dt{font-weight:600;flex:1;min-width:160px}
  .docrow input{flex:2;min-width:180px;background:var(--panel);border:1px solid var(--edge-hi);border-radius:8px;padding:7px 10px;color:var(--ink);font-family:inherit;font-size:12px}
  .statusline{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px}
  .statusline .lbl{color:var(--ink-3)}
  .statusline .val{font-weight:700}
  .statusline .val.ready{color:var(--amber)} .statusline .val.approved{color:var(--accent)} .statusline .val.edits{color:var(--rose)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  button.act{font-family:inherit;font-size:13px;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent}
  button.approve{background:rgba(6,95,70,.35);border-color:var(--accent-dim);color:var(--accent-ink)}
  button.approve:hover{background:rgba(6,95,70,.6)}
  button.edits{background:rgba(120,20,40,.35);border-color:#7f1d3a;color:#fecdd3}
  button.edits:hover{background:rgba(120,20,40,.6)}
  button.send{background:var(--panel-2);border-color:var(--edge-hi);color:var(--ink)}
  button.send:hover{border-color:var(--blue);color:#fff}
  .saved{font-size:12px;color:var(--accent);margin-left:4px;opacity:0;transition:opacity .2s}
  .saved.show{opacity:1}
  footer{color:var(--ink-3);font-size:11px;margin-top:24px;border-top:1px solid var(--edge);padding-top:14px}
</style>
</head>

</div>

const CLIENTS = APP.clients;
const LOGOS = APP.logos;

const REVIEW_KEY = "m360-review-v1";

const store = {
  read(){ try{ return JSON.parse(localStorage.getItem(REVIEW_KEY)||"{}"); }catch{ return {}; } },
  write(o){ try{ localStorage.setItem(REVIEW_KEY, JSON.stringify(o)); }catch{} },
  get(slug, period){ const o=this.read(); return (o[slug]&&o[slug][period])||{}; },
  set(slug, period, patch){ const o=this.read(); o[slug]=o[slug]||{}; o[slug][period]={...(o[slug][period]||{}),...patch}; this.write(o); }
};

  return saved.decision || "ready"; // ready | approved | edits
}
function stateLabel(s){ return s==="approved"?"Approved":s==="edits"?"Edits Requested":"Ready for review"; }

  nav.innerHTML = "";
  for(const slug of SLUGS){
    const c = CLIENTS[slug];
    const st = reviewState(slug, c.reportingMonth||c.reportMonth||"default");
    const b = document.createElement("button");
    b.className = "client-btn"+(slug===current?" active":"");
    b.innerHTML = `<img src="${logo(c.logoFile)}" alt=""><span class="meta"><span class="nm">${esc(c.clientName)}</span><span class="st">${esc(c.industry||"")}</span></span><span class="rev-dot ${st}"></span>`;
    b.onclick = ()=>{ current=slug; renderNav(); renderReport(); window.scrollTo(0,0); };
    nav.appendChild(b);
  }
}

function kpiCard(k){
  return `<div class="kpi"><div class="l">${esc(k.label)}</div><div class="v">${esc(k.value)}</div>
    <div class="c ${esc(k.trend||"neutral")}">${esc(k.change||"")}</div>
    <div class="cx">${esc(k.context||"")}</div></div>`;
}
function chart(data){
  if(!data||!data.length) return "";
  // Impressions dwarf clicks and leads, so a shared scale hides the smaller
  // series. Scale each metric to its own max across the periods and print the
  // real value on the bar, so every series stays readable and honest.
  const maxOf = key => Math.max(1, ...data.map(d=>d[key]||0));
  const mImpr=maxOf("impressions"), mClk=maxOf("clicks"), mLead=maxOf("leads");
  const h = (v,m) => v>0 ? Math.max(6, Math.round((v/m)*130)) : 3;
  const fmt = n => (n||0).toLocaleString();
  const bar = (cls,v,m,label) => `<div class="barcol"><span class="bv">${fmt(v)}</span>
      <div class="bar ${cls}" style="height:${h(v,m)}px" title="${label}: ${fmt(v)}"></div></div>`;
  const groups = data.map(d=>`
    <div class="bargroup"><div class="bars">
      ${bar("impr",d.impressions||0,mImpr,"Impressions")}
      ${bar("clk",d.clicks||0,mClk,"Clicks")}
      ${bar("lead",d.leads||0,mLead,"Leads")}
    </div><div class="xl">${esc(d.week)}</div></div>`).join("");
  return `<div class="panel"><h2>Weekly Movement <span class="chip">each metric scaled to its own peak</span></h2><div class="chart">${groups}</div>
    <div class="legend"><span><i style="background:#38bdf8"></i>Impressions</span><span><i style="background:#34d399"></i>Clicks</span><span><i style="background:#fbbf24"></i>Leads</span></div></div>`;
}
function srcBadge(n, label, source){
  const pending = !n || n===0;
  return `<div class="src"><div class="k">${esc(label)}</div><div class="n">${esc(n||0)}</div>
    <span class="badge ${pending?"pending":"live"}">${pending?"Source pending":"Live"}</span></div>`;
}
function listPanel(title, items, warn){
  if(!items||!items.length) return "";
  return `<div class="panel"><h2>${esc(title)}</h2><ul class="list${warn?" warn":""}">${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`;
}

function renderReport(){
  const c = CLIENTS[current];
  const period = c.reportingMonth || c.reportMonth || "default";
  const saved = store.get(current, period);
  const st = reviewState(current, period);
  const lb = c.leadBreakdown||{};
  const periods = [{v:period, t:(c.reportMonth||period)}]; // extend when more periods are added to the data

  const kpis = (c.kpis||[]).map(kpiCard).join("");
  const channels = (c.channels||[]).map(ch=>`<tr>
      <td><div class="nm">${esc(ch.name)}</div>${ch.notes?`<div class="nt">${esc(ch.notes)}</div>`:""}</td>
      <td>$${esc(ch.spend)}</td>
      <td>${esc(ch.resultLabel||ch.leads||0)}</td>
      <td>${esc(ch.costLabel||("$"+(ch.cpl||0)))}</td>
      <td><span class="chip">${esc(ch.status||"")}</span></td></tr>`).join("");

  const docs = (c.reviewDocuments||[]).map((d,i)=>{
    const dl = (saved.docLinks&&saved.docLinks[i])||"";
    return `<div class="docrow"><span class="dt">${esc(d.title)}</span>
      <input data-doc="${i}" placeholder="Paste Google Doc / asset link" value="${esc(dl)}"></div>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="topbar">
      <div style="display:flex;gap:14px;align-items:flex-start">
        <img class="rlogo" src="${logo(c.logoFile)}" alt="${esc(c.clientName)} logo">
        <div class="htext"><h1>${esc(c.clientName)}</h1>
          <div class="sub">${esc(c.industry||"")} • ${esc(c.reportView||"Report")}</div>
          <div class="pillrow"><span class="pill status">${esc(c.status||"")}</span>
            <span class="pill">${esc(c.reportMonth||"")}</span></div>
        </div>
      </div>
      <div class="selectors">
        <select id="periodSel">${periods.map(p=>`<option value="${esc(p.v)}">${esc(p.t)}</option>`).join("")}</select>
      </div>
    </div>

    <div class="panel"><h2>Executive Summary</h2>
      <div class="lede">${esc(c.executiveSummary||"")}</div>
      ${c.primaryGoal?`<div class="goal"><b>Primary goal.</b> ${esc(c.primaryGoal)}</div>`:""}</div>

    ${kpis?`<div class="panel"><h2>Headline Metrics</h2><div class="kpis">${kpis}</div></div>`:""}

    ${chart(c.chartData)}

    ${channels?`<div class="panel"><h2>Channel Breakdown</h2><table>
      <thead><tr><th>Channel</th><th>Spend</th><th>Result</th><th>Cost</th><th>Status</th></tr></thead>
      <tbody>${channels}</tbody></table></div>`:""}

    <div class="panel"><h2>Leads &amp; Calls <span class="chip">${esc(lb.source||"source pending")}</span></h2>
      <div class="srcgrid">
        ${srcBadge(lb.forms,"Form Leads")}
        ${srcBadge(lb.calls,"Calls")}
        ${srcBadge(lb.other,"Other")}
      </div>
      ${lb.notes?`<div class="nt" style="color:var(--ink-3);font-size:12px">${esc(lb.notes)}</div>`:""}</div>

    <div class="cols">
      ${listPanel("Wins", c.wins)}
      ${listPanel("Watch-outs", c.watchouts, true)}
      ${listPanel("Changes Made", c.changesMade)}
      ${listPanel("Next Moves", c.nextMoves)}
    </div>

    <div class="panel review"><h2>Client Review <span id="savedFlag" class="saved">saved</span></h2>
      <div class="notice">Reviews save on this device. When you're done, click <b>Send review to team</b> to email your decision and comments. Set the reviewer's email below to invite them.</div>
      <div class="field"><label>Reviewer</label><input id="revName" value="${esc(saved.reviewName||c.reviewContactName||"")}" placeholder="Reviewer name"></div>
      <div class="field"><label>Reviewer email (invite)</label><input id="revEmail" type="email" value="${esc(saved.reviewEmail||c.reviewContactEmail||"")}" placeholder="name@example.com"></div>
      <div class="field"><label>Documents under review</label>${docs||'<div class="nt" style="color:var(--ink-3)">No documents attached yet.</div>'}</div>
      <div class="field"><label>Comments</label><textarea id="revComment" placeholder="Notes, requested edits, approvals...">${esc(saved.comment||"")}</textarea></div>
      <div class="statusline"><span class="lbl">Current status:</span><span class="val ${st}" id="stVal">${stateLabel(st)}</span>${saved.decidedAt?`<span class="lbl">on ${esc(saved.decidedAt)}</span>`:""}</div>
      <div class="btnrow">
        <button class="act approve" id="btnApprove">Approve</button>
        <button class="act edits" id="btnEdits">Request Edits</button>
        <button class="act send" id="btnSend">Send review to team</button>
      </div>
    </div>

    <footer>Momentum 360 client reporting dashboard. Data reflects the latest verified pull. Blocks marked "source pending" aren't wired to a live feed yet and shouldn't be read as final.</footer>
  `;
  wireReview(current, period, c);
}

function wireReview(slug, period, c){
  const flag = document.getElementById("savedFlag");
  const showSaved = ()=>{ flag.classList.add("show"); setTimeout(()=>flag.classList.remove("show"),1200); };
  const persist = patch => { store.set(slug, period, patch); showSaved(); renderNav(); };

  const name = document.getElementById("revName");
  const email = document.getElementById("revEmail");
  const comment = document.getElementById("revComment");
  name.oninput = ()=>persist({reviewName:name.value});
  email.oninput = ()=>persist({reviewEmail:email.value});
  comment.oninput = ()=>persist({comment:comment.value});

  document.querySelectorAll("[data-doc]").forEach(inp=>{
    inp.oninput = ()=>{
      const saved = store.get(slug, period);
      const docLinks = {...(saved.docLinks||{})};
      docLinks[inp.getAttribute("data-doc")] = inp.value;
      persist({docLinks});
    };
  });

  const setDecision = d => {
    const now = new Date().toISOString().slice(0,16).replace("T"," ");
    persist({decision:d, decidedAt:now});
    const v = document.getElementById("stVal");
    v.textContent = stateLabel(d); v.className = "val "+d;
  };
  document.getElementById("btnApprove").onclick = ()=>setDecision("approved");
  document.getElementById("btnEdits").onclick = ()=>setDecision("edits");

  document.getElementById("btnSend").onclick = ()=>{
    const saved = store.get(slug, period);
    const decision = stateLabel(saved.decision||"ready");
    const links = Object.values(saved.docLinks||{}).filter(Boolean);
    const to = (saved.reviewEmail||c.reviewContactEmail||"").trim();
    const subject = `Review: ${c.clientName} — ${c.reportMonth||period} — ${decision}`;
    const body =
      `Client: ${c.clientName}\nPeriod: ${c.reportMonth||period}\nDecision: ${decision}\n`+
      `Reviewer: ${saved.reviewName||c.reviewContactName||""}${to?" ("+to+")":""}\n\n`+
      `Comments:\n${saved.comment||"(none)"}\n\n`+
      `Documents:\n${links.length?links.join("\n"):"(none attached)"}\n`;
    window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  };

  const sel = document.getElementById("periodSel");
  if(sel) sel.onchange = ()=>renderReport(); // single period today; ready for more
}

renderNav();
renderReport();
</script>
</body>
