<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KJB — Social Square (1080×1080)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1080px;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #FAF7F2;
      color: #2B3A52;
    }
    .frame {
      width: 100%; height: 100%;
      padding: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .frame::before {
      content: '';
      position: absolute;
      inset: 40px;
      border: 1px solid rgba(201,169,110,.4);
      pointer-events: none;
      animation: borderGlow 4s ease-in-out infinite;
    }
    @keyframes borderGlow {
      0%, 100% { opacity: .5; }
      50% { opacity: 1; }
    }
    .eyebrow {
      font-family: Montserrat, sans-serif;
      font-size: 22px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 40px;
      animation: fadeIn 1.2s ease-out;
    }
    h1 {
      font-size: 88px;
      font-weight: 400;
      line-height: 1.1;
      max-width: 12ch;
      animation: fadeIn 1.2s ease-out .15s both;
    }
    .script {
      font-style: italic;
      font-size: 52px;
      color: #C9A96E;
      margin: 32px 0 48px;
      animation: fadeIn 1.2s ease-out .3s both;
    }
    .cta {
      font-family: Montserrat, sans-serif;
      font-size: 24px;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 24px 56px;
      background: #2B3A52;
      color: #FAF7F2;
      animation: fadeIn 1.2s ease-out .45s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .shimmer {
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,.08), transparent);
      animation: shimmer 5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      50%, 100% { left: 150%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="shimmer"></div>
    <p class="eyebrow">Chestnut Hill</p>
    <h1>Your Timeline Starts Here</h1>
    <p class="script">Boutique bridal, personal styling</p>
    <div class="cta">Book Appointment</div>
  </div>
</body>
</html>
