id = "bok-facebook-weekly-pdf-scheduler"
kind = "cron"
name = "BOK Facebook weekly PDF scheduler"
prompt = "Run the BOK Law Firm weekly Facebook scheduling workflow every Tuesday at 5:00 PM in Dillon's America/New_York local time. This is an action-enabled but narrowly scoped client workflow.\n\nAt the start of every run, read C:\\Users\\dillo\\.codex\\AGENTS.md and C:\\Users\\dillo\\Documents\\Codex\\projects\\client-operations\\AGENTS.md. Resolve BOK through C:\\Users\\dillo\\Documents\\Codex\\projects\\client-operations\\registry\\clients.json and use client id bok-law-firm only. Work in C:\\Users\\dillo\\Documents\\Codex\\projects\\client-operations\\clients\\bok-law-firm. Read C:\\Users\\dillo\\.codex\\automations\\bok-facebook-weekly-pdf-scheduler\\memory.md first if it exists. Maintain only redacted idempotency metadata there: packet SHA-256, packet date range, post labels and dates, Facebook-only destination, scheduled status, and non-secret result locators. Never write raw email bodies, raw PDF copy, credentials, cookies, tokens, one-time codes, or signed download URLs to memory or logs.\n\nSource intake is Gmail account dillonmohr8777@gmail.com. Search SENT messages from Dillon to the exact BOK recipients doneil@boklawfirm.com, rbowe@boklawfirm.com, and akocelko@boklawfirm.com with a PDF attachment from the recent weekly window. The normal pattern is a subject such as This Week With BOK | [date range] and a filename such as BOK_Law_Weekly_Social_Copy_[date range].pdf, but do not hardcode a date or rely on the subject alone. Read the full candidate message or thread and choose the newest qualifying weekly social packet whose PDF contains a clear current date range and post manifest. Exclude social performance reports, unrelated attachments, detached image emails, and older packets. If a newer correction packet has the same week dates, use it only when it is clearly the current replacement; if it conflicts with already scheduled posts, stop and report the conflict instead of replacing or duplicating anything. If no qualifying packet is found, make no external change and report waiting for the weekly PDF.\n\nRead the selected PDF attachment with Gmail's attachment reader. Use the PDF's own page images and parsed page text as the only creative source. Save or download temporary working files only under the BOK client work area or an ephemeral temporary directory, and do not print signed URLs. Identify the cover or manifest page and every actual post page from the packet. Do not schedule the cover. The current packet pattern is one cover plus three post pages, but future packet page counts may differ. If the number of post pages, image assets, captions, or dates is unclear or mismatched, stop safely.\n\nFor every post page, preserve the exact supplied caption from its COPY AND PASTE section, including wording, punctuation, emojis, call to action, disclaimer, phone number, website, and hashtags. Do not rewrite, summarize, add claims, or infer missing copy. Use the actual graphic image rendered or extracted from that same PDF page, not an unrelated attachment. Create one Facebook post per manifest item.\n\nUse the Codex in-app browser in the background for Meta Business Suite and reuse the existing authorized session and account-selection route. Open Planner or Content Calendar and confirm that the selected asset/page is exactly BOK Law & Mediation Services, PLLC before any upload or save. If the page is another business, the BOK page is not visibly selected, the session is signed out, or Meta presents passkey, MFA, CAPTCHA, phone verification, recovery, consent, or another human-only security gate, do not bypass it and do not post; stop and report the gate.\n\nUse Facebook only. Do not cross-post to Instagram, create ads, boost posts, edit unrelated content, change account or page settings, or send any email or Slack message. Before creating each schedule entry, search Planner for an existing scheduled or published item with the same week/date, graphic, or caption. If a duplicate or conflicting item is present, do not create another one; stop and report the exact duplicate condition. If the same packet SHA-256 is already recorded with every post verified as scheduled, do nothing.\n\nSchedule each post for the date stated in the PDF. Use 5:00 PM America/New_York for each post when the PDF gives a date but no time, unless the PDF explicitly supplies a different time. Never backdate a post; if a packet date has already passed at run time, stop and report the date ambiguity rather than guessing. Before every save, verify the destination is Facebook only, the page is BOK, the selected graphic is correct, and the caption and date/time match the packet.\n\nAfter scheduling, reread Planner or the resulting post details and verify each item separately by page, platform, graphic, caption, date/time, and scheduled state. Only then update the idempotency memory. Report a concise standalone result with the packet filename and date range, the number scheduled or the no-op/blocked state, and the verified schedule result. Never claim a post was published when the evidence only shows it was scheduled. Do not write to the canonical client queue or alter Access Broker in this job."
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYDAY=TU;BYHOUR=17;BYMINUTE=0"
model = "gpt-5.6-terra"
reasoning_effort = "high"
notification_policy = "failed_runs_only"
execution_environment = "local"
target = { type = "project", project_id = "local-03046e22be7ca1d6e9c6745563ea0d3e" }
cwds = ["C:\\Users\\dillo"]
