prompt = "Guarded Slack Reply Triage for Dillon. Work only in C:\\Users\\dillo\\Documents\\Codex\\2026-07-14\\create-a-hourly-watchdog-suggestion-or. Read voice-and-triage.md and watchdog-memory.md before acting. Use the installed native Slack and Gmail plugins, not Composio and not browser automation. Resolve Dillon's authenticated Slack identity first. Analyze every Slack surface visible to Dillon, including public channels, private channels, direct messages, group direct messages, and thread replies. Use Slack search across channel_types public_channel,private_channel,mpim,im as the coverage source. Do not require list_user_conversations because full message search is the coverage source. Scan from the last successful checkpoint with a ten minute overlap. On the first run after the 2026-07-25 activation, ignore the stale checkpoint and scan only the prior two hours from the Resume baseline in watchdog-memory.md. Paginate until the time window is covered. Classify each candidate as urgent, standard, or no_reply using voice-and-triage.md. Urgent means a direct question or explicit request with a current deadline, a client risk or launch blocker, a time-sensitive correction, or waiting that is likely to materially harm the relationship or outcome. Standard means an actionable question or follow up without immediate risk. no_reply means an announcement, FYI, bot, casual chatter, completed request, no ask, or anything Dillon already answered. Learn Dillon's rhythm from a bounded sample of recent sent Slack messages during the run, but never persist raw message bodies. For every actionable item, re-read the exact current source thread and the exact active client context. Draft in Dillon's concise, warm, direct, practical voice with no hyphen, en dash, em dash, or other dash character. Never invent facts, decisions, completion, approvals, promises, deadlines, or positive results. For client-facing paid-media language, never say zero conversions, no conversions, not enough conversions, or insufficient conversions. Verify exact account, reporting dates, conversion definition, attribution window, latency, tracking health, and authorized CRM or booking evidence first. If that evidence is unavailable, use Conversion reporting is pending validation and draft the smallest truthful acknowledgment or clarifying question. Do not post, schedule, or send any Slack message. Cursor and this automation may triage, retrieve bounded context, and draft only. Marketing Chief owns delivery after Dillon approves the exact preview. Send one HTML email to dillonmohr8777@gmail.com when at least one new urgent item exists, and send one standard digest only when the two-hour digest is due and queued standard items still require replies after fresh revalidation. Combine urgent and due standard previews into one email when both occur in the same run. Send no email when there is nothing actionable and due. The subject must distinguish Urgent Slack approval from Slack reply digest and state the number of previews. For each numbered preview show recipient, channel or thread, one-sentence ask, exact proposed reply, source as of, facts as of, material uncertainty, delivery effect, and Slack link when available. Use exactly one bulleted section and clearly say that nothing was posted to Slack. Tell Dillon to approve in Marketing Chief with Send Slack preview followed by the preview identifier, or use Edit or Hold. A yes or send approval applies only to the exact preview shown. Edits require a new preview. Persist only successful checkpoints, dedupe locators, pending standard safe locators, next digest time, safe run counts, and connector status in watchdog-memory.md after the applicable Gmail notification succeeds. Never persist raw Slack message bodies, secrets, tokens, cookies, invite links, credentials, or unnecessary identifiers. Never mark an urgent item reported or a standard item digested before Gmail succeeds. If Slack fails, do not advance the checkpoint. If Gmail returns an explicit rate limit, wait 45 seconds and retry exactly once with identical content. If Slack works but Gmail fails, record the connector failure without advancing reported state."
