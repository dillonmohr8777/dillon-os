prompt = "Run Dillon's weekly client marketing report workflow every Monday at 10:00 AM America/New_York. Use the previous Monday through Sunday reporting window.\n\nAt the start, read C:\\Users\\dillo\\.codex\\AGENTS.md, C:\\Users\\dillo\\Documents\\Codex\\projects\\client-operations\\AGENTS.md, C:\\Users\\dillo\\Documents\\Codex\\projects\\agent-vault\\AGENTS.md, the canonical registry at C:\\Users\\dillo\\Documents\\Codex\\projects\\client-operations\\registry\\clients.json, the paid media roster, C:\\Users\\dillo\\Documents\\Codex\\projects\\client-operations\\context\\DILLON_VOICE.md, and the exact client context for every discovered client. Run Sync-AgentVault.ps1 and Test-AgentVault.ps1 before client work. Keep client brands, accounts, and channels separate.\n\nDiscover the exact report set for the preceding Monday through Sunday window instead of using a fixed client list. Search all authorized public and private Slack surfaces for Dillon's report handoff messages and report files during that window, then cross-reference Gmail threads, session history, the canonical client registry, and local report deliverables. Include every unambiguous client for whom Dillon created or delivered a report, including a client supported by Gmail/session/local evidence even if its Slack handoff is absent. Resolve every client to the canonical registry record; stop and report ambiguity rather than merging clients. Keep Replenish / 7-Eleven separate from Fresh Blends / Kwik Trip, including when Slack uses a shared channel.\n\nHard account scope for every run: Meta Ads only for Kimberly James Bridal, account 1249689223687250. Google Ads only for Kimberly James Bridal customer 814-550-6229, Omega Landscaping customer 285-398-1364, and Onsite Concrete customer 103-371-5894. Do not open or inspect Replenish Google Ads and do not open any other Google or Meta account. All other discovered client reports are report and deliverable research only unless their account is explicitly in this scope.\n\nUse the Codex in-app browser in background tabs for interactive platform work. Protect the visible YouTube or YouTube TV tab absolutely: never focus it, navigate it, reload it, close it, replace it, or bring any Ads tab in front of it. If Meta, Google, Gmail, or Slack presents MFA, CAPTCHA, passkey, recovery, new consent, or another human-only security gate, stop that lane and report the exact blocker without bypassing it. Reuse existing authorized sessions and never expose or persist secrets.\n\nFor the reporting window, read live platform evidence first. For Kimberly, set Meta, Leads Center, and Google to the exact Monday through Sunday window, retrieve the exact individual Meta lead records, and keep the lead handoff separate from the normal report communication. Search Gmail and Slack for the full current client threads, work completed, deliverables, and optimizations during the window. Use current source evidence over cached reports. Treat unavailable metrics as pending validation, never estimate them, and never use client-facing phrases such as zero conversions, no conversions, not enough conversions, or insufficient conversions. Keep Google and Meta totals separate and use whole-number lead and conversion counts.\n\nCreate one polished client PDF per discovered client under that client's canonical deliverables folder. Use the exact verified client logo from the client folder, a client-specific visual treatment, the exact reporting date range, current platform snapshot where authorized, research-backed deliverables and optimization notes, source map, and next read. For Omega and Onsite include current Google Ads evidence and any verified landing page, SEO, or local content work. For Kimberly include Meta lead count and Google read separately. For Replenish state that the Ads lane was not delivering only when verified through authorized communication evidence or Dillon's run note, do not inspect its Ads account, and do not blend Fresh Blends. For clients without live platform access, report only verified work and label unavailable metrics as pending.\n\nCreate Gmail drafts only, never send client report emails. Create one report draft per discovered client with the exact PDF attached, the exact current recipient and Reply All-style CC routing found from the full thread, clean mobile HTML in Dillon's normal human voice, no quoted history, no Markdown, no dash punctuation in the rendered body, and the exact signature from C:\\Users\\dillo\\.codex\\email-assets\\dm-marketing-specialist\\signature.html. Create a separate Kimberly lead handoff draft to Kimberly alone with no normal report CC, containing the exact lead name, submission time, email, phone, and qualification answers. Reread every draft and verify To, Cc, subject, attachment, body facts, and signature before reporting completion.\n\nCreate Slack drafts only, never post. Use the exact client channel found from current Slack evidence. Include the designed PDF filename or local artifact path and a short human summary in Dillon's voice. Do not put lead PII in Slack. If Replenish must use the shared fresh-blends channel, label the message Replenish / 7-Eleven only and explicitly exclude Fresh Blends.\n\nDo not send email, post Slack, publish content, launch or edit ads, change bids, budgets, billing, tracking, accounts, or permissions. Preserve dirty worktrees. Write only redacted evidence and report metadata. If a report is finalized, archive it through the existing report-ingest manifest workflow without treating archiving as external delivery. Return the full discovered client set, every PDF path, draft IDs or links, Slack draft results, exact blocked lanes, and the next safe action."
