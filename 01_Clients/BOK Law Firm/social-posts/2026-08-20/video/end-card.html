<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BOK Ep 58 end card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    .card {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(900px 700px at 50% 22%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, #0a4548 0%, #0d5558 46%, #163738 100%);
      color: #fff;
      font-family: "Source Sans 3", Arial, sans-serif;
      text-align: center;
    }
    .series {
      position: absolute;
      top: 88px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px 11px;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 999px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    img.cover {
      position: absolute;
      top: 180px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 520px;
      object-fit: cover;
      border-radius: 28px;
      border: 4px solid rgba(255,255,255,.9);
      box-shadow: 0 24px 48px rgba(0,0,0,.28);
    }
    h1 {
      position: absolute;
      top: 740px;
      left: 70px;
      right: 70px;
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 64px;
      line-height: 1.05;
    }
    .sub {
      position: absolute;
      top: 920px;
      left: 90px;
      right: 90px;
      margin: 0;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.28;
      color: rgba(255,255,255,.9);
    }
    .cta {
      position: absolute;
      top: 1060px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 34px 15px;
      background: #f7f3eb;
      color: #0d5558;
      border-radius: 999px;
      font-size: 28px;
      font-weight: 800;
      white-space: nowrap;
    }
    .logo {
      position: absolute;
      left: 40px;
      bottom: 110px;
      width: 140px;
      height: 140px;
      padding: 8px;
      background: #fff;
      border-radius: 50%;
      object-fit: contain;
    }
    .footer {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 84px;
      display: grid;
      place-items: center;
      background: #0a4548;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .18em;
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="series">Turn the Page Thursday</div>
    <img class="cover" src="../assets/donuts-divorce-cover-1200.jpg" alt="">
    <h1>Donuts and Divorce Episode 58</h1>
    <p class="sub">Child therapy during divorce, with Dr. Allyson Casey-Jovanovich.</p>
    <p class="cta">Listen at the link in this post</p>
    <img class="logo" src="../assets/bok-logo-transparent.png" alt="">
    <footer class="footer">BOKLAWFIRM.COM</footer>
  </article>
</body>
</html>
