name: Deploy Haoqi radar craft

# Temporary push trigger for cursor/haoqi-radar-craft-c387 so CI can republish
# the two-word glass lines. Remove the push: block after this publish.
# Pins site haoqi-radar-craft. Never creates or overwrites workshop, radar,
# IMMOHRTAL, or Philly hub sites.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/haoqi-radar-craft-c387
    paths:
      - 'haoqi-radar-sites/**'
      - '_os/automation/bin/haoqi-craft-deploy.js'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish haoqi-radar-craft
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not set on this repo."
            exit 1
          fi
          node _os/automation/bin/haoqi-craft-deploy.js
