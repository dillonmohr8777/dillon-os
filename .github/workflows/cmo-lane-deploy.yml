name: Deploy CMO lane operator board

# Manual only. Draft-deploys the noindex operator board to a pinned existing
# Netlify site. Never creates sites. Requires secrets.NETLIFY_AUTH_TOKEN and
# vars.CMO_LANE_NETLIFY_SITE_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Draft-deploy CMO lane board
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CMO_LANE_NETLIFY_SITE_ID: ${{ vars.CMO_LANE_NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not set on this repo."
            exit 1
          fi
          if [ -z "$CMO_LANE_NETLIFY_SITE_ID" ]; then
            echo "CMO_LANE_NETLIFY_SITE_ID is not pinned. Refusing to create a site."
            exit 1
          fi
          node _os/automation/bin/cmo-lane-netlify-deploy.js --publish
