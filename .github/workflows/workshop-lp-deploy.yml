name: Deploy Growth Workshop LP

# Uses the repo Actions secret NETLIFY_AUTH_TOKEN (value is not readable via
# API). workflow_dispatch only works once this file is on main; push on this
# branch is the way to publish from the PR. Does not create sites.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/growth-workshop-franchise-pilot-742c

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish patched LP
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not set on this repo."
            exit 1
          fi
          node _os/automation/bin/workshop-lp-deploy.js
