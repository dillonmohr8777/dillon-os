name: Deploy weekly site-factory preview hub

# One Netlify site, one hub URL, 25 /sites/<slug>/ paths.
# Uses the existing NETLIFY_AUTH_TOKEN repo secret. Pins the site by name so
# this cannot overwrite immohrtal-site or a client property.

on:
  push:
    branches:
      - cursor/phl-w33-pop-pass-140b
      - cursor/align-hcm-animated-homepages-d200
  workflow_dispatch:
    inputs:
      batch_id:
        description: Batch directory and exact Netlify site name
        required: true
        type: choice
        options:
          - phl-2026-w33
          - phl-2026-w34

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.batch_id || 'push' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select and confirm the built 25-site batch
        env:
          REQUESTED_BATCH: ${{ inputs.batch_id }}
        run: |
          if [ -n "$REQUESTED_BATCH" ]; then
            BATCH_ID="$REQUESTED_BATCH"
          elif [ "$GITHUB_REF_NAME" = "cursor/phl-w33-pop-pass-140b" ]; then
            BATCH_ID="phl-2026-w33"
          else
            BATCH_ID="phl-2026-w34"
          fi
          BATCH_DIR="02_Campaigns/AI Site Builder Outreach Engine/batches/$BATCH_ID"
          test -f "$BATCH_DIR/index.html"
          test -d "$BATCH_DIR/sites"
          echo "sites: $(find "$BATCH_DIR/sites" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "BATCH_ID=$BATCH_ID" >> "$GITHUB_ENV"
          echo "BATCH_DIR=$BATCH_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy hub + 25 site paths
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is empty. Set it in repo Actions secrets."
            exit 1
          fi
          node _os/automation/bin/batch-deploy.js --batch "$BATCH_DIR" --site "$BATCH_ID"
