name: Deploy Radar D1 Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-radar-d1-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dillon-radar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: _os/radar-d1
          command: deploy
