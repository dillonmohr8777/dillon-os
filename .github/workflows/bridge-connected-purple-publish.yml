name: Publish Bridge Connected purple

# One-shot production publish for the existing unified review URL.
# Only the commit whose message starts with the title below runs this job.
# Do not leave a push-to-prod trigger on later vault commits.
on:
  push:
    branches:
      - cursor/bridge-phase-three-acda

permissions:
  contents: read

concurrency:
  group: bridge-connected-purple-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Publish Bridge Connected purple to unified review URL')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: dillonmohr8777/bridge-discovery-prototype
          ref: 65d4a3eb455be7575e1c4bd5461d8d11f5152cdc
          path: bridge-prototype

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge-prototype/package-lock.json

      - name: Guard tests
        run: node --test _os/test/bridge-connected-publish.test.js

      - name: Build Modern Network staging
        working-directory: bridge-prototype
        run: |
          if [ -n "${NEXT_PUBLIC_BRIDGE_API_BASE:-}" ]; then
            echo "refusing: NEXT_PUBLIC_BRIDGE_API_BASE must stay unset"
            exit 1
          fi
          npm ci
          node scripts/build-staging-one.mjs network

      - name: Publish to existing bridge-connected-signal only
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          BRIDGE_SOURCE_SHA: 65d4a3eb455be7575e1c4bd5461d8d11f5152cdc
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not set on this repo."
            exit 1
          fi
          node _os/automation/bin/bridge-connected-publish.js bridge-prototype/staging/network
