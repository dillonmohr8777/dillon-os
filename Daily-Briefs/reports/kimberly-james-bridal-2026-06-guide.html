<script>
const D = JSON.parse(document.getElementById('report-data').textContent);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const root = document.documentElement;
if (D.theme) {
  if (D.theme.accent) root.style.setProperty('--accent', D.theme.accent);
  if (D.theme.accent2) root.style.setProperty('--accent-2', D.theme.accent2);
}
const agency = D.agency || 'Momentum 360';
const draft = !!D.sampleData;

/* ---- title: highlight one word of the client name ---- */
function coverTitle() {
  const words = D.client.split(' ');
  const hlWord = D.theme && D.theme.titleWord ? D.theme.titleWord : words[0];
  const name = words.map(w => w === hlWord ? `<span class="hl">${esc(w)}</span>` : esc(w)).join(' ');
  return `${name}<br>${esc(D.reportNoun || 'Performance Report')}`;
}

function dotsField(seed) {
  const pos = [[10,20,7],[42,8,9],[70,30,7],[25,55,8],[58,62,10],[88,70,7],[35,88,7],[75,95,9]];
  return pos.map((p,i) => `<i style="left:${p[0]}%;top:${p[1]}%;width:${p[2]}px;height:${p[2]}px;background:${i%2 ? 'var(--accent-2)' : 'var(--accent)'};opacity:.85"></i>`).join('');
}

function deltaChip(k) {
  if (!k.delta) return '';
  const isDown = k.delta.trim().startsWith('-');
  const good = k.deltaGoodWhenDown ? isDown : !isDown;
  const cls = k.delta.replace(/[+\-%]/g,'') === '0' ? 'flat' : (good ? 'up' : 'down');
  const arrow = isDown ? '▼' : '▲';
  return `<span class="k-delta ${cls}">${arrow} ${esc(k.delta)} vs May</span>`;
}

function barChart(c) {
  const W = 320, H = 150, padL = 8, padB = 22, padT = 16;
  const max = Math.max(...c.values) * 1.15 || 1;
  const n = c.values.length;
  const bw = Math.min(38, (W - padL*2) / n * .58);
  const gap = (W - padL*2) / n;
  let bars = '', labels = '', grid = '';
  for (let g = 1; g <= 3; g++) {
    const y = padT + (H - padB - padT) * g / 3;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padL}" y2="${y}" stroke="#EEE8DC" stroke-width="1"/>`;
  }
  c.values.forEach((v,i) => {
    const h = (H - padB - padT) * v / max;
    const x = padL + gap*i + (gap-bw)/2;
    const y = H - padB - h;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="url(#bg${c._i})"/>`;
    bars += `<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="9" font-weight="700" fill="#1B2A44">${c.prefix||''}${v.toLocaleString()}</text>`;
    labels += `<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="8.5" fill="#8B95A9">${esc(c.labels[i])}</text>`;
  });
  return `<div class="chart-card"><h4>${esc(c.title)}</h4>
    <svg viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="bg${c._i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c._i % 2 ? 'var(--accent-2)' : 'var(--accent)'}"/>
        <stop offset="1" stop-color="${c._i % 2 ? 'color-mix(in srgb, var(--accent-2) 60%, var(--card-navy))' : 'color-mix(in srgb, var(--accent) 60%, var(--card-navy))'}"/>
      </linearGradient></defs>
      ${grid}${bars}${labels}</svg></div>`;
}

function head(section) {
  return `<div class="page-head"><span class="ph-left">${esc(D.client)} · ${esc(D.periodLabel)} Report${draft ? '<span class="draft-tag">Draft</span>' : ''}</span><span class="ph-right">${esc(section)}</span></div>`;
}
function foot(n) {
  return `<div class="page-foot"><span class="f-brand">${esc(agency)}</span><span class="f-mid">${esc(D.periodLabel)} Edition</span><span class="f-num">${n}</span></div>`;
}
function ghost(n) {
  const s = String(n).padStart(2,'0');
  return `<div class="ghost-num"><b>${s[0]}</b><span>${s[1]}</span></div>`;
}
function chapRule() {
  return `<div class="chap-rule"><span class="bar"></span><i style="background:var(--accent)"></i><i style="background:var(--accent)"></i><i style="background:var(--accent-2)"></i><i style="background:var(--accent-2)"></i></div>`;
}

/* ---------- PAGE 1 : COVER ---------- */
const services = (D.servicesLine || '').toUpperCase();
const cover = `
<div class="page cover">
  <div class="cover-blob"></div><div class="cover-blob-2"></div>
  <div class="dots">${dotsField()}</div>
  <div class="cover-inner">
    <div class="agency-mark"><span class="m360">${esc(agency)}</span><span class="sub">PERFORMANCE INTELLIGENCE</span></div>
    <div class="client-badge">${D.logo ? `<img src="${D.logo}" alt="${esc(D.client)}">` : `<div class="cb-name">${esc(D.client)}</div>`}<div class="cb-tag">${esc(D.industryTag || 'Client Partner')}</div></div>
    ${draft ? '<div class="draft-ribbon">Draft · Pending Final ' + esc(D.periodLabel) + ' Actuals</div>' : ''}
    <div class="cover-kicker">${esc(D.periodLabel)} &nbsp;·&nbsp; Monthly Performance Report</div>
    <h1 class="cover-title">${coverTitle()}</h1>
    <p class="cover-sub">${esc(D.coverSub || D.summary)}</p>
    <div class="cover-rule"></div>
    <div class="cover-meta">
      <div><div class="label">Prepared by</div><div class="value">${esc(D.preparedBy || 'Dillon Mohr')}</div></div>
      <div><div class="label">Period</div><div class="value">${esc(D.periodLabel)}</div></div>
      <div><div class="label">Engagement</div><div class="value">${esc(services)}</div></div>
    </div>
  </div>
  <div class="core-card"><div class="cc-label">The Bottom Line</div><div class="cc-text">${D.headline || esc(D.summary)}</div></div>
</div>`;

/* ---------- PAGE 2 : SNAPSHOT ---------- */
const kpis = (D.kpis || []).map(k => `
  <div class="kpi-card"><div class="k-label">${esc(k.label)}</div><div class="k-value">${esc(k.value)}</div>
  <div class="k-sub">${esc(k.sub || '')}</div>${deltaChip(k)}</div>`).join('');
const charts = (D.charts || []).map((c,i) => { c._i = i; return barChart(c); }).join('');
const snapshot = `
<div class="page"><div class="inner">
  ${head('Chapter One')}
  <div class="chap-kicker">Chapter One</div>
  <h2 class="chap-title">Performance <span class="hl">Snapshot</span></h2>
  ${chapRule()}
  <p class="chap-lead">${D.snapshotLead || esc(D.summary)}</p>
  <div class="kpi-row" style="--kpi-cols:${Math.min((D.kpis||[]).length,4)}">${kpis}</div>
  <div class="charts ${(D.charts||[]).length === 1 ? 'single' : ''}">${charts}</div>
  <div class="takeaway"><div class="t-label">Month Takeaway</div><p>${D.takeaway || esc(D.summary)}</p></div>
  ${ghost(1)}${foot(2)}
</div></div>`;

/* ---------- PAGE 3 : WORK & WINS ---------- */
const camps = (D.campaigns || []).map(c => `
  <div class="camp-card">
    <div class="c-name">${esc(c.name)}</div>
    <div class="c-side"><span class="chip ${esc(c.status)}">${esc(c.statusLabel || c.status)}</span>
    <span class="c-nums">${c.spend && c.spend !== '—' ? '<b>' + esc(c.spend) + '</b> · ' : ''}${esc(c.results || '')}</span></div>
    <div class="c-note">${esc(c.note || '')}</div>
  </div>`).join('');
const wins = (D.wins || []).map((w,i) => `
  <div class="win-row"><div class="num-chip ${i%2 ? 'alt' : ''}">${i+1}</div><p>${w}</p></div>`).join('');
const work = `
<div class="page"><div class="inner">
  ${head('Chapter Two')}
  <div class="chap-kicker">Chapter Two</div>
  <h2 class="chap-title">Where the Work <span class="hl">Went</span></h2>
  ${chapRule()}
  <div class="sec-h"><span class="tick"></span><h3>${esc(D.workBoardTitle || 'Campaign board')}</h3></div>
  ${camps}
  <div class="sec-h" style="margin-top:20px"><span class="tick"></span><h3>What moved this month</h3></div>
  ${wins}
  ${ghost(2)}${foot(3)}
</div></div>`;

/* ---------- PAGE 4 : PLAN ---------- */
const actions = (D.actions || []).map((a,i) => `
  <div class="win-row"><div class="num-chip ${i%2 ? 'alt' : ''}">${i+1}</div><p>${a}</p></div>`).join('');
const quote = D.quote ? `<div class="quote-card"><span class="q-mark">”</span><p>${esc(D.quote)}</p><div class="q-src">${esc(D.client)} · ${esc(D.periodLabel)} · ${esc(agency)}</div></div>` : '';
const plan = `
<div class="page"><div class="inner">
  ${head('Chapter Three')}
  <div class="chap-kicker">Chapter Three</div>
  <h2 class="chap-title">The Plan for <span class="hl">Next Month</span></h2>
  ${chapRule()}
  <div class="sec-h"><span class="tick"></span><h3>Priorities on deck</h3></div>
  ${actions}
  ${quote}
  <div class="contact-card">
    <div class="cc-l"><div class="lab">Your account team</div><div class="who">${esc(D.preparedBy || 'Dillon Mohr')}</div><div class="em">${esc(D.contact || '')}</div></div>
    <div class="cc-r">Questions on anything in this report? Reply any time and we'll walk through it together.</div>
  </div>
  ${ghost(3)}${foot(4)}
</div></div>`;

document.getElementById('doc').innerHTML = cover + snapshot + work + plan;
</script>
</body>
</html>
