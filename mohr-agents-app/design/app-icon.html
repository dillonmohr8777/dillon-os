<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .icon{
    width:1024px;height:1024px;position:relative;overflow:hidden;
    background:#FBF7F1;
    background-image:radial-gradient(circle at 50% 42%, rgba(255,102,0,.22), rgba(31,90,166,.06) 46%, transparent 70%);
    display:grid;place-items:center;
  }
  svg{width:620px;height:auto;filter:drop-shadow(0 24px 40px rgba(60,30,0,.18))}
</style></head><body>
  <div class="icon">
    <svg viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#2F9E36"/>
          <stop offset=".55" stop-color="#FF6600"/>
          <stop offset="1" stop-color="#1F5AA6"/>
        </linearGradient>
      </defs>
      <path d="M2 22 L13 5 L15 14 L30 1 L20 20 L18 12 Z" fill="url(#g)"/>
    </svg>
  </div>
</body></html>
